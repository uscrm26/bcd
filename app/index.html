<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>客戶管理平台</title>
<style>
  :root{
    --bg:#0e1116; --card:rgba(22,27,36,.72); --ink:#e8edf4; --sub:#8b94a3; --line:rgba(255,255,255,.09);
    --brand:#5b7cfa; --brand2:#34d0c8; --brand-soft:rgba(91,124,250,.14);
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 50px rgba(0,0,0,.35);
    --glow:0 0 0 1px rgba(91,124,250,.35),0 12px 40px rgba(91,124,250,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(91,124,250,.18),transparent 60%),
    radial-gradient(900px 500px at 0% 110%,rgba(52,208,200,.12),transparent 55%),
    var(--bg);color:var(--ink);min-height:100vh}
  /* ---------- 登入頁 ---------- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99;background:radial-gradient(900px 500px at 30% 0%,rgba(91,124,250,.22),transparent 55%),#0b0e13}
  .gate-card{background:linear-gradient(180deg,rgba(30,36,47,.9),rgba(16,20,28,.9));border:1px solid var(--line);border-radius:24px;padding:34px;width:100%;max-width:400px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .brand .mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:var(--glow)}
  .brand h1{font-size:19px;letter-spacing:.2px}
  .gate-sub{color:var(--sub);font-size:12.5px;margin-bottom:22px}
  .lang-pick{display:flex;gap:8px;margin-bottom:20px}
  .lang-pick button{flex:1;padding:9px 6px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:11px;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .lang-pick button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
  .field{margin-bottom:15px}
  .field label{font-size:12px;color:var(--sub);display:block;margin-bottom:7px}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:rgba(255,255,255,.05);color:var(--ink);outline:none}
  .field input:focus{border-color:var(--brand);box-shadow:var(--glow)}
  .field input::placeholder{color:#5a6472}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
  .pinpad button{padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:13px;font-size:19px;cursor:pointer;color:var(--ink)}
  .pinpad button:active{background:var(--brand-soft);border-color:var(--brand)}
  .gate-err{color:var(--bad);font-size:12.5px;min-height:18px;text-align:center;margin-bottom:8px}
  .primary{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:15px;cursor:pointer;box-shadow:var(--glow)}
  /* ---------- 主框架 ---------- */
  #app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;background:rgba(10,13,18,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;z-index:20}
  .topbar .brand h1{font-size:16px}
  .topbar .spacer{flex:1}
  .user-chip{display:flex;align-items:center;gap:10px}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;overflow:hidden;border:1px solid var(--line)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .layout{display:flex;max-width:1200px;margin:0 auto;gap:18px;padding:20px}
  .side{width:200px;flex-shrink:0}
  .nav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;background:transparent;border-radius:12px;font-size:14px;color:var(--sub);cursor:pointer;text-align:left}
  .nav button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .main{flex:1;min-width:0}
  .panel{display:none}
  .panel.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;backdrop-filter:blur(10px)}
  .h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  /* 客戶卡片 */
  .cust{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;align-items:center;background:rgba(255,255,255,.02)}
  .cust .avatar{width:56px;height:72px;border-radius:12px;flex-shrink:0;font-size:20px}
  .cust .info{flex:1;min-width:0}
  .cust .name{font-size:15px;font-weight:600}
  .cust .meta{color:var(--sub);font-size:12.5px;margin-top:3px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;margin-left:6px}
  .mine{background:rgba(52,211,153,.15);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
  .other{background:var(--brand-soft);color:#c7d4ff;border:1px solid rgba(91,124,250,.3)}
  .sendstate{font-size:12.5px;display:flex;align-items:center;gap:6px}
  .tick{color:var(--ok);font-weight:700}
  .nosend{color:var(--sub)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--sub);font-weight:600}
  /* 信箱 */
  .mailbox{display:flex;flex-direction:column;height:560px}
  .thread{flex:1;overflow:auto;padding:8px 0}
  .msg{max-width:78%;padding:11px 13px;border-radius:13px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
  .msg.in{background:#f2f4f6;align-self:flex-start}
  .msg.out{background:var(--brand);color:#fff;align-self:flex-end;margin-left:auto}
  .composer{border-top:1px solid var(--line);padding-top:12px}
  .composer textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:11px;padding:11px;resize:vertical;font-family:inherit}
  .row{display:flex;gap:9px;margin-top:9px;align-items:center}
  .ghost{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer}
  .ai{background:#eef2ff;color:#4338ca}
  .tag{font-size:11px;color:var(--sub)}
  @media(max-width:820px){.layout{flex-direction:column}.side{width:100%}.nav{display:flex;overflow:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ===== 登入頁 ===== -->
<div id="gate">
  <div class="gate-card">
    <div class="brand"><div class="mark">K</div><h1 data-i18n="appName">客戶管理平台</h1></div>
    <div class="gate-sub" data-i18n="slogan">登入以查看你負責的客戶</div>
    <div class="lang-pick">
      <button onclick="setLang('en')">English</button>
      <button onclick="setLang('zh-Hant')" class="on">繁體中文</button>
      <button onclick="setLang('zh-Hans')">简体中文</button>
    </div>
    <div class="field"><label data-i18n="account">帳號</label>
      <input id="acctInput" autocomplete="username" data-i18n-ph="acctPh" placeholder="輸入你的帳號">
    </div>
    <div class="pinpad" id="pinpad"></div>
    <div class="gate-err" id="gateErr"></div>
    <button class="primary" onclick="tryLogin()" data-i18n="login">登入</button>
  </div>
</div>

<!-- ===== 主框架 ===== -->
<div id="app">
  <div class="topbar">
    <div class="brand"><div class="mark">K</div><h1 data-i18n="appName">客戶管理平台</h1></div>
    <div class="spacer"></div>
    <div class="lang-pick" style="margin:0">
      <button onclick="setLang('en')">English</button>
      <button onclick="setLang('zh-Hant')" class="on">繁體中文</button>
      <button onclick="setLang('zh-Hans')">简体中文</button>
    </div>
    <div class="user-chip">
      <div class="avatar" id="meAvatar">K</div>
      <div><div id="meName" style="font-size:13.5px;font-weight:600"></div><div class="tag" id="meRole"></div></div>
      <button class="ghost" onclick="logout()" data-i18n="switch">切換</button>
    </div>
  </div>
  <div class="layout">
    <aside class="side"><div class="nav" id="nav"></div></aside>
    <main class="main">
      <!-- 我的客戶 -->
      <section class="panel on" data-view="clients">
        <div class="card">
          <div class="h2"><span data-i18n="myClients">我的客戶</span><span class="tag" id="clientCount"></span></div>
          <div id="clientList"></div>
        </div>
      </section>
      <!-- 團隊 -->
      <section class="panel" data-view="team">
        <div class="card"><div class="h2" data-i18n="team">我的團隊</div><div id="teamList"></div></div>
      </section>
      <!-- 公司存檔信箱 -->
      <section class="panel" data-view="mail">
        <div class="card mailbox">
          <div class="h2"><span id="mailCompany">公司信箱</span><span class="tag" data-i18n="archived">離線存檔，不即時外抓</span></div>
          <div class="thread" id="thread"></div>
          <div class="composer">
            <textarea id="draft" placeholder="寫信…"></textarea>
            <div class="row">
              <button class="ghost ai" onclick="aiTranslate()" data-i18n="aiTrans">AI 一鍵翻譯</button>
              <button class="ghost" onclick="saveDraft()" data-i18n="saveDraft">存草稿</button>
              <div class="spacer" style="flex:1"></div>
              <button class="primary" style="width:auto;padding:9px 18px" onclick="sendMail()" data-i18n="send">送出</button>
            </div>
          </div>
        </div>
      </section>
      <!-- 後台，僅 admin -->
      <section class="panel" data-view="admin">
        <div class="card"><div class="h2" data-i18n="admin">超管後台</div>
          <div class="grid2">
            <div><b style="font-size:13.5px" data-i18n="accounts">帳號管理</b><div id="adminAccounts" style="margin-top:10px"></div></div>
            <div><b style="font-size:13.5px" data-i18n="assign">客戶歸屬指派</b><div id="assignList" style="margin-top:10px"></div></div>
          </div>
        </div>
        <div class="card"><div class="h2" data-i18n="audit">操作審計與登入記錄</div><table id="auditTable"></table></div>
      </section>
    </main>
  </div>
</div>

<script>
/* ============================================================
 * 預備骨架：數據先以 mock 呈現，接入時換成 Supabase。
 * 接入點標記：// [SB] 此處改 Supabase 讀寫
 * ============================================================ */

// [SB] Supabase 即時連線
const SUPA_URL="https://xlcyumbyqcwedqwpspzs.supabase.co";
const SUPA_KEY="sb_publishable_FlQqq0Zg6PgO_bJ9FuLGWw_MdgpYpe5";
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

// 離線兜底種子（Supabase 連不上時用）
const MOCK = {
  accounts:[
    {id:'kevinyama', name:'Kevin W', pin:'0521', role:'admin', parent:null, avatar:null},
    {id:'ryanfan', name:'Ryan F', pin:'5467', role:'rep', parent:'kevinyama', avatar:null}
  ],
  clients:[
    {key:'immunora', name:'Immunora Bio LLC', legal:'Kashay Odom', owner:'kevinyama', status:'審批中', sent:true},
    {key:'oliveware', name:'Oliveware LLC', legal:'Horacio Sanchez', owner:'ryanfan', status:'可啟動', sent:false},
    {key:'pebblehome', name:'Pebblehome LLC', legal:'Christopher Hodge', owner:'kevinyama', status:'待補件', sent:false},
    {key:'sageware', name:'Sageware LLC', legal:'Jaliar Thomas', owner:'ryanfan', status:'可啟動', sent:true},
    {key:'nervaqon', name:'Nervaqon LLC', legal:'Christian Punzalan', owner:'kevinyama', status:'可啟動', sent:false}
  ],
  thread:[
    {dir:'in', text:'Hi, we need a continuous customs bond, please send pricing.'},
    {dir:'out', text:'Hello, thanks for reaching out. Here is the required document list…'}
  ]
};

const I18N = {
  'zh-Hant':{appName:'客戶管理平台',slogan:'登入以查看你負責的客戶',account:'帳號',acctPh:'輸入你的帳號',login:'登入',switch:'切換',myClients:'我的客戶',team:'我的團隊',mail:'公司信箱',admin:'超管後台',archived:'離線存檔，不即時外抓',aiTrans:'AI 一鍵翻譯',saveDraft:'存草稿',send:'送出',accounts:'帳號管理',assign:'客戶歸屬指派',audit:'操作審計與登入記錄',mine:'我',other:'其他人',unit:' 家',sentDone:'✓ 已發',sentNot:'○ 未發送',emptyTeam:'尚無下屬',err:'帳號或密碼錯誤',aiTransNote:'接入 AI 後，此處將譯為所選語言並存入公司會話，不覆蓋原文。',saveNote:'草稿存入公司會話（接入 Supabase）',sendNote:'信件經受控通道代發，受理成功即打勾標已發，本人與 admin 看板同步。',adminMeta:'後台上傳頭像 · 改密 · 停用',assignNow:'目前',reassign:'改派',auditTime:'時間',auditWho:'操作人',auditAct:'動作',auditTarget:'對象',auditNote:'接入後這裡顯示點了什麼、看了什麼、裝置與IP'},
  'zh-Hans':{appName:'客户管理平台',slogan:'登录以查看你负责的客户',account:'账号',acctPh:'输入你的账号',login:'登入',switch:'切换',myClients:'我的客户',team:'我的团队',mail:'公司信箱',admin:'超管后台',archived:'离线存档，不实时外抓',aiTrans:'AI 一键翻译',saveDraft:'存草稿',send:'送出',accounts:'账号管理',assign:'客户归属指派',audit:'操作审计与登入记录',mine:'我',other:'其他人',unit:' 家',sentDone:'✓ 已发',sentNot:'○ 未发送',emptyTeam:'暂无下属',err:'账号或密码错误',aiTransNote:'接入 AI 后，此处将译为所选语言并存至公司会话，不覆盖原文。',saveNote:'草稿存入公司会话（接入 Supabase）',sendNote:'信件经受控通道代发，受理成功即打勾标已发，本人与 admin 看板同步。',adminMeta:'后台上传头像 · 改密 · 停用',assignNow:'目前',reassign:'改派',auditTime:'时间',auditWho:'操作人',auditAct:'动作',auditTarget:'对象',auditNote:'接入后这里显示点了什么、看了什么、设备与IP'},
  'en':{appName:'Client Management Platform',slogan:'Sign in to see your clients',account:'Account',acctPh:'Enter your account',login:'Sign in',switch:'Switch',myClients:'My Clients',team:'My Team',mail:'Company Mailbox',admin:'Admin Console',archived:'Archived locally, not fetched live',aiTrans:'AI Translate',saveDraft:'Save draft',send:'Send',accounts:'Accounts',assign:'Assign ownership',audit:'Audit & login logs',mine:'Me',other:'Other',unit:' clients',sentDone:'✓ Sent',sentNot:'○ Not sent',emptyTeam:'No subordinates',err:'Invalid account or password',aiTransNote:'After connecting AI, this will be translated to the selected language and saved to the company thread without overwriting the original.',saveNote:'Draft saved to company thread (after Supabase)',sendNote:'Mail goes through a controlled channel; once accepted it is marked sent and synced to your and admin dashboards.',adminMeta:'Upload avatar · change password · deactivate',assignNow:'Owner',reassign:'Reassign',auditTime:'Time',auditWho:'Actor',auditAct:'Action',auditTarget:'Target',auditNote:'After connecting, this shows what was clicked, viewed, device and IP'}
};
let lang=localStorage.getItem('cmp_lang')||'zh-Hant', session=null, currentView='clients';
const LANG_LABEL={en:'English','zh-Hant':'繁體中文','zh-Hans':'简体中文'};

function t(k){return I18N[lang][k]!=null?I18N[lang][k]:k;}
function setLang(l){lang=l;localStorage.setItem('cmp_lang',l);document.querySelectorAll('.lang-pick button').forEach(b=>b.classList.toggle('on',b.textContent===LANG_LABEL[l]));applyI18N();if(session){buildNav();show(currentView);renderClients();}}
function applyI18N(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k]!=null)el.textContent=I18N[lang][k];});document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.dataset.i18nPh;if(I18N[lang][k]!=null)el.placeholder=I18N[lang][k];});}

// 登入
let pin='';
const pad=document.getElementById('pinpad');
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;
  b.onclick=()=>{ if(k==='⌫'){pin=pin.slice(0,-1);} else if(k){pin+=k;} document.getElementById('gateErr').textContent=''; };
  pad.appendChild(b);
});
async function tryLogin(){
  const id=document.getElementById('acctInput').value.trim().toLowerCase();
  let acc=null;
  try{
    const {data,error}=await sb.from('accounts').select('*').eq('id',id).eq('pin',pin).eq('active',true).maybeSingle();
    if(error) throw error;
    acc=data;
  }catch(e){ acc=MOCK.accounts.find(a=>a.id===id&&a.pin===pin)||null; }
  if(acc){
    localStorage.setItem('cmp_last_acct',id); localStorage.setItem('cmp_session',JSON.stringify(acc)); session=acc;
    // 寫登入與裝置記錄
    sb.from('login_logs').insert({account_id:acc.id,display_name:acc.display_name,role:acc.role}).then(()=>{});
    sb.from('device_logs').insert({account_id:acc.id,display_name:acc.display_name,device:navigator.userAgent,lang:lang}).then(()=>{});
    enter();
  } else { document.getElementById('gateErr').textContent=t('err'); pin=''; }
}
function logout(){session=null;localStorage.removeItem('cmp_session');document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';pin='';document.getElementById('gateErr').textContent='';}

function enter(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('meName').textContent=session.display_name||session.name;
  document.getElementById('meRole').textContent=session.role==='admin'?'Admin':t('other');
  buildNav(); show('clients'); renderClients();
}
// 保持登入：刷新自動回位
function restore(){
  const s=localStorage.getItem('cmp_session');
  if(s){ try{ session=JSON.parse(s); enter(); }catch(e){ session=null; } }
}
function buildNav(){
  const items=[['clients','myClients'],['team','team'],['mail','mail']];
  if(session.role==='admin') items.push(['admin','admin']);
  document.getElementById('nav').innerHTML=items.map(([v,k])=>`<button onclick="show('${v}')" class="${v===currentView?'on':''}">${t(k)}</button>`).join('');
}
function show(v){currentView=v;document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.view===v));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.textContent===t(['myClients','team','mail','admin'][['clients','team','mail','admin'].indexOf(v)])));}

let DB={clients:MOCK.clients, accounts:MOCK.accounts};
async function loadData(){
  try{
    const [c,a]=await Promise.all([
      sb.from('client_ownership').select('*'),
      sb.from('accounts').select('*')
    ]);
    if(c.data&&c.data.length) DB.clients=c.data.map(r=>({key:r.client_key,name:r.client_name,owner:r.owner,status:r.status,sent:r.status&&r.status.indexOf('已發')>=0}));
    if(a.data&&a.data.length) DB.accounts=a.data;
  }catch(e){}
}
function myClients(){ return session.role==='admin'?DB.clients:DB.clients.filter(c=>c.owner===session.id); }
async function renderClients(){
  await loadData();
  const list=myClients();
  document.getElementById('clientCount').textContent=list.length+t('unit');
  document.getElementById('clientList').innerHTML=list.map(c=>{
    const mine=c.owner===session.id;
    const owner=DB.accounts.find(a=>a.id===c.owner);
    return `<div class="cust">
      <div class="avatar">${(c.name||'?').slice(0,1)}</div>
      <div class="info">
        <div class="name">${c.name}<span class="badge ${mine?'mine':'other'}">${mine?t('mine'):(owner?(owner.display_name||owner.name):'—')}</span></div>
        <div class="meta">${c.status}</div>
        <div class="sendstate">${c.sent?`<span class="tick">${t('sentDone')}</span>`:`<span class="nosend">${t('sentNot')}</span>`}</div>
      </div>
      <button class="ghost" onclick="openMail('${c.key}')">${t('mail')}</button>
    </div>`;
  }).join('');
  renderTeam(); renderAdmin();
}
function renderTeam(){
  const subs=DB.accounts.filter(a=>a.parent_id===session.id||a.parent===session.id);
  document.getElementById('teamList').innerHTML=(subs.length?subs:[]).map(a=>`<div class="cust"><div class="avatar">${a.name.slice(0,1)}</div><div class="info"><div class="name">${a.name}</div><div class="meta">${a.role}</div></div></div>`).join('')||`<div class="tag">${t('emptyTeam')}</div>`;
}
function openMail(key){
  const c=DB.clients.find(x=>x.key===key);
  document.getElementById('mailCompany').textContent=c.name;
  document.getElementById('thread').innerHTML=MOCK.thread.map(m=>`<div class="msg ${m.dir}">${m.text}</div>`).join('');
  show('mail');
}

function renderAdmin(){
  if(session.role!=='admin')return;
  document.getElementById('adminAccounts').innerHTML=DB.accounts.map(a=>`<div class="cust"><div class="avatar">${a.display_name.slice(0,1)}</div><div class="info"><div class="name">${a.display_name} <span class="tag">${a.role}</span></div><div class="meta">${t('adminMeta')}</div></div></div>`).join('');
  document.getElementById('assignList').innerHTML=DB.clients.map(c=>`<div class="cust"><div class="info"><div class="name">${c.name}</div><div class="meta">${t('assignNow')}：${(DB.accounts.find(a=>a.id===c.owner)||{}).display_name||'—'}　<button class="ghost" style="padding:5px 10px">${t('reassign')}</button></div></div></div>`).join('');
  document.getElementById('auditTable').innerHTML=`<tr><th>${t('auditTime')}</th><th>${t('auditWho')}</th><th>${t('auditAct')}</th><th>${t('auditTarget')}</th></tr><tr><td colspan="4" class="tag">${t('auditNote')}</td></tr>`;
}
// 初始化：記住語言、預填帳號、恢復登入
document.getElementById('acctInput').value=localStorage.getItem('cmp_last_acct')||'';
document.querySelectorAll('.lang-pick button').forEach(b=>b.classList.toggle('on',b.textContent===LANG_LABEL[lang]));
applyI18N();
restore();
</script>
