<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bond Client Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://smtpjs.com/v3/smtp.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e6e9ef;--ink:#1a2233;--mut:#6b7688;--brand:#2f6bff;--brand2:#5b8cff;--green:#12a05a;--shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit}
#gate{min-height:100vh;display:flex;flex-direction:column;background:#0b1730}
.gate-top{height:60px;display:flex;align-items:center;gap:10px;padding:0 28px;color:#fff}
.gate-top img{width:30px;height:30px;border-radius:8px}
.gate-top b{font-size:15px}.gate-top small{opacity:.6;font-size:11px;margin-left:8px}
.gate-body{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:0 6vw}
.gate-hero{color:#fff}
.gate-hero h2{font-size:34px;line-height:1.3;margin:0 0 14px;font-weight:700}
.gate-hero p{opacity:.7;font-size:14px;line-height:1.8;max-width:420px}
.gate-glow{width:280px;height:280px;border-radius:32px;background:radial-gradient(circle at 30% 20%,#3b82f6,#1e40af 60%,#0b1730);box-shadow:0 30px 80px rgba(59,130,246,.4);margin-bottom:26px}
.gate-card{background:#fff;border-radius:20px;padding:36px 34px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);justify-self:end}
.gate-sub{color:var(--mut);margin:6px 0 20px;font-size:13px}
.lang-pick{display:flex;gap:8px;margin-bottom:20px}
.lang-pick button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.lang-pick button.on{border-color:var(--brand);color:var(--brand);background:#eef4ff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
.primary{padding:12px 26px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#ef4444;font-size:12.5px;min-height:18px;margin:4px 0}
@media(max-width:880px){.gate-body{grid-template-columns:1fr;padding:24px}.gate-hero{display:none}.gate-card{justify-self:center}}
#app{display:none}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand h1{font-size:15px;margin:0}.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:400}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{font-size:11px;color:var(--mut)}
.ghost{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.nav-sec{font-size:11px;color:#9aa4b5;padding:10px 12px 4px;letter-spacing:.5px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 14px;border:none;background:none;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--mut);margin-bottom:2px;text-align:left}
.nav button.on{background:#eef4ff;color:var(--brand);font-weight:600}
.main{flex:1;overflow:auto;background:var(--bg)}
.panel{display:none}.panel.on{display:block}
#frameDash{width:100%;height:calc(100vh - 56px);border:none;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px;box-shadow:var(--shadow)}
.h2{font-size:15px;font-weight:700;margin-bottom:14px}
.toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.mail-list .mail-row{padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.mail-row .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);gap:10px}
.mail-row .sub{font-weight:600;margin:4px 0}
.mail-row .body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.7;white-space:pre-wrap;background:#fafbfd;border-radius:8px;padding:10px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:30px}
.owner-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef4ff;color:var(--brand);margin-left:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{color:var(--mut);font-weight:600;font-size:12px;background:#fafbfd}
.pill{font-size:11px;padding:3px 10px;border-radius:999px;background:#eef4ff;color:var(--brand)}
.pill.gray{background:#f0f2f5;color:var(--mut)}
.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--mut)}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:13px;color:var(--mut)}
.subtabs button.on{border-color:var(--brand);color:var(--brand);background:#eef4ff}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:#fff;border-radius:18px;width:min(680px,92vw);max-height:88vh;overflow:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{margin:0 0 18px;font-size:18px}
.modal .row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.modal label{font-size:12.5px;color:var(--mut);width:64px;flex-shrink:0}
.modal input,.modal select,.modal textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
.modal input,.modal select{flex:1}
.modal textarea{width:100%;height:180px;resize:vertical;line-height:1.6}
.toast{position:fixed;top:70px;right:20px;background:#12a05a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;display:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:900px){.side{width:64px}.nav button span.lbl,.nav-sec{display:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-top"><img src="icon.png" alt="BCD"><b>Bond Client Desk</b><small>客戶管理平台</small></div>
  <div class="gate-body">
    <div class="gate-hero"><div class="gate-glow"></div><h2>Bond Client Desk</h2>
      <p>多帳號即時同步的海關擔保客戶管理平台。歸屬清楚、往來信箱歸檔、開發信漏斗即時更新。</p></div>
    <div class="gate-card">
      <div class="gate-sub">登入以查看你負責的客戶</div>
      <div class="lang-pick">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('zh-Hant')" class="on">繁體中文</button>
        <button onclick="setLang('zh-Hans')">简体中文</button>
      </div>
      <div class="field"><label>帳號</label><input id="acctInput" placeholder="請輸入帳號" autocomplete="username"></div>
      <div class="field"><label>密碼</label><input id="pinInput" type="password" placeholder="請輸入 4 位數密碼" autocomplete="current-password"></div>
      <div class="err" id="gateErr"></div>
      <button class="primary" onclick="tryLogin()">登入</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><img src="icon.png" alt="BCD"><div><h1>Bond Client Desk<small>客戶管理平台</small></h1></div></div>
    <div class="spacer"></div>
    <div class="user-chip">
      <div class="avatar" id="meAvatar">K</div>
      <div><div id="meName" style="font-size:13px;font-weight:600"></div><div class="tag" id="meRole"></div></div>
      <button class="ghost" onclick="logout()">切換登出</button>
    </div>
  </div>
  <div class="layout">
    <aside class="side"><div class="nav" id="nav"></div></aside>
    <main class="main">
      <section class="panel on" data-view="dash"><iframe id="frameDash" src="../index.html"></iframe></section>

      <section class="panel" data-view="bcdmail">
        <div class="card">
          <div class="toolbar">
            <div class="h2" style="margin:0">公司信箱</div>
            <input id="searchBox" style="max-width:280px" placeholder="搜索客戶或 broker" oninput="drawMailList()">
            <div style="flex:1"></div>
            <button class="ghost" onclick="refreshMail()">一鍵更新</button>
            <button class="primary" style="padding:9px 18px;font-size:13.5px" onclick="openCompose()">＋ 寫信</button>
          </div>
          <div class="mail-list" id="mailList"></div>
        </div>
      </section>

      <section class="panel" data-view="board">
        <div class="card">
          <div class="h2">團隊留言板</div>
          <div class="toolbar">
            <input id="boardInput" style="flex:1" placeholder="寫給同事，即時發佈">
            <button class="primary" style="padding:9px 18px;font-size:13.5px" onclick="postBoard()">發佈</button>
          </div>
          <div id="boardList"></div>
        </div>
      </section>

      <section class="panel" data-view="admin">
        <div class="card">
          <div class="subtabs" id="adminTabs">
            <button class="on" data-atab="own" onclick="adminTab('own')">客戶歸屬</button>
            <button data-atab="deal" onclick="adminTab('deal')">成交與金額</button>
            <button data-atab="acct" onclick="adminTab('acct')">帳號管理</button>
            <button data-atab="broker" onclick="adminTab('broker')">broker 池</button>
            <button data-atab="log" onclick="adminTab('log')">登入與審計</button>
          </div>
          <div id="adminBody"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="mask" id="composeMask">
  <div class="modal">
    <h3>寫信 / 回覆</h3>
    <div class="row"><label>從</label><select id="fromSel">
      <option value="kashayisisramonaodom@immunora-bio.com">Immunora &lt;kashayisisramonaodom@immunora-bio.com&gt;</option>
      <option value="horaciolsanchez@olivewareinc.com">Oliveware &lt;horaciolsanchez@olivewareinc.com&gt;</option>
      <option value="christopherhodge@pebblehomeinc.com">Pebblehome &lt;christopherhodge@pebblehomeinc.com&gt;</option>
      <option value="jaliarthomas@sagewareinc.com">Sageware &lt;jaliarthomas@sagewareinc.com&gt;</option>
      <option value="christianjgpunzalan@nervaqon.live">Nervaqon &lt;christianjgpunzalan@nervaqon.live&gt;</option>
    </select></div>
    <div class="row"><label>寄給</label><input id="toInput" list="contactList" placeholder="搜索客戶或 broker email"><datalist id="contactList"></datalist></div>
    <div class="row"><label>主旨</label><input id="subjInput" placeholder="主旨"></div>
    <textarea id="bodyInput" placeholder="內文"></textarea>
    <div class="row" style="margin-top:12px"><label>附件</label><input type="file" id="fileInput" style="flex:1;font-size:13px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="ghost" onclick="closeCompose()">取消</button>
      <button class="primary" onclick="sendMail()">送出</button>
    </div>
  </div>
</div>

<div class="mask" id="dealMask">
  <div class="modal">
    <h3>標成交成功</h3>
    <div class="row"><label>客戶</label><select id="dealClient"></select></div>
    <div class="row"><label>金額</label><input id="dealAmt" type="number" placeholder="例如 1000"></div>
    <div class="row"><label>備註</label><input id="dealNote" placeholder="成交備註"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="ghost" onclick="dealMask(false)">取消</button>
      <button class="primary" onclick="saveDeal()">確認標成功</button>
    </div>
  </div>
</div>

<div class="mask" id="acctMask">
  <div class="modal">
    <h3>新增下線帳號</h3>
    <div class="row"><label>登入名</label><input id="newId" placeholder="小寫英文，例如 ryan2"></div>
    <div class="row"><label>正式名</label><input id="newName" placeholder="例如 Ryan F"></div>
    <div class="row"><label>密碼</label><input id="newPin" maxlength="4" placeholder="4 位數"></div>
    <div class="row"><label>角色</label><select id="newRole"><option value="rep">跟進 rep</option><option value="manager">主管 manager</option></select></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="ghost" onclick="acctMask(false)">取消</button>
      <button class="primary" onclick="saveAccount()">建立帳號</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL="https://xlcyumbyqcwedqwpspzs.supabase.co";
const SUPA_KEY="sb_publishable_FlQqq0Zg6PgO_bJ9FuLGWw_MdgpYpe5";
const sb=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;
const STATUS=["跟進中","待補件","可啟動","審批中","已成交","已關閉"];
const MAILBOX_PW="123456";
const SMTP={host:"mail.pony-it.com",port:587,secure:true};
let session=null, allMail=[], ownership=[], accounts=[], deals=[], adminTabNow='own';
const DASH_TABS=[['now','在處理看板'],['todo','待處理業務'],['daily','每日工作'],['clients','客戶檔案'],['mail','郵件明細'],['webmail','郵箱登錄'],['policy','公司資料'],['company','公司檔案'],['broker','報關經紀資源池'],['notes','我的備註'],['archive','檔案庫']];

function buildNav(){
  const admin=session.role==='admin';
  let html='<div class="nav-sec">業務看板</div>';
  DASH_TABS.forEach(t=>{html+=`<button data-dash="${t[0]}" onclick="goDash('${t[0]}')"><span class="lbl">${t[1]}</span></button>`;});
  html+='<div class="nav-sec">BCD</div>';
  html+=`<button data-v="bcdmail" onclick="show('bcdmail')"><span class="lbl">公司信箱</span></button>`;
  html+=`<button data-v="board" onclick="show('board');loadBoard()"><span class="lbl">團隊留言</span></button>`;
  if(admin)html+=`<button data-v="admin" onclick="show('admin');loadAdmin()"><span class="lbl">超管後台</span></button>`;
  document.getElementById('nav').innerHTML=html;
}
function show(v){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.view===v));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
function goDash(tab){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.view==='dash'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
  const f=document.getElementById('frameDash');
  const fire=()=>{try{f.contentWindow.show(tab,null);}catch(e){}};
  if(f.contentWindow&&f.contentWindow.show){fire();}else{f.onload=fire;}
}
async function tryLogin(){
  const id=document.getElementById('acctInput').value.trim().toLowerCase();
  const pin=document.getElementById('pinInput').value.trim();
  if(!id||!pin){document.getElementById('gateErr').textContent='請輸入帳號與密碼';return;}
  let acc=null;
  try{const {data}=await sb.from('accounts').select('*').eq('id',id).eq('pin',pin).eq('active',true).maybeSingle();acc=data;}catch(e){}
  if(!acc){document.getElementById('gateErr').textContent='帳號或密碼錯誤';return;}
  session=acc;localStorage.setItem('cmp_session',JSON.stringify(acc));
  sb.from('login_logs').insert({account_id:acc.id,display_name:acc.display_name,role:acc.role}).then(()=>{});
  sb.from('audit_logs').insert({account_id:acc.id,display_name:acc.display_name,action:'登入',detail:'登入系統'}).then(()=>{});
  enter();
}
function logout(){session=null;localStorage.removeItem('cmp_session');document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';}
async function enter(){
  document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';
  document.getElementById('meName').textContent=session.display_name;
  document.getElementById('meRole').textContent=session.role==='admin'?'超級管理員':'跟進人員';
  document.getElementById('meAvatar').textContent=(session.display_name||'K').slice(0,1);
  buildNav();goDash('now');
  await Promise.all([loadOwnership(),loadAccounts(),loadDeals(),loadMail()]);
}

async function loadOwnership(){try{const {data}=await sb.from('client_ownership').select('*').order('client_key');ownership=data||[];}catch(e){ownership=[];}}
async function loadAccounts(){try{const {data}=await sb.from('accounts').select('*').order('id');accounts=data||[];}catch(e){accounts=[];}}
async function loadDeals(){try{const {data}=await sb.from('deals').select('*').order('closed_at',{ascending:false});deals=data||[];}catch(e){deals=[];}}

async function loadMail(){try{const r=await fetch('../emails.json?ts='+Date.now());allMail=await r.json();}catch(e){allMail=[];}drawMailList();fillContacts();}
function fillContacts(){const seen={};allMail.forEach(m=>{if(m.from)seen[m.from]=1;});document.getElementById('contactList').innerHTML=Object.keys(seen).map(e=>`<option value="${e}">`).join('');}
function ownerOfClient(c){const o=ownership.find(x=>(x.client_name||'').toLowerCase().includes((c||'').toLowerCase())||x.client_key===(c||'').toLowerCase());return o?o.owner:null;}
function refreshMail(){const last=localStorage.getItem('bcd_last_refresh')||0;const now=Date.now();if(now-last<300000){toast('更新太頻繁，請 5 分鐘後再試');return;}localStorage.setItem('bcd_last_refresh',now);loadMail();toast('已送出更新指令');}
function drawMailList(){
  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  let list=allMail.slice().reverse();
  if(session.role!=='admin'){list=list.filter(m=>{const o=ownerOfClient(m.client);return o&&canSee(o);});}
  if(q)list=list.filter(m=>(m.client+m.from+m.subject).toLowerCase().includes(q));
  const on=id=>(accounts.find(a=>a.id===id)||{}).display_name||id;
  document.getElementById('mailList').innerHTML=list.length?list.map(m=>{const own=ownerOfClient(m.client);return `
    <div class="mail-row" onclick="var b=this.querySelector('.body');b.style.display=b.style.display==='none'?'block':'none'">
      <div class="top"><span>${m.client||''} · ${m.from||''}</span><span>${m.date||''}</span></div>
      <div class="sub">${m.subject||''}${own?`<span class="owner-tag">${own===session.id?'我':on(own)}</span>`:''}</div>
      <div class="body">${(m.body||'').replace(/</g,'&lt;').slice(0,1500)}</div>
    </div>`;}).join(''):'<div class="empty">尚無信件</div>';
}
function openCompose(){document.getElementById('composeMask').classList.add('on');}
function closeCompose(){document.getElementById('composeMask').classList.remove('on');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
async function sendMail(){
  const from=document.getElementById('fromSel').value,to=document.getElementById('toInput').value.trim();
  const subj=document.getElementById('subjInput').value.trim(),body=document.getElementById('bodyInput').value;
  const fname=(document.getElementById('fileInput').files[0]||{}).name||'';
  if(!to){toast('請填收件人');return;}
  let row=null;
  try{const ins=await sb.from('mail_messages').insert({client_name:from.split('@')[1].split('.')[0],sender_account:session.id,from_identity:from,to_addr:to,subject:subj,body:body,status:'pending_send',note:fname}).select();row=ins.data&&ins.data[0];}catch(e){}
  // 即時寄出，走瀏覽器 SMTP 中繼；失敗則退回每小時佇列
  let instant=false;
  try{
    await Email.send({Host:SMTP.host,Username:from,Password:MAILBOX_PW,To:to,From:from,Subject:subj,Body:body+(fname?`\n\n[附件：${fname}]`:''),Secure:SMTP.secure,Port:SMTP.port});
    instant=true;
  }catch(e){instant=false;}
  if(instant&&row){await sb.from('mail_messages').update({status:'sent',sent_at:new Date().toISOString()}).eq('id',row.id);}
  await sb.from('audit_logs').insert({account_id:session.id,display_name:session.display_name,action:'送出郵件',target_client:from,detail:`to ${to} / ${subj} ${instant?'即時':'佇列'}`}).then(()=>{}).catch(()=>{});
  closeCompose();document.getElementById('toInput').value='';document.getElementById('subjInput').value='';document.getElementById('bodyInput').value='';
  toast(instant?'已即時送出':'已存入佇列，稍後寄出');loadMail();
}

/* ===== 後台 ===== */
function adminTab(t){adminTabNow=t;document.querySelectorAll('#adminTabs button').forEach(b=>b.classList.toggle('on',b.dataset.atab===t));renderAdmin();}
async function loadAdmin(){await Promise.all([loadOwnership(),loadAccounts(),loadDeals()]);renderAdmin();}
function onName(id){return (accounts.find(a=>a.id===id)||{}).display_name||id;}
function subtree(rootId){const set=new Set([rootId]);let grew=true;while(grew){grew=false;accounts.forEach(a=>{if(a.parent_id&&set.has(a.parent_id)&&!set.has(a.id)){set.add(a.id);grew=true;}});}return set;}
function visibleOwners(){if(session.role==='admin')return null;return subtree(session.id);}
function canSee(ownerId){const v=visibleOwners();return v===null||v.has(ownerId);}
function renderAdmin(){
  const el=document.getElementById('adminBody');
  if(adminTabNow==='own'){
    const rows=ownership.map(o=>`<tr>
      <td><b>${o.client_name}</b><div style="color:#8a8f98;font-size:11px">${o.client_key}</div></td>
      <td><span class="owner-tag">${onName(o.owner)}</span></td>
      <td><select onchange="reassign('${o.client_key}',this.value)">${accounts.map(a=>`<option value="${a.id}" ${a.id===o.owner?'selected':''}>${a.display_name}（${a.role}）</option>`).join('')}</select></td>
      <td><select onchange="setStatus('${o.client_key}',this.value)">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td style="max-width:220px">${o.note||''}</td>
    </tr>`).join('');
    el.innerHTML=`<div class="toolbar"><div class="h2" style="margin:0">客戶歸屬指派</div><div style="flex:1"></div><button class="primary" style="padding:8px 16px;font-size:13px" onclick="dealMask(true)">＋ 標成交成功</button></div>
    <table class="tbl"><thead><tr><th>客戶</th><th>目前負責人</th><th>改派給</th><th>狀態</th><th>備註</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class="empty">尚無客戶</td></tr>'}</tbody></table>`;
  }else if(adminTabNow==='deal'){
    const mine=deals.filter(d=>canSee(d.owner));
    const total=mine.reduce((s,d)=>s+Number(d.amount||0),0);
    const byOwner={};mine.forEach(d=>{byOwner[d.owner]=(byOwner[d.owner]||0)+Number(d.amount||0);});
    const stats=Object.entries(byOwner).map(([k,v])=>`<div class="stat"><b>$${v.toLocaleString()}</b><span>${onName(k)} 名下成交</span></div>`).join('');
    const rows=mine.map(d=>`<tr><td>${d.client_name}</td><td><span class="owner-tag">${onName(d.owner)}</span></td><td><b>$${Number(d.amount||0).toLocaleString()}</b></td><td>${d.closed_at?new Date(d.closed_at).toLocaleDateString('zh-Hant'):''}</td><td>${d.note||''}</td><td>${onName(d.marked_by)}</td></tr>`).join('');
    el.innerHTML=`<div class="stat-row" style="margin-bottom:14px"><div class="stat"><b>$${total.toLocaleString()}</b><span>成交金額合計</span></div>${stats}</div>
    <table class="tbl"><thead><tr><th>客戶</th><th>負責人</th><th>金額</th><th>成交日</th><th>備註</th><th>標記人</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class="empty">尚無成交單</td></tr>'}</tbody></table>`;
  }else if(adminTabNow==='acct'){
    const rows=accounts.map(a=>`<tr><td><b>${a.display_name}</b><div style="color:#8a8f98;font-size:11px">${a.id}</div></td>
      <td><span class="pill ${a.role==='admin'?'':'gray'}">${a.role==='admin'?'超管':a.role==='manager'?'主管':'跟進'}</span></td>
      <td>${onName(a.parent_id)||'—'}</td>
      <td>${a.active?'<span class="pill">啟用</span>':'<span class="pill gray">停用</span>'}</td>
      <td><button class="ghost" onclick="toggleActive('${a.id}',${!a.active})">${a.active?'停用':'啟用'}</button>
      <button class="ghost" onclick="resetPin('${a.id}')">改密碼</button></td></tr>`).join('');
    el.innerHTML=`<div class="toolbar"><div class="h2" style="margin:0">帳號管理</div><div style="flex:1"></div><button class="primary" style="padding:8px 16px;font-size:13px" onclick="acctMask(true)">＋ 新增下線</button></div>
    <table class="tbl"><thead><tr><th>帳號</th><th>角色</th><th>上級</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  }else if(adminTabNow==='broker'){
    el.innerHTML=`<div class="toolbar"><div class="h2" style="margin:0">broker 資源池</div><input id="bkSearch" placeholder="搜索公司 / email / 電話" oninput="drawBrokers()"></div><div id="bkList" class="empty">載入中…</div>`;
    drawBrokers();
  }else if(adminTabNow==='log'){
    el.innerHTML=`<div class="h2">登入記錄與操作審計</div><div id="logBox" class="empty">載入中…</div>`;
    loadLogs();
  }
}
async function loadLogs(){
  const el=document.getElementById('logBox');
  let ll=[],al=[];
  try{ll=(await sb.from('login_logs').select('*').order('logged_in_at',{ascending:false}).limit(50)).data||[];}catch(e){}
  try{al=(await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(80)).data||[];}catch(e){}
  const lr=ll.map(x=>`<tr><td>${new Date(x.logged_in_at).toLocaleString('zh-Hant')}</td><td>${x.display_name}</td><td>${x.role}</td><td>登入</td></tr>`).join('');
  const ar=al.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('zh-Hant')}</td><td>${x.display_name}</td><td>${x.action}</td><td>${x.target_client||''}</td><td>${x.detail||''}</td></tr>`).join('');
  el.innerHTML=`<table class="tbl"><thead><tr><th>時間</th><th>人</th><th>動作</th><th>目標</th><th>內容</th></tr></thead><tbody>${lr}${ar||'<tr><td colspan=5 class="empty">尚無記錄</td></tr>'}</tbody></table>`;
}
let brokerCache=null;
async function drawBrokers(){
  const box=document.getElementById('bkList');if(!box)return;
  if(!brokerCache){try{brokerCache=await (await fetch('../brokers.json?ts='+Date.now())).json();}catch(e){brokerCache=[];}}
  const q=(document.getElementById('bkSearch').value||'').toLowerCase();
  let list=brokerCache;if(q)list=list.filter(b=>(b.n+b.m+b.c).toLowerCase().includes(q));
  list=list.slice(0,60);
  box.className='';
  box.innerHTML=list.map(b=>`<div class="mail-row"><div class="sub">${b.n}</div><div style="font-size:12px;color:#6b7688">${b.c||''} · ${b.m||''}</div>${b.a?`<div style="font-size:12px;color:#9aa4b5;margin-top:4px">${b.a.replace(/\n/g,' ')}</div>`:''}</div>`).join('')||'<div class="empty">無符合結果</div>';
}
async function reassign(ck,owner){await sb.from('client_ownership').update({owner:owner,updated_at:new Date().toISOString()}).eq('client_key',ck);
  await sb.from('audit_logs').insert({account_id:session.id,display_name:session.display_name,action:'改派歸屬',target_client:ck,detail:`改派給 ${owner}`});
  toast('已改派');loadAdmin();}
async function setStatus(ck,st){await sb.from('client_ownership').update({status:st,updated_at:new Date().toISOString()}).eq('client_key',ck);toast('狀態已更新');}
async function toggleActive(id,on){await sb.from('accounts').update({active:on}).eq('id',id);await sb.from('audit_logs').insert({account_id:session.id,display_name:session.display_name,action:on?'啟用帳號':'停用帳號',target_client:id,detail:''});toast(on?'已啟用':'已停用');loadAdmin();}
async function resetPin(id){const p=prompt('輸入新 4 位密碼');if(!p)return;await sb.from('accounts').update({pin:p}).eq('id',id);toast('密碼已更新');}
function dealMask(on){if(on){document.getElementById('dealClient').innerHTML=ownership.map(o=>`<option value="${o.client_key}|${o.client_name}">${o.client_name}</option>`).join('');}document.getElementById('dealMask').classList.toggle('on',on);}
async function saveDeal(){
  const [ck,cn]=document.getElementById('dealClient').value.split('|');
  const amt=parseFloat(document.getElementById('dealAmt').value)||0;const note=document.getElementById('dealNote').value;
  const o=ownership.find(x=>x.client_key===ck);
  await sb.from('deals').insert({client_key:ck,client_name:cn,owner:o.owner,amount:amt,note:note,marked_by:session.id});
  await sb.from('client_ownership').update({status:'已成交',updated_at:new Date().toISOString()}).eq('client_key',ck);
  await sb.from('audit_logs').insert({account_id:session.id,display_name:session.display_name,action:'標成交',target_client:cn,detail:`$${amt}`});
  document.getElementById('dealMask').classList.remove('on');toast('已標成交');loadAdmin();
}
function acctMask(on){document.getElementById('acctMask').classList.toggle('on',on);}
async function saveAccount(){
  const id=document.getElementById('newId').value.trim().toLowerCase();const nm=document.getElementById('newName').value.trim();const pin=document.getElementById('newPin').value.trim();
  if(!id||!nm||!/^\d{4}$/.test(pin)){toast('登入名、名稱與 4 位密碼必填');return;}
  await sb.from('accounts').insert({id,display_name:nm,pin,role:document.getElementById('newRole').value,parent_id:session.id,active:true});
  await sb.from('audit_logs').insert({account_id:session.id,display_name:session.display_name,action:'新增帳號',target_client:id,detail:nm});
  document.getElementById('acctMask').classList.remove('on');toast('帳號已建立');loadAdmin();
}
async function loadBoard(){
  let rows=[];
  try{const {data}=await sb.from('company_archive').select('*').like('client_key','msg-%').order('updated_at',{ascending:false}).limit(50);rows=data||[];}catch(e){}
  const el=document.getElementById('boardList');if(!el)return;
  el.innerHTML=rows.length?rows.map(r=>{const p=r.profile_json||{};return `
    <div class="mail-row"><div class="top"><span><b>${r.company_name||p.name||''}</b><span class="owner-tag">${r.legal_person||''}</span></span><span>${new Date(r.updated_at).toLocaleString('zh-Hant')}</span></div>
    <div class="sub" style="font-weight:400">${(p.text||'').replace(/</g,'&lt;')}</div></div>`;}).join(''):'<div class="empty">尚無留言，寫第一則</div>';
}
async function postBoard(){
  const t=document.getElementById('boardInput').value.trim();if(!t){toast('先寫內容');return;}
  const key='msg-'+Date.now();
  await sb.from('company_archive').upsert({client_key:key,company_name:session.display_name,legal_person:session.id,profile_json:{name:session.display_name,text:t,ts:new Date().toISOString()},updated_at:new Date().toISOString()});
  document.getElementById('boardInput').value='';loadBoard();toast('已發佈');
}
// 省額度：分頁不可見時暫停；歸屬成交留言 30 秒一次，信件 60 秒一次
function tick(){
  if(document.hidden||!session)return;
  loadOwnership();loadDeals();
  if(document.querySelector('.panel[data-view=board]').classList.contains('on'))loadBoard();
  if(document.querySelector('.panel[data-view=bcdmail]').classList.contains('on'))loadMail();
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
function setLang(){}
(function(){try{const s=JSON.parse(localStorage.getItem('cmp_session')||'null');if(s){session=s;enter();}}catch(e){}})();
</script>
