<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bond Client Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e6e9ef;--ink:#1a2233;--mut:#6b7688;--brand:#2f6bff;--brand2:#5b8cff;--shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit}
#gate{min-height:100vh;display:flex;flex-direction:column;background:#0b1730}
.gate-top{height:60px;display:flex;align-items:center;gap:10px;padding:0 28px;color:#fff}
.gate-top img{width:30px;height:30px;border-radius:8px}
.gate-top b{font-size:15px}.gate-top small{opacity:.6;font-size:11px;margin-left:8px}
.gate-body{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:0 6vw}
.gate-hero{color:#fff}
.gate-hero h2{font-size:34px;line-height:1.3;margin:0 0 14px;font-weight:700}
.gate-hero p{opacity:.7;font-size:14px;line-height:1.8;max-width:420px}
.gate-glow{width:280px;height:280px;border-radius:32px;background:radial-gradient(circle at 30% 20%,#3b82f6,#1e40af 60%,#0b1730);box-shadow:0 30px 80px rgba(59,130,246,.4);margin-bottom:26px;position:relative;overflow:hidden}
.gate-glow::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%)}
.gate-card{background:#fff;border-radius:20px;padding:36px 34px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);justify-self:end}
.gate-sub{color:var(--mut);margin:6px 0 20px;font-size:13px}
.lang-pick{display:flex;gap:8px;margin-bottom:20px}
.lang-pick button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.lang-pick button.on{border-color:var(--brand);color:var(--brand);background:#eef4ff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
.field input:focus{border-color:var(--brand)}
.primary{padding:12px 26px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#ef4444;font-size:12.5px;min-height:18px;margin:4px 0}
@media(max-width:880px){.gate-body{grid-template-columns:1fr;padding:24px}.gate-hero{display:none}.gate-card{justify-self:center}}
#app{display:none}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand h1{font-size:15px;margin:0}.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:400}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{font-size:11px;color:var(--mut)}
.ghost{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:200px;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 14px;border:none;background:none;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--mut);margin-bottom:2px;text-align:left}
.nav button.on{background:#eef4ff;color:var(--brand);font-weight:600}
.main{flex:1;padding:16px;overflow:hidden}
.panel{display:none;height:calc(100vh - 88px)}.panel.on{display:block}
#frameDash{width:100%;height:100%;border:1px solid var(--line);border-radius:14px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.h2{font-size:15px;font-weight:700;margin-bottom:14px}
.mail-wrap{display:grid;grid-template-columns:1fr;gap:0}
.mail-list .mail-row{padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.mail-list .mail-row:hover{border-color:var(--brand)}
.mail-row .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.mail-row .sub{font-weight:600;margin:4px 0}
.mail-row .body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.7;white-space:pre-wrap;background:#fafbfd;border-radius:8px;padding:10px}
.toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.toolbar input{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;flex:1;max-width:320px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:30px}
.owner-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef4ff;color:var(--brand);margin-left:6px}
@media(max-width:900px){.side{width:64px}.nav button span.lbl{display:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-top"><img src="icon.png" alt="BCD"><b>Bond Client Desk</b><small>客戶管理平台</small></div>
  <div class="gate-body">
    <div class="gate-hero"><div class="gate-glow"></div><h2>Bond Client Desk</h2>
      <p>多帳號即時同步的海關擔保客戶管理平台。歸屬清楚、往來信箱歸檔、開發信漏斗即時更新。</p></div>
    <div class="gate-card">
      <div class="gate-sub">登入以查看你負責的客戶</div>
      <div class="lang-pick">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('zh-Hant')" class="on">繁體中文</button>
        <button onclick="setLang('zh-Hans')">简体中文</button>
      </div>
      <div class="field"><label>帳號</label><input id="acctInput" placeholder="請輸入帳號" autocomplete="username"></div>
      <div class="field"><label>密碼</label><input id="pinInput" type="password" placeholder="請輸入 4 位數密碼" autocomplete="current-password"></div>
      <div class="err" id="gateErr"></div>
      <button class="primary" onclick="tryLogin()">登入</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><img src="icon.png" alt="BCD"><div><h1>Bond Client Desk<small>客戶管理平台</small></h1></div></div>
    <div class="spacer"></div>
    <div class="user-chip">
      <div class="avatar" id="meAvatar">K</div>
      <div><div id="meName" style="font-size:13px;font-weight:600"></div><div class="tag" id="meRole"></div></div>
      <button class="ghost" onclick="logout()">切換登出</button>
    </div>
  </div>
  <div class="layout">
    <aside class="side"><div class="nav" id="nav"></div></aside>
    <main class="main">
      <section class="panel on" data-view="dash">
        <iframe id="frameDash" src="../index.html"></iframe>
      </section>
      <section class="panel" data-view="mail">
        <div class="card">
          <div class="toolbar">
            <div class="h2" style="margin:0">公司信箱</div>
            <input id="searchBox" placeholder="搜索客戶或 broker" oninput="drawMailList()">
            <div style="flex:1"></div>
            <button class="ghost" onclick="refreshMail()">一鍵更新</button>
          </div>
          <div class="mail-list" id="mailList"></div>
        </div>
      </section>
      <section class="panel" data-view="admin">
        <div class="card"><div class="h2">超管後台</div><div id="adminBox"></div></div>
      </section>
    </main>
  </div>
</div>

<script>
const SUPA_URL="https://xlcyumbyqcwedqwpspzs.supabase.co";
const SUPA_KEY="sb_publishable_FlQqq0Zg6PgO_bJ9FuLGWw_MdgpYpe5";
const sb=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;
const OWNER={kevinyama:"Kevin W",ryanfan:"Ryan F"};
let session=null, allMail=[];
const NAV=[['dash','看板','Dashboard'],['mail','信箱','Mailbox'],['admin','後台','Admin']];
function buildNav(){
  const admin=session.role==='admin';
  document.getElementById('nav').innerHTML=NAV.filter(n=>n[2]!=='Admin'||admin).map(n=>`<button data-v="${n[0]}" onclick="show('${n[0]}')"><span class="lbl">${n[1]}</span></button>`).join('');
}
function show(v){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.view===v));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
async function tryLogin(){
  const id=document.getElementById('acctInput').value.trim().toLowerCase();
  const pin=document.getElementById('pinInput').value.trim();
  if(!id||!pin){document.getElementById('gateErr').textContent='請輸入帳號與密碼';return;}
  let acc=null;
  try{const {data}=await sb.from('accounts').select('*').eq('id',id).eq('pin',pin).eq('active',true).maybeSingle();acc=data;}catch(e){}
  if(!acc){document.getElementById('gateErr').textContent='帳號或密碼錯誤';return;}
  session=acc;localStorage.setItem('cmp_session',JSON.stringify(acc));
  sb.from('login_logs').insert({account_id:acc.id,display_name:acc.display_name,role:acc.role}).then(()=>{});
  enter();
}
function logout(){session=null;localStorage.removeItem('cmp_session');document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';}
function enter(){
  document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';
  document.getElementById('meName').textContent=session.display_name;
  document.getElementById('meRole').textContent=session.role==='admin'?'超級管理員':'跟進人員';
  document.getElementById('meAvatar').textContent=(session.display_name||'K').slice(0,1);
  buildNav();show('dash');loadMail();
  if(session.role==='admin')document.getElementById('adminBox').innerHTML='<div style="color:#6b7688;font-size:13px">超管後台：新增下線帳號、指派客戶歸屬、查看操作審計與登入裝置記錄。</div>';
}
async function loadMail(){try{const r=await fetch('../emails.json?ts='+Date.now());allMail=await r.json();}catch(e){allMail=[];}drawMailList();}
function refreshMail(){const last=localStorage.getItem('bcd_last_refresh')||0;const now=Date.now();if(now-last<300000){alert('更新太頻繁，請 5 分鐘後再試');return;}localStorage.setItem('bcd_last_refresh',now);loadMail();alert('已送出更新指令，列表即時重整');}
function drawMailList(){
  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  let list=allMail.slice().reverse();
  if(q)list=list.filter(m=>(m.client+m.from+m.subject).toLowerCase().includes(q));
  document.getElementById('mailList').innerHTML=list.length?list.map(m=>`
    <div class="mail-row" onclick="var b=this.querySelector('.body');b.style.display=b.style.display==='none'?'block':'none'">
      <div class="top"><span>${m.client||''} · ${m.from||''}</span><span>${m.date||''}</span></div>
      <div class="sub">${m.subject||''}<span class="owner-tag">${OWNER[m.owner]||'Kevin W'}</span></div>
      <div class="body">${(m.body||'').replace(/</g,'&lt;').slice(0,1500)}</div>
    </div>`).join(''):'<div class="empty">尚無信件</div>';
}
function setLang(){}
(function(){try{const s=JSON.parse(localStorage.getItem('cmp_session')||'null');if(s){session=s;enter();}}catch(e){}})();
</script>
</body>
</html>
