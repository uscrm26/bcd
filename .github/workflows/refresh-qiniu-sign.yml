name: refresh-qiniu-sign
on:
  schedule:
    - cron: "0 3 */25 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install qiniu
      - name: 刷新七牛签名
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: python scripts/refresh_qiniu_sign.py
      - name: 提交更新
        run: |
          git config user.name "Kevin W"
          git config user.email "kevinyama@local"
          git add qiniu_map.json
          git diff --staged --quiet || git commit -m "自动刷新七牛签名链接"
          git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:main
