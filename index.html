<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customs-Bond 內部業務管理系統</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23122030'/%3E%3Ctext x='16' y='22' font-size='16' fill='%237cc0ff' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3ECB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1116; --bg2:#141922; --card:#171d28; --card2:#1d2431;
  --line:#232c3b; --txt:#d7dee8; --mut:#8494a7; --dim:#5b6b80;
  --acc:#4a9eff; --acc2:#7cc0ff; --ok:#3fca8a; --warn:#ffb454; --err:#ff5d6c;
  --ind:#4a9eff; --radius:12px;
}
body[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f8;
  --line:#d8e0ec; --txt:#1c2733; --mut:#5d6f84; --dim:#94a3b5;
  --acc:#1f6fe0; --acc2:#3b8bf5; --ok:#18a05f; --warn:#d98a16; --err:#d83a4b;
  --ind:#1f6fe0;
}
body[data-theme="light"] .side{background:linear-gradient(180deg,#ffffff,#f0f4fa);border-right:1px solid var(--line)}
body[data-theme="light"] .brand .logo{background:linear-gradient(135deg,#dce9fb,#eaf2fc);border-color:#bcd4f5;color:var(--acc)}
body[data-theme="light"] .mtop{background:rgba(255,255,255,.95)}
/* language dropdown */
.lang{position:relative}
.lang .menu{display:none;position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;overflow:hidden;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lang .menu.show{display:block}
.lang .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:10px 14px;font-size:13px;cursor:pointer}
.lang .menu button:hover{background:var(--card2)}
/* notification drawer */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:90;transition:right .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
.drawer.show{right:0}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:10px}
.drawer .dgroup{font-size:11px;color:var(--dim);padding:8px 8px 4px;letter-spacing:.05em}
.drawer .ditem{display:flex;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:var(--card2)}
.drawer .ditem.unread{box-shadow:inset 3px 0 0 var(--err)}
.drawer .ditem .who{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--ind);border-radius:6px;padding:2px 7px;height:fit-content}
.drawer .ditem .tx{flex:1;min-width:0}
.drawer .ditem .tt{font-size:13px;line-height:1.4}
.drawer .ditem .tm{font-size:11px;color:var(--dim);margin-top:2px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.app{display:flex;min-height:100vh}
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line);z-index:60;align-items:center;gap:10px;padding:0 14px}
.mtop .burger{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mtop .mtitle{font-size:14px;font-weight:700;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .bell2{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer;position:relative}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:55}
.overlay.show{display:block}
.side.open{transform:translateX(0)!important}@media(max-width:900px){
  body{overflow-x:hidden}
  .mtop{display:flex}
  .side{display:none;width:248px;z-index:70;transform:none;transition:none}
  .side.open{display:flex}
  .main{margin-left:0;padding:74px 14px 70px}
  .r4{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:repeat(1,1fr)}
  .form-grid{grid-template-columns:1fr}
  .topbar{display:none}
  .panel{overflow:hidden}
  .em,.mailitem .em{overflow-wrap:anywhere;word-break:break-all}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .funnel{flex-wrap:wrap}
  .search input{min-width:120px}
}
/* sidebar */
.side{width:232px;background:linear-gradient(180deg,#12161e,#10131a);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px 14px;display:flex;flex-direction:column;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d3350,#0e1c2e);border:1px solid #2b4a70;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc2);font-size:16px}
.brand .bt{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand .bs{font-size:10px;color:var(--dim)}
.sideclock{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:10px;line-height:1.9;color:var(--mut)}
.sideclock b{color:var(--txt);font-weight:600}
.sideclock .z{display:flex;align-items:center;gap:6px}.sideclock .z .zem{font-size:12px;flex:0 0 auto}.sideclock .z b{flex:1 1 auto}.sideclock .z span:last-child{font-variant-numeric:tabular-nums}
.nav{flex:1;overflow-y:auto}
.nav .grp{font-size:10px;color:var(--dim);text-transform:none;padding:12px 10px 6px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);font-size:13px;margin-bottom:2px;border:1px solid transparent;transition:.15s}
.nav a:hover{background:var(--bg2);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(74,158,255,.14),transparent);color:var(--acc2);border-color:#29476b}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.nav a .dot{margin-left:auto;background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
.side .foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26334a;color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-row .nm{font-size:12px;color:var(--txt)}
.user-row .rl{font-size:10px;color:var(--dim)}
/* main */
.main{margin-left:232px;flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-bottom:20px}
.topbar .time{font-size:11px;color:var(--mut);margin-right:auto;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.lang{position:relative}
.lang button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.bell{position:relative;background:var(--bg2);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:15px}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:700}
/* headings */
h1{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
/* cards */
.row{display:grid;gap:12px}
.row>*{min-width:0}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .lb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:26px;font-weight:800;color:var(--txt);margin-top:6px}
.stat .tg{font-size:11px;color:var(--ok);margin-top:4px}
.stat .tag2{font-size:11px;color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
/* funnel */
.funnel{display:flex;gap:8px;align-items:flex-end}
.fb{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(74,158,255,.5),rgba(74,158,255,.12));border:1px solid #2b4a70;padding:10px 8px 8px;text-align:center;position:relative}
.fb .fv{font-size:20px;font-weight:800;color:var(--acc2)}
.fb .fl{font-size:10px;color:var(--mut);margin-top:2px}
/* chart ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{--p:70;width:150px;height:150px;position:relative;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#26344a 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .rc{position:relative;font-size:22px;font-weight:800;color:var(--txt)}
.legend{display:grid;gap:8px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* view switch */
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.switch button{padding:7px 16px;background:transparent;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.switch button.on{background:#1e3a5c;color:var(--acc2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--mut);text-align:left;padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a2230;color:var(--txt)}
tr:hover td{background:#1a2130}
/* tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.t-blue{background:rgba(74,158,255,.14);color:var(--acc2);border:1px solid #2b4a70}
.t-green{background:rgba(63,202,138,.14);color:var(--ok);border:1px solid #23583f}
.t-amber{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid #5a4527}
.t-red{background:rgba(255,93,108,.14);color:var(--err);border:1px solid #5a2b34}
.t-gray{background:rgba(132,148,167,.14);color:var(--mut);border:1px solid #333c4c}
/* client card */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;position:relative;display:flex;gap:14px;align-items:flex-start}
.ccard:hover{border-color:#2f4a6e;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cphoto{width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid var(--line);background:#1a2230;display:block}
.ccard .cbody{flex:1;min-width:0}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ccard .no{font-size:11px;color:var(--dim)}
.noref{font-weight:400;font-size:9px;color:var(--mut);margin-left:4px;opacity:.8}
.ccard .nm{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.ccard .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7}
.ccard .meta b{color:var(--txt);font-weight:600}
.ccard .foots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ccard .foots .badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.badge.warn{color:var(--err);border-color:#5a2b34}
/* quick buttons */
.quick{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.ccard:hover .quick{opacity:1}
.quick button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer}
.quick button:hover{color:var(--acc2);border-color:#2f4a6e}
/* search */
.search{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.search input{flex:1;min-width:200px}
/* button */
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#2f4a6e;color:var(--acc2)}
.btn.primary{background:linear-gradient(135deg,#1e4d80,#17406c);border-color:#2b5a92;color:#e6f0ff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:11px}
/* mail status */
.mailitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #1a2230}
.mailitem:last-child{border-bottom:0}
.mailitem .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mailitem .st.fail{background:var(--err)}
.mailitem .em{font-size:12px;color:var(--txt);flex:1}
.mailitem .nm{font-size:11px;color:var(--mut)}
.mailitem .unread{background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.mailitem .done{color:var(--dim);font-size:11px}
/* log */
.logrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #1a2230;font-size:12px;align-items:flex-start}
.logrow .t{color:var(--dim);white-space:nowrap;font-size:11px}
.logrow .c{color:var(--txt);flex:1}
.logrow .o{color:var(--ok);font-size:11px;white-space:nowrap}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 16px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.field{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #1a2230;font-size:13px;align-items:start}
.field .k{color:var(--mut)}
.field .v{color:var(--txt)}
.field .v.warn{color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px}
.fg textarea{min-height:80px;resize:vertical}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:560px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-size:16px;margin-bottom:16px;color:var(--txt)}
.mbox .mrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* timeline */
.tl{position:relative;margin-left:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#223048}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tli.e-mail::before{background:var(--acc)}
.tli.e-note::before{background:var(--warn)}
.tli.e-auto::before{background:var(--mut)}
.tli.e-doc::before{background:var(--ok)}
.tli .tt{font-size:13px;color:var(--txt);font-weight:600}
.tli .tm{font-size:11px;color:var(--dim);margin-top:2px}
.tli .tx{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.tli .src{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5c;color:#e6f0ff;padding:11px 20px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;display:none;border:1px solid #2b5a92}
.ghgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docbox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit}
.docbox .fi{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.fthumb{cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.fthumb img{width:100%;height:90px;object-fit:cover;display:block}
.fthumb .fcap{font-size:10px;padding:6px 8px;color:var(--mut);word-break:break-all;line-height:1.3;max-height:3.4em;overflow:hidden}
.docbox .fn{font-size:12px;color:var(--txt);flex:1;word-break:break-all}
.docbox .ft{font-size:10px;color:var(--dim)}
.draftbox{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:2;color:var(--txt)}
.sync{display:inline-block;font-size:10px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sync.ok{color:var(--ok);border:1px solid #23583f}
.sync.no{color:var(--warn);border:1px solid #5a4527}
.sync.fail{color:var(--err);border:1px solid #5a2b34}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.hidden{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .25s;width:248px;z-index:70}.main{margin-left:0}.r4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.ccard .foots .tag,.ccard .foots .badge{font-size:10px}.ccard .cphoto{width:60px;height:60px}.ccard .quick button{font-size:10px}}
</style>
<script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="mtop">
  <button class="burger" onclick="toggleSide()">☰</button>
  <div class="mtitle">Customs-Bond 系統</div>
  <button class="bell2" onclick="openBell()">🔔<span class="n">3</span></button>
  <button class="bell2" title="個人設定" onclick="openPref()">⚙</button>
</div>
<div class="overlay" id="overlay" onclick="toggleSide()"></div>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo">CB</div>
    <div><div class="bt">Customs-Bond</div><div class="bs">內部業務管理系統</div></div>
  </div>
  <div class="sideclock" id="sideClock"></div>
  <nav class="nav">
    <div class="grp">工作區</div>

let _enKeys=null;
function applyLangText(){
  if(!_enKeys)_enKeys=Object.keys(ENMAP).sort((a,b)=>b.length-a.length);
  document.querySelectorAll("#view [placeholder]").forEach(e=>{const p=e.placeholder.trim();if(ENMAP[p])e.placeholder=ENMAP[p];});
  // 只替换叶子元素，保留 DOM 结构；叶子内中文短语按字典子串替换
  document.querySelectorAll("#view").forEach(root=>{
    root.querySelectorAll("*").forEach(e=>{
      if(e.children.length>0)return;
      let t=e.textContent;if(!t||!t.trim())return;let out=t;
      _enKeys.forEach(k=>{if(out.includes(k))out=out.split(k).join(ENMAP[k]);});
      if(out!==t)e.textContent=out;
    });
  });
}

function refreshCust(){const f=window._s||"";const s=window._st||"";const list=DATA.customers.filter(c=>(!f||(c.no+c.name+c.member).toLowerCase().includes(f.toLowerCase()))&&(!s||c.status===s));

function openNewCust(){const opts=DATA.statuses.map(s=>`<option value="${s.id}">${s.lb}</option>`).join("");
const autoNo=String(Math.max(...DATA.customers.map(c=>Number(c.no)||0),0)+1).padStart(4,"0");
const isAdmin=CURRENT_USER.role==="super_admin";
openModal(`<h3>新增客戶</h3><div class="form-grid"><div class="fg"><label>客戶編號${isAdmin?"":"（系統自動，僅超管可改）"}</label><input id="nc_no" placeholder="例如 99" value="${isAdmin?"":autoNo}" ${isAdmin?"":"disabled"}></div><div class="fg"><label>公司全名</label><input id="nc_name" placeholder="LLC"></div><div class="fg full"><label>法人全名</label><input id="nc_member"></div><div class="fg"><label>EIN</label><input id="nc_ein"></div><div class="fg"><label>業務狀態</label><select id="nc_status">${opts}</select></div></div><div class="mrow"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createCust()">建立</button></div>`);}
function createCust(){const no=document.getElementById("nc_no").value;const name=document.getElementById("nc_name").value;if(!no||!name){toast("請填客戶編號與公司全名");return;}DATA.customers.unshift({no,name,member:document.getElementById("nc_member").value||"待填",ein:document.getElementById("nc_ein").value||"",status:document.getElementById("nc_status").value,dl:"正常",mail:"—",todo:0});closeModal();render();toast("客戶已建立");}

function custInfoForm(no){const c=DATA.customers.find(x=>x.no===no);if(!c)return"<div class='empty'>無此客戶</div>";
 const canEdit=CURRENT_USER.role==="super_admin"||CURRENT_USER.role==="supervisor"||ownerName(no)===CURRENT_USER.nm;

function saveCustInfo(no){const c=DATA.customers.find(x=>x.no===no);if(!c)return;
 const old=c.name+" / "+c.member+" / "+c.ein;
 c.name=document.getElementById("cf_name").value;c.member=document.getElementById("cf_member").value;
 c.ein=document.getElementById("cf_ein").value;c.mail=document.getElementById("cf_mail").value;c.dl=document.getElementById("cf_dl").value;

function clientAuditList(no){const rs=clientAudit[no]||[];

function openStatusChange(no){if(!canManage()){toast("狀態由主管人工判定");return;}const c=DATA.customers.find(x=>x.no===no);const opts=DATA.statuses.map(s=>`<option value="${s.id}" ${s.id===c.status?"selected":""}>${s.lb}</option>`).join("");

  addClientAudit(no,"狀態變更",old,st(nv).lb,reason);closeModal();render();toast("狀態已更新並記錄");}
function openAssign(no){if(!canManage()){toast("歸屬由主管分配");return;}const opts=USERS.filter(u=>u.active).map(u=>`<option value="${u.id}" ${ownerMap[no]===u.id?"selected":""}>${u.nm} ${u.role}</option>`).join("");

function confirmAssign(no){const uid=document.getElementById("as_user").value;const old=ownerName(no);ownerMap[no]=uid;const u=USERS.find(x=>x.id===uid);const c=DATA.customers.find(x=>x.no===no);

  if(key)upsertOwnership({client_key:key,client_name:c.name,owner:uid,status:st(c.status).lb});

  closeModal();render();toast("歸屬已更新並通知新負責人");}

const base=superAdminRate();const c=DATA.customers.find(x=>x.no===no);const ow=ownerMap[no]||"kevinyama";
openModal(`<h3>確認成功出單 ｜ 內部參考 ${no}</h3>
<div class="fg"><label>本單基準佣金，超管固定前 30 單 1000、第 31 單起 1500，可逐單微調</label><input id="md_custom" type="number" value="${base}"></div>
<div class="fg"><label>分配方式</label><select id="md_mode" onchange="document.getElementById('md_pct').style.display=this.value==='percent'?'':'none'"><option value="amount">上級手動定額，寫死金額</option><option value="percent">按比例，下線只認百分比</option></select></div>

<div class="mrow"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmMarkDone('${no}')">確認成功</button></div>`);}
function confirmMarkDone(no){const c=DATA.customers.find(x=>x.no===no);const old=st(c.status).lb;
const amt=Number(document.getElementById("md_custom").value)||superAdminRate();
const mode=document.getElementById("md_mode").value;const ow=document.getElementById("md_owner").value;
const pct=mode==="percent"?Number(document.getElementById("md_split").value)||0:null;
c.status="done";commissions.push({cust:no,user:ow,amount:amt,mode,pct,t:nowBJ(),by:CURRENT_USER.id});

const BUCKET="attachments";const MAX_MB=20;
const PUB=SB.url+"/storage/v1/object/public/"+BUCKET+"/";
async function loadStorageList(no){
  const box=document.getElementById("storageList");if(!box)return;
  try{
    const r=await fetch(SB.url+"/storage/v1/object/list/"+BUCKET,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"},body:JSON.stringify({prefix:no+"/",limit:200,sortBy:{column:"name",order:"desc"}})});
    if(!r.ok){box.innerHTML="<div class='empty'>無法讀取雲端附件</div>";return;}
    const files=await r.json();
    if(!files.length){box.innerHTML="<div class='empty'>尚無雲端附件，請點下方上傳</div>";return;}
    const imgs=files.filter(f=>/\.(jpe?g|png|webp|gif)$/i.test(f.name));
    const docs=files.filter(f=>!/\.(jpe?g|png|webp|gif)$/i.test(f.name));
    const thumb=f=>{const url=PUB+encodeURIComponent(no+"/"+f.name);const isImg=/\.(jpe?g|png|webp|gif)$/i.test(f.name);
      if(isImg)return `<div class="fthumb" onclick="window.open('${url}')" title="${esc(f.name)}"><img src="${url}" loading="lazy"><div class="fcap">${esc(f.name)}</div></div>`;
      const ic=/\.pdf$/i.test(f.name)?"📄":"📎";
      return `<a class="docbox" href="${url}" target="_blank" rel="noopener"><span class="fi">${ic}</span><div><div class="fn">${esc(f.name)}</div><div class="ft">${(f.metadata&&f.metadata.size?Math.round(f.metadata.size/1024)+" KB":"")}</div></div><span class="sync ok">開啟</span></a>`;};
    box.innerHTML=(imgs.length?`<div class="fgrid">${imgs.map(thumb).join("")}</div>`:"")+`<div class="row r2">${docs.map(thumb).join("")||""}</div>`;
  }catch(e){box.innerHTML="<div class='empty'>雲端附件讀取失敗</div>";}
}

async function uploadToStorage(no,f){
 if(f.size>MAX_MB*1024*1024){toast("檔案超過 "+MAX_MB+"MB 上限，請壓縮後再傳");return;}
 toast("上傳中…");
 const path=no+"/"+Date.now()+"_"+encodeURIComponent(f.name);
 try{
   const r=await fetch(SB.url+"/storage/v1/object/"+BUCKET+"/"+path,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":f.type||"application/octet-stream"},body:f});
   if(r.ok){addAudit("上傳文件",f.name);toast("已上傳："+f.name);setTimeout(()=>loadStorageList(no),400);}
   else{const t=await r.text().catch(()=>"");toast("上傳失敗 "+r.status+"，請確認 Storage bucket 與權限已開");}
 }catch(e){toast("上傳失敗："+e.message);}
}

R.doc=()=>`<h1>文件中心</h1><div class="sub">Document Center ｜ 每位客戶全部上傳文件與照片，點圖片預覽、點文件開啟</div>
<div class="search"><input placeholder="搜尋文件名、公司名、法人" oninput="window._df=this.value;renderDoc()"></div>
<div id="docArea"></div>`;
function renderDoc(){
  const q=(window._df||"").toLowerCase();
  const box=document.getElementById("docArea");if(!box)return;
  const groups=DATA.customers.map(c=>({c,list:(DATA.files||{})[c.no]||[]}))
    .filter(g=>!q||(g.c.no+g.c.name+g.c.member+g.list.map(f=>f.name).join(" ")).toLowerCase().includes(q));
  const pub=(DATA.files||{})["_public"]||[];
  const block=g=>{
    const imgs=g.list.filter(f=>f.type==="image"),docs=g.list.filter(f=>f.type!=="image");
    return `<div class="panel"><div class="sec-title">內部參考 #${g.c.no} ｜ ${esc(g.c.name)} <span style="font-weight:400;color:var(--mut)">法人 ${esc(g.c.member)} ｜ ${g.list.length} 份</span></div>
    ${imgs.length?`<div class="fgrid">${imgs.map(fileThumb).join("")}</div>`:""}
    <div class="row r2">${docs.map(fileThumb).join("")||"<div class='empty'>無文件</div>"}</div></div>`;
  };
  box.innerHTML=`<div class="row r2">${groups.map(block).join("")||"<div class='empty'>無符合文件</div>"}
  ${pub.length?`<div class="panel"><div class="sec-title">公共附件（開發信樣本、表單、帳戶文件）</div><div class="row r2">${pub.map(fileThumb).join("")}</div></div>`:""}</div>`;
}
R.archive=()=>`<h1>歸檔包</h1><div class="sub">Customer Archive ｜ 每客戶完整 ZIP 下載，內附檔案索引清單</div>
<div class="row r2">${DATA.customers.slice(0,6).map(c=>`<div class="panel"><div class="sec-title">${c.no} ${esc(c.name)} 完整歸檔包</div><div style="font-size:12px;color:var(--mut)">內含：客戶資訊摘要 ｜ 基礎數據 JSON ｜ 時間線 ｜ 待辦 ｜ 全部附件 ｜ _檔案索引清單</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn primary small" onclick="toast('ZIP 已開始產生，完成後通知')">產生 / 下載</button><button class="btn small" onclick="toast('已同步至 GitHub 備份')">同步 GitHub</button></div></div>`).join("")}</div>`;
R.github=()=>`<h1>GitHub 備份管理</h1><div class="sub">備份管理 ｜ 僅超級管理員可操作</div>
<div class="row r2"><div class="panel"><div class="sec-title">Supabase Storage 雲端附件</div><div id="storageUsage"><div class="empty">載入用量中…</div></div><button class="btn" style="margin-top:10px" onclick="window.open('https://supabase.com/dashboard/project/xlcyumbyqcwedqwpspzs/storage/buckets/attachments','_blank')">在 Supabase 後台管理檔案</button></div>
<div class="panel"><div class="sec-title">倉庫資訊</div><div class="field"><div class="k">倉庫位址</div><div class="v">uscrm26/bcd</div></div><div class="field"><div class="k">工作副本</div><div class="v">就緒</div></div><div class="field"><div class="k">最後同步</div><div class="v">10/30 13:17</div></div><button class="btn primary" style="margin-top:10px" onclick="toast('備份已完成')">🔄 立即全量備份</button></div>
<div class="panel"><div class="sec-title">自動備份設定</div><div class="form-grid"><div class="fg"><label>自動 JSON 備份</label><select><option>開啟</option><option>關閉</option></select></div><div class="fg"><label>間隔 分鐘</label><input value="240"></div></div><button class="btn primary" style="margin-top:10px" onclick="toast('自動備份設定已儲存')">儲存設定</button><button class="btn" style="margin-top:10px;margin-left:8px" onclick="toast('高風險操作，請確認')">📥 從 GitHub 導入 DB</button></div></div>
<div class="panel"><div class="sec-title">同步任務日誌</div>${[["10/30 13:17","全量 JSON 備份推送成功 commit 7f69fa6","成功"],["10/30 12:40","客戶狀態更新已推送 commit 8a021ab","成功"]].map(x=>`<div class="logrow"><span class="t">${x[0]}</span><span class="c">${x[1]}</span><span class="o">${x[2]}</span></div>`).join("")}</div>`;
R.system=()=>`<h1>系統管理</h1><div class="sub">System Admin ｜ 僅 super_admin</div>
<div class="row r2"><div class="panel"><div class="sec-title">帳戶管理</div><table><thead><tr><th>頭像</th><th>真實姓名</th><th>登入帳號</th><th>角色</th><th>上級</th><th>名下客戶</th><th>最近登入</th><th>狀態</th><th>操作</th></tr></thead><tbody>
${(CURRENT_USER.role==="super_admin"?USERS:USERS.filter(u=>u.id===CURRENT_USER.id||u.parent===CURRENT_USER.id)).map(u=>{const kids=Object.keys(ownerMap).filter(no=>ownerMap[no]===u.id).length;const pn=u.parent?(USERS.find(x=>x.id===u.parent)||{}).nm:"—";return `<tr><td><div class="avatar" style="width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2)">${esc(u.avatar||u.nm.charAt(0))}</div></td><td>${esc(u.nm)}</td><td style="font-size:11px">${esc(u.id)}</td><td><span class="tag t-blue">${ROLE_LB[u.role]||u.role}</span></td><td>${esc(pn)}</td><td>${kids} 家</td><td style="font-size:11px">${u.lastLogin||"—"}</td><td>${u.active?"<span class='tag t-green'>啟用</span>":"<span class='tag t-gray'>停用</span>"}</td><td><button class="btn small" onclick="openUserDetail('${u.id}')">詳情</button><button class="btn small" onclick="openAdmin('${u.id}')">編輯</button><button class="btn small" onclick="toggleUserActive('${u.id}')">${u.active?"停用":"啟用"}</button></td></tr>`;}).join("")}
</tbody></table><button class="btn primary" style="margin-top:10px" onclick="openAdmin()">${CURRENT_USER.role==="supervisor"?"新增下屬":"新增帳戶"}</button></div>
${CURRENT_USER.role==="super_admin"?`<div class="panel"><div class="sec-title">系統參數，可編輯</div>
<div class="fg"><label>營業日切換時間，24 小時制</label><input id="set_cutoff" type="number" min="0" max="23" value="${SETTINGS.cutoff_hour}"></div>
<div class="mrow"><button class="btn primary" onclick="saveSettings()">儲存設定</button></div>
<div class="field" style="margin-top:10px"><div class="k">目前切日</div><div class="v">凌晨 ${SETTINGS.cutoff_hour} 點，按日統計與郵件歸日全部依此</div></div></div>`:""}
${CURRENT_USER.role==="super_admin"?`<div class="panel"><div class="sec-title">佣金分成，僅超管可見可改</div>
<div class="field"><div class="k">超管固定基準</div><div class="v">前 30 單每單 1000，第 31 單起每單 1500，可逐單微調；月目標預設不設</div></div>
<div class="field"><div class="k">分單規則</div><div class="v">上級手動定額寫死金額，或按比例分成，下線只認百分比，不見上級實收</div></div>
<div class="field"><div class="k">超管當前每單</div><div class="v">${superAdminRate()} USD</div></div>
<table><thead><tr><th>客戶</th><th>歸屬</th><th>金額</th><th>方式</th><th>下線分成</th><th>時間</th><th>操作</th></tr></thead><tbody>
${commissions.map((x,i)=>`<tr><td>${x.cust}</td><td>${esc(x.user)}</td><td>$${Number(x.amount).toLocaleString()}</td><td>${x.mode==="percent"?"按比例":"定額"}</td><td>${x.pct!=null?x.pct+"%":"—"}</td><td>${x.t}</td><td><button class="btn small" onclick="editDealAmt(${i})">改金額</button></td></tr>`).join("")||"<tr><td colspan='7' class='empty'>尚無成功單</td></tr>"}
</tbody></table></div>`:""}
${CURRENT_USER.role==="super_admin"?`<div class="panel"><div class="sec-title">全員審計日誌</div>
<div class="search"><input placeholder="篩選動作" oninput="filterAudit(this.value)"><button class="btn primary" onclick="exportAuditXlsx()">⬇ 匯出 Excel</button></div>
<div id="auditArea">${auditLog.map(a=>`<div class="logrow"><span class="t">${a.t}</span><span class="c">${esc(a.user)} ${esc(a.action)} ${esc(a.detail)}</span></div>`).join("")||"<div class='empty'>尚無審計記錄</div>"}</div></div>`:""}</div>`;
function saveSettings(){const v=Number(document.getElementById("set_cutoff").value);if(v>=0&&v<=23){SETTINGS.cutoff_hour=v;addAudit("修改系統設定","切日時間改為 "+v);render();toast("設定已儲存，全系統統計邏輯更新");}}
function paintFoot(){const n=document.getElementById("footName"),r=document.getElementById("footRole"),a=document.getElementById("footAvatar");if(n)n.textContent=CURRENT_USER.nm;if(r)r.textContent=ROLE_LB[CURRENT_USER.role]||CURRENT_USER.role;if(a)a.textContent=CURRENT_USER.avatar||CURRENT_USER.nm.charAt(0);}
function switchUser(id){const u=USERS.find(x=>x.id===id);if(!u)return;if(!u.active){toast("此帳戶已停用，無法登入");return;}CURRENT_USER=u;u.lastLogin=nowBJ();addAudit("登入",u.nm);paintFoot();applyPerm();render();toast("已切換為 "+u.nm);}
function openSwitchUser(){openModal(`<h3>切換帳號</h3><div class="row r2">${USERS.map(u=>`<div class="panel" style="cursor:${u.active?"pointer":"default"};${u.active?"":"opacity:.5"}" onclick="${u.active?`switchUser('${u.id}');closeModal()`:""}"><div class="sec-title">${u.avatar} ${u.nm} ${u.id===CURRENT_USER.id?"（目前）":""} ${u.active?"":"（停用）"}</div><div class="field"><div class="k">角色</div><div class="v">${ROLE_LB[u.role]||u.role}</div></div></div>`).join("")}</div>`);}
function openPref(){
  openModal(`<h3>個人設定</h3>
  <div class="form-grid">
  <div class="fg"><label>主題 Theme</label><select onchange="PREF.dark=this.value==='dark';savePref();render()"><option value="dark" ${PREF.dark?"selected":""}>深色 Dark</option><option value="light" ${!PREF.dark?"selected":""}>淺色 Light</option></select></div>
  <div class="fg"><label>時鐘格式 Clock</label><select onchange="PREF.h24=this.value==='24';savePref();render()"><option value="12" ${!PREF.h24?"selected":""}>12 小時制</option><option value="24" ${PREF.h24?"selected":""}>24 小時制</option></select></div>
  <div class="fg"><label>語言 Language</label><select onchange="setLang(this.value)"><option value="tw" ${CURRENT_LANG==="tw"?"selected":""}>繁體中文</option><option value="cn" ${CURRENT_LANG==="cn"?"selected":""}>简体中文</option><option value="en" ${CURRENT_LANG==="en"?"selected":""}>English (UK)</option></select></div>
  <div class="fg"><label>修改密碼</label><input id="pref_pwd" type="password" placeholder="輸入新密碼"></div>
  </div>
  <div class="mrow"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePrefPwd()">儲存</button></div>`);
}
function savePrefPwd(){const p=document.getElementById("pref_pwd").value;if(p){CURRENT_USER.pwd=p;addAudit("修改密碼",CURRENT_USER.nm);toast("密碼已更新");}closeModal();}
paintFoot();
function filterAudit(f){const list=auditLog.filter(a=>!f||(a.action+a.detail).includes(f));document.getElementById("auditArea").innerHTML=list.map(a=>`<div class="logrow"><span class="t">${a.t}</span><span class="c">${esc(a.user)} ${esc(a.action)} ${esc(a.detail)}</span></div>`).join("")||"<div class='empty'>無符合記錄</div>";}
function exportAuditXlsx(){if(CURRENT_USER.role!=="super_admin"){toast("僅超管可匯出審計");return;}
const head=["時間","操作人","動作","詳情"];const rows=auditLog.map(a=>[a.t,a.user,a.action,a.detail||""]);
if(typeof XLSX!=="undefined"){const ws=XLSX.utils.aoa_to_sheet([head,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"審計日誌");XLSX.writeFile(wb,"審計日誌_"+new Date().toISOString().slice(0,10)+".xlsx");toast("審計日誌已匯出 Excel");}
else{const csv="\ufeff"+[head,...rows].map(r=>r.map(x=>`"${String(x||"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="審計日誌.csv";a.click();toast("已匯出 CSV");}}
let _editUid=null;
function openAdmin(editId){_editUid=editId||null;const u=_editUid?USERS.find(x=>x.id===_editUid):null;
const canSuper=CURRENT_USER.role==="super_admin";
const roleOpts=canSuper?[["super_admin","超級管理員"],["supervisor","主管"],["operator","業務員"]]:[["operator","業務員"]];
const parentOpts=canSuper?[["","無上級（超管）"],...USERS.filter(x=>x.role!=="operator").map(x=>[x.id,x.nm+"（"+ROLE_LB[x.role]+"）"])]:[[CURRENT_USER.id,CURRENT_USER.nm+"（本人）"]];
openModal(`<h3>${u?"編輯帳戶":"新增帳戶"}</h3><div class="form-grid">
<div class="fg"><label>登入帳號</label><input id="au_user" value="${u?esc(u.id):""}" ${u?"disabled":""}></div>
<div class="fg"><label>真實姓名 / 顯示名稱</label><input id="au_name" value="${u?esc(u.nm):""}"></div>
<div class="fg"><label>密碼</label><input id="au_pwd" type="password" placeholder="${u?"留空不變":""}"></div>
<div class="fg"><label>頭像字</label><input id="au_avatar" maxlength="2" value="${u?esc(u.avatar||""):""}" placeholder="如 K"></div>
<div class="fg"><label>角色</label><select id="au_role">${roleOpts.map(r=>`<option value="${r[0]}" ${u&&u.role===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></div>
<div class="fg"><label>上級</label><select id="au_parent">${parentOpts.map(p=>`<option value="${p[0]}" ${u&&u.parent===p[0]?"selected":""}>${p[1]}</option>`).join("")}</select></div>
</div>
<div class="sec-title" style="margin-top:12px">頁面權限</div>
<div class="form-grid">${Object.entries(PERM_LABELS).map(([k,lb])=>{const cur=u?(u.perms&&u.perms[k]!==false):(k!=="github"&&k!=="system");return `<div class="fg" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="au_p_${k}" ${cur?"checked":""} ${(k==="github"||k==="system")&&!canSuper?"disabled":""}><label for="au_p_${k}">${lb}</label></div>`;}).join("")}</div>
<div class="mrow"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUser()">${u?"儲存":"建立"}</button></div>`);}
function saveUser(){const id=document.getElementById("au_user").value.trim();const nm=document.getElementById("au_name").value.trim();if(!id||!nm){toast("請填登入帳號與真實姓名");return;}
const role=document.getElementById("au_role").value;const parent=document.getElementById("au_parent").value||null;const pwd=document.getElementById("au_pwd").value;const avatar=document.getElementById("au_avatar").value.trim()||nm.charAt(0);
const perms={};Object.keys(PERM_LABELS).forEach(k=>{const el=document.getElementById("au_p_"+k);perms[k]=el?el.checked:false;});
if(_editUid){const u=USERS.find(x=>x.id===_editUid);u.nm=nm;u.role=role;u.parent=parent;u.avatar=avatar;u.perms=perms;if(pwd)u.pwd=pwd;addAudit("編輯帳戶",nm);}
else{if(USERS.some(x=>x.id===id)){toast("帳號已存在");return;}USERS.push({id,nm,pwd:pwd||"0000",role,parent,active:true,lastLogin:"",avatar,perms});addAudit("新增帳戶",nm);}
closeModal();render();toast("帳戶已儲存");}
function toggleUserActive(id){const u=USERS.find(x=>x.id===id);u.active=!u.active;addAudit(u.active?"啟用帳戶":"停用帳戶",u.nm);render();toast(u.active?"帳戶已啟用":"帳戶已停用");}
function openUserDetail(id){const u=USERS.find(x=>x.id===id);const mine=Object.keys(ownerMap).filter(no=>ownerMap[no]===id).map(no=>DATA.customers.find(c=>c.no===no)).filter(Boolean);
const mineAudit=auditLog.filter(a=>a.user===u.nm);
openModal(`<h3>${esc(u.nm)} 帳戶詳情</h3>
<div class="field"><div class="k">登入帳號</div><div class="v">${esc(u.id)}</div></div>
<div class="field"><div class="k">角色</div><div class="v">${ROLE_LB[u.role]||u.role}</div></div>
<div class="field"><div class="k">最近登入</div><div class="v">${u.lastLogin||"尚無記錄"}</div></div>
<div class="sec-title">名下客戶（${mine.length}）</div>
${mine.length?mine.map(c=>`<div class="logrow"><span class="c">#${c.no} ${esc(c.name)}</span><span class="o">${esc(st(c.status).lb)}</span></div>`).join(""):"<div class='empty'>尚無歸屬客戶</div>"}
<div class="sec-title">本人操作記錄（${mineAudit.length}）</div>
${mineAudit.length?mineAudit.slice(0,12).map(a=>`<div class="logrow"><span class="t">${a.t}</span><span class="c">${esc(a.action)} ${esc(a.detail)}</span></div>`).join(""):"<div class='empty'>尚無操作記錄</div>"}
<div class="mrow"><button class="btn" onclick="closeModal()">關閉</button></div>`);}
// 初次渲染：先以內置兜底繪製，再拉取同倉 JSON 真實資料覆蓋
render();
loadRepoData();
loadSB();
</script>
