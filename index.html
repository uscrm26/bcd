<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  var V="v20261103l95";
  try{
    var oldV=localStorage.getItem("bcd_ver");
    if(oldV!==V){
      // 版本變更：清除舊客戶本地緩存，防止重複卡片
      localStorage.removeItem("bcd_all_cust");
      localStorage.removeItem("bcd_cust_override");
      localStorage.setItem("bcd_ver",V);
      // 版本變更：強制帶時間戳重新抓取，徹底繞過 GitHub Pages CDN 快取
      var u=new URL(location.href);
      u.searchParams.set("v",V);
      if(location.href.split("#")[0]!==u.toString().split("#")[0]){location.replace(u.toString());return;}
      location.reload(true);
    }
  }catch(e){}
})();
</script>
<title>UCRM｜美國進口客戶關係管理系統</title>
<link rel="icon" href="favicon-32.png">
<style>
:root{
  --bg:#0e1116; --bg2:#141922; --card:#171d28; --card2:#1d2431;
  --line:#232c3b; --txt:#d7dee8; --mut:#8494a7; --dim:#5b6b80;
  --acc:#4a9eff; --acc2:#7cc0ff; --ok:#3fca8a; --warn:#ffb454; --err:#ff5d6c;
  --ind:#4a9eff; --radius:12px;
}
body[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f8;
  --line:#d8e0ec; --txt:#1c2733; --mut:#5d6f84; --dim:#94a3b5;
  --acc:#1f6fe0; --acc2:#3b8bf5; --ok:#18a05f; --warn:#d98a16; --err:#d83a4b;
  --ind:#1f6fe0;
}
body[data-theme="light"] .side{background:linear-gradient(180deg,#ffffff,#f0f4fa);border-right:1px solid var(--line)}
body[data-theme="light"] .brand .logo{background:linear-gradient(135deg,#dce9fb,#eaf2fc);border-color:#bcd4f5;color:var(--acc)}
body[data-theme="light"] .mtop{background:rgba(255,255,255,.95)}
/* language dropdown */
.lang{position:relative}
.lang .menu{display:none;position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;overflow:hidden;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lang .menu.show{display:block}
.lang .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:10px 14px;font-size:13px;cursor:pointer}
.lang .menu button:hover{background:var(--card2)}
/* notification drawer */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:90;transition:right .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
.drawer.show{right:0}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:10px}
.drawer .dgroup{font-size:11px;color:var(--dim);padding:8px 8px 4px;letter-spacing:.05em}
.drawer .ditem{display:flex;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:var(--card2)}
.drawer .ditem.unread{box-shadow:inset 3px 0 0 var(--err)}
.drawer .ditem .who{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--ind);border-radius:6px;padding:2px 7px;height:fit-content}
.drawer .ditem .tx{flex:1;min-width:0}
.drawer .ditem .tt{font-size:13px;line-height:1.4}
.drawer .ditem .tm{font-size:11px;color:var(--dim);margin-top:2px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.app{display:flex;min-height:100vh}
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line);z-index:60;align-items:center;gap:10px;padding:0 14px}
.mtop .burger{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mtop .mtitle{font-size:14px;font-weight:700;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .bell2{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer;position:relative}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:55}
.overlay.show{display:block}
.side.open{transform:translateX(0)!important}@media(max-width:900px){
  body{overflow-x:hidden}
  .mtop{display:flex}
  .side{display:none;width:248px;z-index:70;transform:none;transition:none}
  .side.open{display:flex}
  .main{margin-left:0;padding:74px 14px 70px}
  .r4{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:repeat(1,1fr)}
  .form-grid{grid-template-columns:1fr}
  .topbar{display:none}
  .panel{overflow:hidden}
  .em,.mailitem .em{overflow-wrap:anywhere;word-break:break-all}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .funnel{flex-wrap:wrap}
  .search input{min-width:120px}
}
/* sidebar */
.side{width:232px;background:linear-gradient(180deg,#12161e,#10131a);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px 14px;display:flex;flex-direction:column;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d3350,#0e1c2e);border:1px solid #2b4a70;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc2);font-size:16px}
.brand .logo-img{height:64px;width:100%;border-radius:8px;object-fit:cover;object-position:center;flex:0 0 auto;display:block;box-sizing:border-box}
.brand .bt{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand .bs{font-size:10px;color:var(--dim)}
.sideclock{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:10px;line-height:1.9;color:var(--mut)}
.sideclock b{color:var(--txt);font-weight:600}
.sideclock .z{display:flex;align-items:center;gap:6px}.sideclock .z .zem{font-size:12px;flex:0 0 auto}.sideclock .z b{flex:1 1 auto}.sideclock .z span:last-child{font-variant-numeric:tabular-nums}
.nav{flex:1;overflow-y:auto}
.nav .grp{font-size:10px;color:var(--dim);text-transform:none;padding:12px 10px 6px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);font-size:13px;margin-bottom:2px;border:1px solid transparent;transition:.15s}
.nav a:hover{background:var(--bg2);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(74,158,255,.14),transparent);color:var(--acc2);border-color:#29476b}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.nav a .dot{margin-left:auto;background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
.side .foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26334a;color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-row .nm{font-size:12px;color:var(--txt)}
.user-row .rl{font-size:10px;color:var(--dim)}
/* main */
.main{margin-left:232px;flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-bottom:20px}
.topbar .time{font-size:11px;color:var(--mut);margin-right:auto;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.lang{position:relative}
.lang button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.bell{position:relative;background:var(--bg2);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:15px}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:700}
/* headings */
h1{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
/* cards */
.row{display:grid;gap:12px}
.row>*{min-width:0}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .lb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:26px;font-weight:800;color:var(--txt);margin-top:6px}
.stat .tg{font-size:11px;color:var(--ok);margin-top:4px}
.stat .tag2{font-size:11px;color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
/* funnel */
.funnel{display:flex;gap:8px;align-items:flex-end}
.fb{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(74,158,255,.5),rgba(74,158,255,.12));border:1px solid #2b4a70;padding:10px 8px 8px;text-align:center;position:relative}
.fb .fv{font-size:20px;font-weight:800;color:var(--acc2)}
.fb .fl{font-size:10px;color:var(--mut);margin-top:2px}
/* chart ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{--p:70;width:150px;height:150px;position:relative;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#26344a 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .rc{position:relative;font-size:22px;font-weight:800;color:var(--txt)}
.legend{display:grid;gap:8px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* view switch */
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.switch button{padding:7px 16px;background:transparent;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.switch button.on{background:#1e3a5c;color:var(--acc2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--mut);text-align:left;padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a2230;color:var(--txt)}
tr:hover td{background:#1a2130}
/* tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.t-blue{background:rgba(74,158,255,.14);color:var(--acc2);border:1px solid #2b4a70}
.t-green{background:rgba(63,202,138,.14);color:var(--ok);border:1px solid #23583f}
.t-amber{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid #5a4527}
.t-red{background:rgba(255,93,108,.14);color:var(--err);border:1px solid #5a2b34}
.t-gray{background:rgba(132,148,167,.14);color:var(--mut);border:1px solid #333c4c}
/* client card */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;position:relative;display:flex;gap:14px;align-items:stretch}
.ccard:hover{border-color:#2f4a6e;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cphoto{width:100px;align-self:stretch;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid var(--line);background:#1a2230;display:block}
.ccard .cbody{flex:1;min-width:0;padding-bottom:34px;position:relative}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ccard .no{font-size:11px;color:var(--dim)}
.noref{font-weight:400;font-size:9px;color:var(--mut);margin-left:4px;opacity:.8}
.ccard .nm{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;word-break:keep-all;overflow-wrap:normal;max-width:100%;line-height:1.3}
.ccard .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7}
.ccard .meta b{color:var(--txt);font-weight:600}
.ccard .foots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ccard .foots .badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.badge.warn{color:var(--err);border-color:#5a2b34}
/* quick buttons */
.quick{position:absolute;bottom:8px;right:10px;display:flex;gap:5px;flex-wrap:wrap;opacity:0;transition:.15s;z-index:2}
.ccard:hover .quick{opacity:1}
.quick button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer}
.quick button:hover{color:var(--acc2);border-color:#2f4a6e}
/* search */
.search{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.search input{flex:1;min-width:200px}
/* button */
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#2f4a6e;color:var(--acc2)}
.btn.primary{background:linear-gradient(135deg,#1e4d80,#17406c);border-color:#2b5a92;color:#e6f0ff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:11px}
/* mail status */
.mailitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #1a2230}
.mailitem:last-child{border-bottom:0}
.mailitem .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mailitem .st.fail{background:var(--err)}
.mailitem .em{font-size:12px;color:var(--txt);flex:1}
.mailitem .nm{font-size:11px;color:var(--mut)}
.mailitem .unread{background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.mailitem .done{color:var(--dim);font-size:11px}
/* log */
.logrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #1a2230;font-size:12px;align-items:flex-start}
.logrow .t{color:var(--dim);white-space:nowrap;font-size:11px}
.logrow .c{color:var(--txt);flex:1}
.logrow .o{color:var(--ok);font-size:11px;white-space:nowrap}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 16px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.field{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #1a2230;font-size:13px;align-items:start}
.field .k{color:var(--mut)}
.field .v{color:var(--txt)}
.field .v.warn{color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px}
.fg textarea{min-height:80px;resize:vertical}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:800px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-size:16px;margin-bottom:16px;color:var(--txt)}
.mbox .mrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* timeline */
.tl{position:relative;margin-left:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#223048}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tli.e-mail::before{background:var(--acc)}
.tli.e-note::before{background:var(--warn)}
.tli.e-auto::before{background:var(--mut)}
.tli.e-doc::before{background:var(--ok)}
.tli .tt{font-size:13px;color:var(--txt);font-weight:600}
.tli .tm{font-size:11px;color:var(--dim);margin-top:2px}
.tli .tx{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.tli .src{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5c;color:#e6f0ff;padding:11px 20px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;display:none;border:1px solid #2b5a92}
.ghgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docbox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit}
.docbox .fi{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.fthumb{cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.fthumb img{width:100%;height:90px;object-fit:cover;display:block}
.fthumb .fcap{font-size:10px;padding:6px 8px;color:var(--mut);word-break:break-all;line-height:1.3;max-height:3.4em;overflow:hidden}
.docbox .fn{font-size:12px;color:var(--txt);flex:1;word-break:break-all}
.docbox .ft{font-size:10px;color:var(--dim)}
.draftbox{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:2;color:var(--txt)}
.sync{display:inline-block;font-size:10px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sync.ok{color:var(--ok);border:1px solid #23583f}
.sync.no{color:var(--warn);border:1px solid #5a4527}
.sync.fail{color:var(--err);border:1px solid #5a2b34}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.hidden{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .25s;width:248px;z-index:70}.main{margin-left:0}.r4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.ccard .foots .tag,.ccard .foots .badge{font-size:10px}.ccard .cphoto{width:60px;height:60px}.ccard .quick button{font-size:10px}}
/* ===== 登入頁 ===== */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,rgba(74,158,255,.18),transparent),var(--bg);padding:20px}
#loginScreen.hide{display:none}
.login-card{width:380px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
.login-card input{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:14px;outline:none}
.login-card input:focus{border-color:var(--acc)}
.login-btn{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
/* 滑塊登錄 */
.slide-login{margin-top:22px;position:relative;height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;user-select:none}
.slide-login .slide-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--mut);pointer-events:none}
.slide-login .slide-track{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));width:0;transition:width .2s}
.slide-login .slide-handle{position:absolute;left:0;top:0;width:46px;height:46px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:2;transition:background .2s}
.slide-login .slide-handle:active{cursor:grabbing}
.slide-login .slide-handle.done{background:var(--acc2)}
.slide-login .slide-handle .arrow{font-size:18px;color:var(--acc);transition:color .2s}
.slide-login .slide-handle.done .arrow{color:#fff}
.login-err{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
.login-foot{text-align:center;color:var(--dim);font-size:11px;margin-top:18px}
.login-head{text-align:center;margin-bottom:8px}
.login-head .logo-ico{width:58px;height:58px;border-radius:14px;margin:0 auto 10px;object-fit:cover;display:block}
.login-head .lt{font-size:20px;font-weight:800;letter-spacing:1px}
.login-head .ls{font-size:13px;color:var(--mut);margin-top:4px}
.login-lang{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.login-lang button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.login-lang button.on{color:var(--acc);border-color:var(--acc)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;cursor:pointer;transition:transform .15s,border-color .15s}
.doc-card:hover{transform:translateY(-3px);border-color:var(--acc)}
.doc-ava{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:30px;margin-bottom:10px}
.doc-ava img{width:100%;height:100%;object-fit:cover}
.doc-nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-mb{font-size:11px;color:var(--mut);margin-top:2px}
.doc-cnt{font-size:11px;color:var(--dim);margin-top:6px}
.doc-own{display:inline-block;margin-top:6px;font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(90,140,255,.15);color:#8fb4ff}
.own-chip{display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--mut);font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer}
.own-chip.on{background:var(--acc);color:#fff}
.own-face{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file-cell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file-cell .pv{width:100%;aspect-ratio:4/3;background:#0d1420;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;cursor:pointer}
.file-cell .pv img{width:100%;height:100%;object-fit:cover}
.file-cell .fn{font-size:11px;padding:6px 8px;line-height:1.3;word-break:break-all;min-height:30px}
.file-cell .meta{font-size:10px;color:var(--dim);padding:0 8px 6px}
/* AI 即時進度浮動面板 */
#aiLogPanel{position:fixed;right:14px;bottom:14px;width:320px;max-width:calc(100vw - 28px);background:var(--bg2,#1e2126);border:1px solid var(--line,#333);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:9000;display:none;flex-direction:column;overflow:hidden}
#aiLogPanel.open{display:flex}
#aiLogHead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(139,92,246,.12);font-size:12px;font-weight:600;color:var(--tx,#eee);cursor:pointer}
#aiLogHead .dot{width:8px;height:8px;border-radius:50%;background:#8b5cf6;animation:aiPulse 1.2s infinite}
#aiLogHead.done .dot{background:#10b981;animation:none}
@keyframes aiPulse{0%,100%{opacity:1}50%{opacity:.35}}
#aiLogBody{max-height:220px;overflow-y:auto;padding:8px 12px;font-size:11.5px;line-height:1.7;color:var(--mut,#bbb)}
#aiLogBody .lg{padding:2px 0;border-bottom:1px dashed var(--line,#2c2c2c)}
#aiLogBody .lg b{color:var(--tx,#ddd);font-weight:600}
#aiLogBody .lg.ok{color:#10b981}
#aiLogBody .lg.warn{color:#f0a040}
#aiLogBody .lg.err{color:#ef4444}
#aiLogMin{margin-left:auto;font-size:13px;color:var(--mut,#99);line-height:1;padding:2px 8px;border-radius:6px;cursor:pointer;user-select:none}
#aiLogMin:hover{background:rgba(255,255,255,.08);color:#fff}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}@keyframes spin{to{transform:rotate(360deg)}}

function normalizeSysId(){
  const used=new Set((DATA.customers||[]).map(c=>String(c.sysId||"")));
  let n=1000;
  (DATA.customers||[]).forEach(c=>{
    if(!c.sysId){while(used.has(String(n)))n++;c.sysId=String(n);used.add(c.sysId);n++;}
  });
}
function nextSysId(){
  let mx=999;
  (DATA.customers||[]).forEach(c=>{const v=parseInt(c.sysId);if(v>=1000&&v<=9999&&v>mx)mx=v;});

}

let _enKeys=null;
function applyLangText(){
  if(!_enKeys)_enKeys=Object.keys(ENMAP).sort((a,b)=>b.length-a.length);
  document.querySelectorAll("#view [placeholder]").forEach(e=>{const p=e.placeholder.trim();if(ENMAP[p])e.placeholder=ENMAP[p];});
  // 只替换叶子元素，保留 DOM 结构；叶子内中文短语按字典子串替换
  document.querySelectorAll("#view").forEach(root=>{
    root.querySelectorAll("*").forEach(e=>{
      if(e.children.length>0)return;
      let t=e.textContent;if(!t||!t.trim())return;let out=t;
      _enKeys.forEach(k=>{if(out.includes(k))out=out.split(k).join(ENMAP[k]);});
      if(out!==t)e.textContent=out;
    });
  });
}

function hoursSince(tm){
  const m=String(tm).match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return 999;
  const now=new Date();const bj=new Date(now.getTime()+8*3600e3);
  const curMin=(bj.getUTCMonth()+1)*372+bj.getUTCDate()*1440+bj.getUTCHours()*60+bj.getUTCMinutes();
  const thatMin=(+m[1])*372+(+m[2])*1440+(+m[3])*60+(+m[4]);
  return (curMin-thatMin)/60;
}

function bufToB64(buf){
  const bytes=new Uint8Array(buf);let bin="";const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
async function compressImgForUpload(file){
  if(!/\.(jpe?g|png|webp)$/i.test(file.name))return file;
  try{
    const bmp=await createImageBitmap(file);
    const maxSide=1600;
    let w=bmp.width,h=bmp.height;
    if(w>maxSide||h>maxSide){const s=Math.min(maxSide/w,maxSide/h);w=Math.round(w*s);h=Math.round(h*s);}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    cv.getContext("2d").drawImage(bmp,0,0,w,h);
    let q=0.82;
    let blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
    while(blob.size>900*1024&&q>0.4){q-=0.12;blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));}
    return new File([blob],file.name.replace(/\.[^.]+$/,".jpg"),{type:"image/jpeg"});
  }catch(e){return file;}
}
function fileSlug(name){
  const n=name.toLowerCase();
  const suf="-"+Math.floor(10000+Math.random()*90000);
  if(/駕照正面|license.*front|front.*license/.test(n))return "driver-license-front"+suf;
  if(/駕照背面|license.*back|back.*license/.test(n))return "driver-license-back"+suf;
  if(/人像|人頭|member.*photo|headshot/.test(n))return "member-photo"+suf;
  if(/ein/.test(n))return "ein-letter"+suf;
  if(/章程|articles.*organization/.test(n))return "articles-of-organization"+suf;
  if(/申請|通知書|filing|confirmation/.test(n))return "filing-confirmation"+suf;
  if(/w-?9/.test(n))return "w9-form"+suf;
  if(/護照|passport/.test(n))return "passport"+suf;
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/.test(n))return "screenshot-"+n.slice(0,8)+suf;
  return "doc-"+Date.now().toString(36).slice(-4)+suf;
}
function displayFileName(fname){
  if(!fname)return "";
  const i=fname.indexOf("——");
  if(i>=0)return fname.slice(i+2);
  const j=fname.indexOf("-");
  if(j>0 && fname.length<60)return fname.slice(j+1).trim();
  return fname;
}

async function uploadToGithub(no,f){

    }catch(netErr){

        const exist=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{headers:{Authorization:"token "+ghtok}},30000).then(x=>x.json());
        if(exist&&exist.sha){
          r=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"update "+sf.name,content:base64,sha:exist.sha})},60000);
        }
      }catch(e){}
      // 拉不到舊檔或覆蓋仍失敗：等待2秒後不帶sha重傳一次，繞過偶發git索引衝突
      if(!r.ok){
        await new Promise(rs=>setTimeout(rs,2000));
        try{
          r=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"upload-retry "+sf.name,content:base64})},60000);
        }catch(netErr){}
      }
    }
    if(r.ok){
      const ftype=/\.pdf$/i.test(sf.name)?"pdf":/\.(jpe?g|png|gif|webp)$/i.test(sf.name)?"image":"text";
      DATA.files[no]=DATA.files[no]||[];
      if(!DATA.files[no].find(x=>x.path===encodeURIComponent(path)))DATA.files[no].unshift({no:no,name:sf.name,path:encodeURIComponent(path),type:ftype});
      addFileRecord(no,sf.name,encodeURIComponent(path),ftype).catch(()=>{});
      if(typeof loadStorageList==="function")setTimeout(()=>loadStorageList(no),300);
      window._uploadedPaths.push(path);
      return true;
    }
    let errBody="";
    try{errBody=await r.text();const ej=JSON.parse(errBody);if(ej.message)errBody=ej.message;}catch(e){}
    window._lastUpErr="HTTP "+r.status+" "+(errBody||"").slice(0,120);
    console.warn("uploadToGithub",r.status,errBody);
    return false;
  }catch(e){
    window._lastUpErr="程式例外："+String(e).slice(0,100);
    console.warn("uploadToGithub exc",e);
    return false;
  }
}

// AI 文件交叉審查：以駕照/護照姓名為基準，檢查拼寫、過期、缺漏，總結存後台，問題進待辦與時間線
async function runDocumentReview(no,files,cust,onProgress){
  const imgs=(files||[]).filter(f=>/\.(jpe?g|png|webp)$/i.test(f.name));
  const pdfs=(files||[]).filter(f=>/\.pdf$/i.test(f.name));
  if(!imgs.length&&!pdfs.length)return;
  const c=DATA.customers.find(x=>String(x.no)===String(no));if(!c)return;
  const say=(m,k)=>{aiLog(m,k);if(typeof onProgress==="function")onProgress(m,k);};
  aiLogStart("AI 正在交叉審查全部文件");
  try{
    const issues=[];const summaryParts=[];
    let baseName="";const docFacts=[];
    // 圖片走視覺模型：以駕照/護照姓名為基準交叉比對
    if(imgs.length){
      say("讀取 "+imgs.length+" 張證件照片，準備以駕照護照姓名為基準");
      const parts=[];
      for(const f of imgs){try{say("轉換照片 "+f.name);parts.push({type:"image_url",image_url:{url:await fileToDataURL(f)}});}catch(e){}}
      if(parts.length){
        const sys="你是美國海關 continuous bond 開戶文件審查員。仔細閱讀每張證件照片（駕照、護照、公司文件）。以駕照或護照上的法人法定姓名為基準，交叉比對其他文件的姓名拼寫是否一致、證件是否已過期、是否缺漏必備文件。只輸出 JSON，不要多餘說明：{\"owner_name\":\"以證件為準的法人姓名\",\"docs\":[{\"file\":\"檔名\",\"type\":\"文件類型\",\"name\":\"姓名\",\"company\":\"公司名\",\"ein\":\"EIN\",\"expiry\":\"有效期或空\"}],\"issues\":[{\"level\":\"error|warn\",\"doc\":\"哪份文件\",\"problem\":\"問題描述\",\"fix\":\"建議處理\"}],\"summary\":\"一段繁體中文審查總結，供後台留存，不直接給客戶看\"}。";
        parts.unshift({type:"text",text:"檔案清單："+imgs.map(f=>f.name).join("、")+"。請逐張辨識並交叉比對，輸出指定 JSON。"});
        say("視覺模型正在比對照片間的姓名拼寫、有效期與缺漏");
        try{
          const out=await callAIVision(sys,parts);
          let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={summary:out.slice(0,300),issues:[]};}
          if(j.owner_name){baseName=j.owner_name;say("法定姓名基準："+j.owner_name,"ok");}
          if(Array.isArray(j.docs))j.docs.forEach(d=>docFacts.push(d));
          if(j.summary)summaryParts.push("照片："+j.summary);
          (Array.isArray(j.issues)?j.issues:[]).forEach(it=>issues.push(it));
        }catch(e){console.warn("視覺審查失敗",e);say("照片比對失敗，已略過","warn");}
      }
    }
    // PDF：每份獨立識別內容（文字型全文分段／掃描型逐頁視覺），產生識別卡存後台
    c.fileInsights=c.fileInsights||[];
    for(const f of pdfs){
      let pa=(window._pdfInsightMap||{})[f.name];
      if(pa){say("複用已完成的 "+f.name+" 識別結果");}
      if(!pa){try{pa=await analyzePdfDoc(f,say);}catch(e){console.warn("PDF分析失敗",f.name,e);say(f.name+" 分析失敗，已略過","warn");continue;}}
      const card={file:f.name,via:pa.via,pages:pa.pages,type:pa.doc_type||"未分類",summary:pa.summary||"",key_facts:pa.key_facts||"",company:pa.company||"",member:pa.member||"",ein:pa.ein||""};
      c.fileInsights=c.fileInsights.filter(x=>x.file!==f.name);
      c.fileInsights.unshift(card);
      docFacts.push({file:f.name,type:card.type,name:card.member,company:card.company,ein:card.ein,expiry:""});
      if(pa.summary)summaryParts.push(`PDF ${f.name}（${card.type}）：${pa.summary}${pa.key_facts?"｜關鍵："+pa.key_facts:""}`);
      (Array.isArray(pa.issues)?pa.issues:[]).forEach(it=>issues.push(it));
    }
    // 整體交叉比對：以駕照/護照法人姓名為基準，檢查各文件姓名拼寫、EIN、公司是否一致
    if(docFacts.length&&(baseName||c.member)){
      const basis=baseName||c.member;
      say("以法人「"+basis+"」為基準，比對全部文件的姓名、公司、EIN 是否一致");
      try{
        const factText=docFacts.map(d=>`${d.file}｜類型:${d.type||""}｜姓名:${d.name||""}｜公司:${d.company||""}｜EIN:${d.ein||""}`).join("\n");
        const xout=await callAI("你是文件一致性審查員。基準法人姓名："+basis+"。比對下列每份文件的姓名拼寫、公司名、EIN 是否與基準一致，是否有拼寫落差或矛盾。只輸出JSON {\"issues\":[{\"level\":\"error|warn\",\"doc\":\"檔名\",\"problem\":\"問題\",\"fix\":\"建議\"}]}，一致則issues為空，不要編造。","基準法人："+basis+"\n文件清單：\n"+factText);
        let xj={};try{xj=JSON.parse(xout.replace(/```json|```/g,"").trim());}catch(e){}
        (Array.isArray(xj.issues)?xj.issues:[]).forEach(it=>{if(!issues.some(x=>x.doc===it.doc&&x.problem===it.problem))issues.push(it);});
      }catch(e){console.warn("整體交叉比對失敗",e);say("整體比對失敗，已保留各文件獨立結果","warn");}
    }
    c.reviewReport=summaryParts.join("\n");
    // 問題寫入 AI 待辦
    c.aiTodos=c.aiTodos||[];
    c.aiTodos.forEach(x=>{if(!x.done)x.superseded=true;});
    issues.forEach(it=>{const t=`[文件審查] ${it.doc||""}：${it.problem||""}${it.fix?"（建議："+it.fix+"）":""}`;if(!c.aiTodos.some(x=>x.t===t))c.aiTodos.unshift({t,done:false,ts:Date.now()});});
    // 時間線審查記錄
    DATA.timeline[no]=DATA.timeline[no]||[];
    const n=issues.length;
    const reviewItem={t:nowBJ(),who:"AI 文件交叉審查",txt:n?`⚠️ 發現 ${n} 項文件問題，詳見待辦`:"✅ 文件交叉審查通過，未發現姓名、過期或缺漏問題",detail:issues.map(it=>`· [${it.level==="error"?"嚴重":"提醒"}] ${it.doc||""}：${it.problem||""}${it.fix?"；建議 "+it.fix:""}`).join("\n")||"所有文件姓名一致、均在有效期內、無缺漏。",key:"review_"+Date.now()};
    DATA.timeline[no].unshift(reviewItem);
    persistCust(no);
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"timeline",target_client:String(no),detail:JSON.stringify(reviewItem)});
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiTodos:c.aiTodos,reviewReport:c.reviewReport,fileInsights:c.fileInsights,aiLastAt:c.aiLastAt})});
    syncCustomerToRepo(no);
    render();
    aiLogDone(n?`交叉審查完成，發現 ${n} 項問題`:"交叉審查完成，全部一致");
    say(n?`完成：發現 ${n} 項問題，已寫入待辦`:"完成：姓名、有效期、缺漏均無問題",n?"warn":"ok");
  }catch(e){console.warn("文件審查失敗",e);aiLog("文件審查中斷："+e.message,"err");}
}
async function syncCustomerToRepo(no){
  try{
    const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
    const c=DATA.customers.find(x=>String(x.no)===String(no));if(!c)return;
    const metaR=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{headers:{Authorization:"token "+ghtok}});
    const meta=await metaR.json();
    const dj=JSON.parse(new TextDecoder("utf-8").decode(Uint8Array.from(atob((meta.content||"").replace(/\n/g,"")),b=>b)));
    const cs=dj.customers=dj.customers||[];
    const idx=cs.findIndex(x=>String(x.no)===String(no));
    if(idx<0)cs.push(c);
    else{
      const t=cs[idx];
      if(c.no&&String(t.no)!==String(c.no))t.no=c.no;
      t.name=c.name;t.member=c.member;t.ein=c.ein;t.mail=c.mail;t.dl=c.dl;t.pp=c.pp;
      t.phone=c.phone||"";t.address=c.address||"";t.notes=c.notes||"";
      if(c.created)t.created=c.created;if(c.createdAt)t.createdAt=c.createdAt;
      if(c.reviewReport)t.reviewReport=c.reviewReport;
      if(c.aiTodos)t.aiTodos=c.aiTodos;
      if(c.fileInsights)t.fileInsights=c.fileInsights;
      if(c.sysId&&!t.sysId)t.sysId=c.sysId;
      if(c.memberPhoto)t.memberPhoto=c.memberPhoto;
      if(c.status)t.status=c.status;
    }
    const b=JSON.stringify(dj);
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"更新客戶 "+no,content:btoa(unescape(encodeURIComponent(b))),sha:meta.sha})});
  }catch(e){console.warn("syncCustomerToRepo",e);}
}

async function aiRefillCustomer(no){
  const c=DATA.customers.find(x=>String(x.no)===String(no));if(!c)return;
  // 右下角小窗
  let win=document.getElementById("refillWin");if(win)win.remove();
  win=document.createElement("div");win.id="refillWin";
  win.style.cssText="position:fixed;bottom:"+floatNext()+"px;right:20px;width:480px;max-height:500px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:9999;overflow:hidden";
  win.innerHTML=`<div style="padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700;color:#8b5cf6">AI 重填資料</span><button onclick="this.closest('#refillWin').remove()" style="background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer">×</button></div><div id="refillLog" style="padding:14px 16px;font-size:12px;line-height:1.8;max-height:380px;overflow-y:auto"></div>`;
  document.body.appendChild(win);
  const log=document.getElementById("refillLog");
  const say=(t,cl)=>{const d=document.createElement("div");d.style.cssText="margin-bottom:4px;color:"+(cl||"var(--text)");d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;};

  try{
    const allFiles=((DATA.files||{})[no]||[]);
    const pdfFiles=allFiles.filter(f=>f.type==="pdf");
    const txtFiles=allFiles.filter(f=>f.type==="text"||f.name.endsWith(".txt"));
    say("找到 "+pdfFiles.length+" 份 PDF，"+txtFiles.length+" 份文本文件");
    const allText=[];
    for(let i=0;i<pdfFiles.length;i++){
      const f=pdfFiles[i];
      const url=resolveFile(f.path);
      say("讀取 "+f.name+" ...");
      try{
        const resp=await fetch(url);
        const blob=await resp.blob();
        const fileObj=new File([blob],f.name,{type:"application/pdf"});
        const ext=await extractPdfFull(fileObj,(s)=>{if(i<3)say("  "+s);});
        if(ext.text&&ext.text.length>50){
          allText.push("=== "+f.name+" ===\n"+ext.text.slice(0,4000));
          say("  成功提取 "+ext.text.length+" 字");
        }else{
          say("  文字太少，略過");
        }
      }catch(e){say("  讀取失敗："+e.message);}
    }
    for(const f of txtFiles){
      try{
        const resp=await fetch(resolveFile(f.path));
        const t=await resp.text();
        if(t&&t.length>10){
          allText.push("=== "+f.name+" ===\n"+t.slice(0,4000));
          say("讀取 "+f.name+" ... 成功");
        }
      }catch(e){say("  "+f.name+" 讀取失敗");}
    }
    if(!allText.length){say("沒有可用文字，結束。");return;}
    say("正在交 AI 分析所有文件...");
    const ctx=`客戶：${c.name}，法人：${c.member}，EIN：${c.ein}
當前資料：電話=${c.phone||"(空)"}，地址=${c.address||"(空)"}，備註=${c.notes||"(空)"}

以下是客戶所有文件的內容，請從中提取以下欄位：
- phone：客戶法人的聯絡電話。注意 SSN 文件（文件名含 SSN）裡通常有 Phone Numbers 段落，列出多個號碼，取第一個或最新的號碼作為 phone
- address：客戶公司的完整地址（以 EIN 通知書或公司章程為準）
- notes：值得記錄的補充資訊（如法人出生日期、SSN 後四位、歷史地址、Email 等）

只輸出 JSON，不要 markdown：
{"phone":"...","address":"...","notes":"..."}
找不到的欄位留空字串。`;
    const sys="你是美國海關 bond 文件分析員。從文件中提取客戶資料，只輸出 JSON。";
    const out=await callAI(sys,ctx+"\n\n"+allText.join("\n\n"));
    let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){say("AI 回傳解析失敗");return;}
    say("分析完成，正在生成對比...");
    // 對比卡片
    const fields=[
      {key:"phone",label:"電話",old:c.phone||"",new:j.phone||""},
      {key:"address",label:"地址",old:c.address||"",new:j.address||""},
      {key:"notes",label:"備註",old:c.notes||"",new:j.notes||""}
    ];
    const changes=fields.filter(f=>f.new&&f.new.trim()&&f.new.trim()!==f.old.trim());
    if(!changes.length){
      say("AI 沒有新增或更改的內容");
      setTimeout(()=>{const w=document.getElementById("refillWin");if(w)w.remove();},2000);
      return;
    }
    // 彈出對比卡片
    let cardsHtml=changes.map((f,i)=>{
      const wasBlank=!f.old.trim();
      return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg2)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <input type="checkbox" id="refill_chk_${i}" checked style="width:16px;height:16px">
          <span style="font-weight:700;font-size:14px">${f.label}</span>
          ${wasBlank?'<span class="tag t-amber">原本空白</span>':'<span class="tag t-blue">有修改</span>'}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div style="background:var(--bg);padding:8px;border-radius:6px">
            <div style="font-size:11px;color:var(--mut);margin-bottom:4px">原本</div>
            <div style="font-size:12px;word-break:break-all">${wasBlank?'<span style="color:var(--dim)">空白未填寫</span>':esc(f.old)}</div>
          </div>
          <div style="background:rgba(139,92,246,.08);padding:8px;border-radius:6px;border:1px solid rgba(139,92,246,.2)">
            <div style="font-size:11px;color:#8b5cf6;margin-bottom:4px">AI 建議</div>
            <div style="font-size:12px;word-break:break-all">${esc(f.new)}</div>
          </div>
        </div>
      </div>`;
    }).join("");
    openModal(`<h3>AI 重填結果</h3>
    <div style="font-size:12px;color:var(--mut);margin-bottom:12px">勾選要採用的欄位，按下方按鈕寫入表單</div>
    ${cardsHtml}
    <div class="mrow">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="applyRefillResult(${no})">採用所選</button>
    </div>`);
    window._refillChanges=changes;
    say("已彈出對比視窗");
  }catch(e){say("錯誤："+e.message);}
}

function tl(no){const ts=DATA.timeline[no]||[];const icon={email:"📩",note:"📝",auto:"🤖",doc:"📎",ai:"🤖"};
 const c=DATA.customers.find(x=>x.no===no);
 const dom=c&&c.mail&&c.mail.includes("@")?c.mail.split("@")[1].toLowerCase():"";
 const mails=dom?(DATA.emails||[]).filter(e=>(e.from||"").toLowerCase().includes(dom)):[];
 const mailRows=mails.map(e=>({e:"email",who:mailDirLabel(e),act:"",tt:e.sub,tm:e.t||"",tx:e.body?e.body.slice(0,200):"",key:"m_"+e.t}));
 const tsRows=ts.map(x=>{let w=x.who||x.src||"";w=w.replace(/^[📩📝🤖📎]\s*/,"").trim();return{e:(w.indexOf("AI")>=0)||x.e==="ai"?"ai":"note",who:w,act:x.act||(x.e==="note"?"note":""),tt:x.txt||x.tt||"",tm:x.t||x.tm||"",tx:x.detail||x.tx||"",key:x.key||""};});
 const all=tsRows.concat(mailRows).sort((a,b)=>(b.tm||"").localeCompare(a.tm||""));
 const f=window._tlFilter||"all";
 const filtered=f==="ai"?all.filter(t=>t.e==="ai"):f==="unread"?all.filter(t=>t.e==="email"):f==="note"?all.filter(t=>t.e==="note"):all;
 return `<div style="margin-bottom:10px;display:flex;gap:6px">
  <button class="btn small" style="${f==='all'?'background:var(--acc);color:#fff':''}" onclick="window._tlFilter='all';render()">全部</button>

  <button class="btn small" style="${f==='ai'?'background:var(--acc);color:#fff':''}" onclick="window._tlFilter='ai';render()">AI 記錄</button>
  <button class="btn small" style="${f==='note'?'background:var(--acc);color:#fff':''}" onclick="window._tlFilter='note';render()">備註</button>
 </div>
 <div style="flex:1;overflow-y:auto">${filtered.slice(0,50).map((t,idx)=>`<div class="tli e-${t.e}" style="cursor:pointer;padding:10px 10px 10px 14px;border-left:3px solid ${t.e==='ai'?'#8b5cf6':'var(--line)'};${t.e==='ai'?'background:rgba(139,92,246,.05)':''};position:relative" onclick="${t.key&&t.key.startsWith('m_')?`openMailDetail('${t.tm}')`:`openTlNote('${esc(t.tt||"")}','${esc(t.tx||"")}')`}">${CURRENT_USER.role==="super_admin"&&t.key&&!t.key.startsWith("m_")?`<button class="btn small" style="position:absolute;top:6px;right:6px;font-size:10px;color:#ef4444;border-color:#ef4444;padding:1px 8px" onclick="event.stopPropagation();confirmDeleteTl('${no}','${t.key}')">刪除</button>`:""}<span class="src">${icon[t.e]||"📩"} ${esc(t.who||t.src||"")}${t.act==="note"?(CURRENT_LANG==="en"?" manually added note":CURRENT_LANG==="cn"?" 手动添加备注":" 手動添加備註"):""}</span><div class="tt">${esc(t.tt||"")}</div><div class="tm">${esc(t.tm||"")}${t.tm?" ｜ 美東 "+convET(t.tm):""}</div><div class="tx">${esc(t.tx||"")}</div></div>`).join("")||"<div class='empty'>尚無時間線事件</div>"}</div>
`;}

function convET(bj){if(!bj||typeof bj!=="string")return "--";const h=parseInt((bj.match(/\d{2}:\d{2}/)||["12:00"])[0].split(":")[0]);let eh=(h-13+24)%24;return `${eh}:${(bj.match(/\d{2}:\d{2}/)||["00"])[0].split(":")[1]}`;}
function autoTodos(c){const t=[];
 const unread=(DATA.emails||[]).some(e=>e.c===c.name&&e.unread);
 if(unread)t.push({lv:"high",t:"有新郵件待回覆"});
 const sm={new:"首封開發信尚未送出",collect:"資料收集中，待客戶補齊 EIN／章程／地址證明",form:"Bond 申請表尚未填寫",submit:"已提交，跟進 Broker 出單進度",supply:"等客戶補交所需文件",quote:"等待 Broker 回覆報價",confirm:"等待客戶確認報價"};
 if(sm[c.status])t.push({lv:c.status==="new"?"mid":"low",t:sm[c.status]});
 if(dlStatus(c).expired)t.push({lv:"high",t:"駕照已過期，需更新"});
 else if(dlStatus(c).warn)t.push({lv:"med",t:"駕照即將過期（"+(dlStatus(c).exp||"")+"）"});
 return t;}
function todoList(no){const c=DATA.customers.find(x=>x.no===no);
 const auto=autoTodos(c);
 const aiTodos=(c.aiTodos||[]).filter(t=>!t.done);
 const bs='style="font-size:11px;padding:3px 10px"';
 const btnOk='class="btn small" style="font-size:11px;padding:3px 10px"';
 const btnDel='class="btn small" style="font-size:11px;padding:3px 10px;color:#ef4444;border-color:#ef4444"';
 const aiHidden=c.aiHidden||false;
 return `<div class="search"><input id="newtodo" placeholder="新增待辦標題"><button class="btn primary" ${bs} onclick="addTodo('${no}')">新增</button></div>
 <div style="font-size:11px;color:var(--mut);margin:8px 0">待辦事項</div>
 ${auto.length?auto.map((t,i)=>`<div class="logrow" ${i===0?'style="background:rgba(255,93,108,.07)"':''}><span class="c">${esc(t.t)}</span><span class="o">未完成</span><span style="display:flex;gap:4px"><button ${btnOk} onclick="addAutoTodo('${no}',${i})">新增待辦</button><button ${btnOk} onclick="dismissAutoTodo('${no}',${i})">忽略</button></span></div>`).join(""):"<div class='empty'>目前無待辦，狀態正常</div>"}
 ${aiTodos.length?`<div style="font-size:11px;color:#8b5cf6;margin:14px 0 6px">🤖 AI 建議待辦</div>`:""}
 ${aiTodos.map((t,i)=>`<div class="logrow" style="${t.superseded?'opacity:.4;text-decoration:line-through':''}"><span class="c">🤖 ${esc(t.t)}${t.superseded?' <span style="font-size:10px;color:var(--mut)">（已被新內容取代）</span>':''}</span><span class="o" style="color:#8b5cf6">AI</span>${t.superseded?`<button ${btnOk} onclick="restoreAiTodo('${no}',${i})">恢復顯示</button>`:`<span style="display:flex;gap:4px"><button ${btnOk} onclick="addAiTodoFromList('${no}',${i})">新增待辦</button><button ${btnOk} onclick="dismissAiTodo('${no}',${i})">忽略</button><button ${btnDel} onclick="deleteAiTodo('${no}',${i})">刪除</button></span>`}</div>`).join("")}
 <div style="margin:14px 0 6px;display:flex;align-items:center;gap:8px">
  <button class="btn small" style="font-size:11px;padding:3px 10px;color:#8b5cf6" onclick="toggleAiSuggestions('${no}')">${aiHidden?'▶ 展開 AI 建議':'▼ 收起 AI 建議'}</button>
 </div>
 ${aiHidden?"":(c.aiSuggestions||[]).map((sug,i)=>sug.ignored?`<div class="logrow" style="opacity:.4;text-decoration:line-through"><span class="c">🚫 ${esc(sug.t)}</span><button ${btnOk} onclick="unignoreAiTodo('${no}',${i})">撤銷忽略</button></div>`:sug.added?"":`<div class="logrow" style="background:rgba(139,92,246,.08)"><span class="c">💡 ${esc(sug.t)}</span><span style="display:flex;gap:4px"><button ${btnOk} onclick="addAiTodo('${no}',${i})">新增待辦</button><button ${btnOk} onclick="ignoreAiTodo('${no}',${i})">忽略</button></span></div>`).join("")}`;}
function toggleAiSuggestions(no){const c=DATA.customers.find(x=>x.no===no);if(!c)return;c.aiHidden=!c.aiHidden;persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiHidden:c.aiHidden})});render();}
function addAiTodo(no,i){const c=DATA.customers.find(x=>x.no===no);if(!c||!c.aiSuggestions||!c.aiSuggestions[i])return;toast("保存中...");c.aiTodos=c.aiTodos||[];c.aiTodos.unshift({t:c.aiSuggestions[i].t,done:false,ts:Date.now()});c.aiSuggestions[i].added=true;addClientAudit(no,"新增待辦","",c.aiSuggestions[i].t,"AI 建議");persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_todo_add",target_client:String(no),detail:JSON.stringify({t:c.aiSuggestions[i].t,ts:Date.now()})});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiTodos:c.aiTodos,aiSuggestions:c.aiSuggestions,aiLastAt:c.aiLastAt})});render();toast("✅ 建議已採用，已保存到雲端");}
function ignoreAiTodo(no,i){const c=DATA.customers.find(x=>x.no===no);if(!c||!c.aiSuggestions||!c.aiSuggestions[i])return;toast("保存中...");c.aiSuggestions[i].ignored=true;persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_todo_ignore",target_client:String(no),detail:JSON.stringify({t:c.aiSuggestions[i].t,ignored:true})});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiTodos:c.aiTodos,aiSuggestions:c.aiSuggestions,aiLastAt:c.aiLastAt})});render();}
function unignoreAiTodo(no,i){const c=DATA.customers.find(x=>x.no===no);if(!c||!c.aiSuggestions||!c.aiSuggestions[i])return;toast("保存中...");c.aiSuggestions[i].ignored=false;persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_todo_ignore",target_client:String(no),detail:JSON.stringify({t:c.aiSuggestions[i].t,ignored:false})});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiTodos:c.aiTodos,aiSuggestions:c.aiSuggestions,aiLastAt:c.aiLastAt})});render();toast("已撤銷忽略並保存");}
async function openAiHistory(no){
  let rows=(DATA.timeline[String(no)]||DATA.timeline[no]||[]).filter(x=>x.key&&(String(x.key).startsWith("ai_")||String(x.key).startsWith("batch_")||String(x.key||"").includes("AI")));
  try{
    const cloud=await sbReq("audit_logs","GET",null,"?select=*&target_client=eq."+encodeURIComponent(String(no))+"&order=created_at.desc&limit=100");
    if(Array.isArray(cloud)){
      cloud.forEach(a=>{
        if(a.action==="timeline"){try{const r=JSON.parse(a.detail);if(r&&r.txt&&(String(r.key||"").startsWith("ai_")||String(r.key||"").startsWith("batch_"))&&!rows.some(x=>x.key===r.key))rows.push(r);}catch(e){}}
      });
      rows.sort((a,b)=>String(b.t||"").localeCompare(String(a.t||"")));
    }
  }catch(e){}
  const h=rows.map(r=>{const acts=(r.nextActions||[]).map(a=>`<div style="font-size:12px;color:var(--text);padding:4px 0;padding-left:14px;position:relative"><span style="position:absolute;left:0;top:8px;color:#8b5cf6">▸</span>${esc(a)}</div>`).join("");return `<div style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px"><div style="font-size:11px;color:var(--mut);margin-bottom:8px">${esc(r.t||"")} · ${esc(r.who||"AI")}</div><div style="font-size:13px;line-height:1.7;margin-bottom:8px">${esc(r.summary||r.txt||"")}</div>${acts?`<div style="font-size:11px;color:var(--mut);margin-bottom:4px">建議待辦：</div>${acts}`:""}</div>`;}).join("")||"<div style='color:var(--dim);padding:20px'>尚無 AI 分析記錄</div>";
  openModal(`<div style="width:min(1200px,96vw)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">AI 分析歷史</h3><button class="btn small" onclick="closeModal()">關閉</button></div><div style="max-height:80vh;overflow-y:auto;padding-right:6px">${h}</div></div>`);
}

let QMAP={};
let IMGMAP={};
fetch("qiniu_map.json").then(r=>r.json()).then(j=>{QMAP=j;if(typeof render==="function")render();}).catch(()=>{});
fetch("img_map.json").then(r=>r.json()).then(j=>{IMGMAP=j;if(typeof render==="function")render();}).catch(()=>{});
function phSrc(no){
  if(PHOTO_OVERRIDE[no])return FILEBASE+PHOTO_OVERRIDE[no]+"?t="+Date.now();
  const c=DATA.customers.find(x=>String(x.no)===String(no));
  if(c&&c.memberPhoto)return c.memberPhoto;
  const p=PHOTO[no]||"";if(p)return resolveFile(p);
  const fl=(DATA.files||{})[no]||[];
  const portrait=fl.find(f=>/法人照片|人像|人頭|member.?photo|headshot/i.test(f.name||f.nm||""));
  if(portrait)return resolveFile(portrait.path||"");
  return "";
}
function resolveFile(p){
  if(!p)return "#";
  try{var dec=decodeURIComponent(p);}catch(e){var dec=p;}
  if(IMGMAP[dec])return FILEBASE+IMGMAP[dec];
  if(dec.startsWith("attachments/"))return "https://xlcyumbyqcwedqwpspzs.supabase.co/storage/v1/object/public/"+encodeURI(dec);
  if(QMAP[dec])return QMAP[dec].replace(/^http:\/\//i,"https://");
  // 副檔名不一致：本來記 .png 實際是 .jpg，本地 img/ 優先，避免被七牛 HTTP 混合內容擋掉
  var jpg=dec.replace(/\.(png|jpeg)$/i,".jpg");
  if(IMGMAP[jpg])return FILEBASE+IMGMAP[jpg];
  if(QMAP[jpg])return QMAP[jpg].replace(/^http:\/\//i,"https://");
  // 副檔名缺失（檔名結尾是句號）：補常見副檔名再查本地映射
  if(/\.$/.test(dec)){
    var base=dec.replace(/\.$/,".");
    for(var i=0;i<3;i++){
      var ext=[".jpg",".png",".jpeg"][i];
      if(IMGMAP[base+ext])return FILEBASE+IMGMAP[base+ext];
      if(QMAP[base+ext])return QMAP[base+ext].replace(/^http:\/\//i,"https://");
    }
  }
  return FILEBASE+p;
}

    if(/EIN|稅號/i.test(t)){

  if(conflicts.length)detailLines.push("⚠️ 衝突提醒："+conflicts.map(x=>x.problem).join("；"));
  tlItem.detail=detailLines.join("\n");
  DATA.timeline[no].unshift(tlItem);

  const okMsg=results.length+" 份文件已完成分析並加入客戶檔案";

function uploadToStorage(no,f){
 if(f.size>MAX_MB*1024*1024){toast(f.name+" 超過 "+MAX_MB+"MB");return;}
 toast("上傳中："+f.name);
 loadQiniuToken().then(token=>{
  if(!token){toast("上傳服務未就緒，稍後再試");return;}
  const safeName=(f.name||"file").replace(/[\\/:*?"<>|\s]/g,"_");
  const key="docs/"+no+"/"+Date.now()+"_"+safeName;
  const fd=new FormData();fd.append("token",token);fd.append("key",key);fd.append("file",f);
  fetch("https://upload-z2.qiniup.com/",{method:"POST",body:fd}).then(r=>r.json()).then(async j=>{
    if(j.key===key){
      addAudit("上傳文件",f.name);
      const meta=JSON.stringify({no:no,name:f.name,key:key});
      fetch("https://api.github.com/repos/uscrm26/bcd/issues",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:"SIGN:"+key,body:meta})}).catch(()=>{});
      const ok=await waitForSign(key,45);
      if(ok)toast("已上傳："+f.name);else toast("已上傳，簽名同步中");
      setTimeout(()=>loadStorageList(no),500);
    }else{toast("上傳失敗："+((j.error||j.message||"").toString().slice(0,100)||"未知錯誤"));}
  }).catch(()=>toast("上傳失敗：網路或 CORS 被擋"));
 });
}
function waitForSign(key,sec){return new Promise(res=>{const t0=Date.now();const iv=setInterval(async()=>{try{const r=await fetch("qiniu_map.json?v="+Date.now());const m=await r.json();if(m[key]||m[decodeURIComponent(key)]){clearInterval(iv);res(true);return;}}catch(e){}if(Date.now()-t0>sec*1000){clearInterval(iv);res(false);}},2000);});}

function extractAddr(s){const m=(s||"").match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/i);return m?m[0].toLowerCase():null;}
function mailIsOutgoing(e){
  const cust=mailOwnerClient(e);
  if(!cust||!cust.mail)return false;
  const ca=extractAddr(cust.mail),fa=extractAddr(e.from);
  return !!(ca&&fa&&ca===fa);
}
function mailDirLabel(e){
  const out=mailIsOutgoing(e);
  const addr=extractAddr(e.from)||e.from||"";
  const L=CURRENT_LANG;
  const zh=out?("寄件：發送電子郵件至 "+addr):("收件：收到來自 "+addr+" 的電子郵件");
  const cn=out?("寄件：发送电子邮件至 "+addr):("收件：收到来自 "+addr+" 的电子邮件");
  const en=out?("Outbound: Sent email to "+addr):("Inbound: Received email from "+addr);
  return L==='en'?en:L==='cn'?cn:zh;
}
function mailActionLabel(e){
  const out=mailIsOutgoing(e);
  const L=CURRENT_LANG;
  if(out){return L==='en'?"Email this contact again":(L==='cn'?"再次向该联系人发电邮":"再次向該聯絡人發電郵");}
  return L==='en'?"Reply":(L==='cn'?"回复此信":"回覆此信");
}
function mailActionClick(e){
  const out=mailIsOutgoing(e);
  if(out){const cust=mailOwnerClient(e);return cust?("closeModal();sendAsCustomer('"+cust.no+"')"):("closeModal();openReply('"+e.t+"')");}
  return "closeModal();openReply('"+e.t+"')";
}
function mailOwnerClient(e){
  const cn=(e.c||"").trim();
  let cust=DATA.customers.find(x=>x.name&&(x.name===cn||x.name.startsWith(cn)||(cn&&x.name.includes(cn))));
  if(!cust&&cn){
    const mb=(DATA.mailboxes||[]).find(m=>m.nm===cn);
    if(mb)cust=DATA.customers.find(x=>x.mail===mb.em||(x.name&&mb.nm&&x.name.includes(mb.nm)));
  }
  return cust||null;
}

// 圖片先壓縮成 dataURL，避免超出免費模型的大小限制
function fileToDataURL(f,maxSide=1600){
  return new Promise(resolve=>{
    if(!/\.(jpe?g|png|webp)$/i.test(f.name)){const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f);return;}
    const img=new Image();const url=URL.createObjectURL(f);
    img.onload=()=>{
      let{width:w,height:h}=img;const sc=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);resolve(cv.toDataURL("image/jpeg",0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f);};
    img.src=url;
  });
}

async function loadPdfDoc(file){

// 抽取 PDF 全部頁面文字，偵測是否為掃描型，回傳 {text,pages,scanned}
async function extractPdfFull(file,onProgress){
  const say=typeof onProgress==="function"?onProgress:()=>{};
  say("正在開啟檔案，讀取頁面結構");
  const pdf=await loadPdfDoc(file);
  if(!pdf)return {text:"",pages:0,scanned:false};
  let text="";const per=[];
  const n=pdf.numPages;
  say("檔案共 "+n+" 頁，開始逐頁讀取文字");
  for(let i=1;i<=n;i++){
    const p=await pdf.getPage(i);
    const tc=await p.getTextContent();
    const pt=tc.items.map(it=>it.str).join(" ").trim();
    per.push(pt);text+=pt+"\n";
    if(n>1)say("已讀取第 "+i+"/"+n+" 頁");
  }
  const empty=per.filter(t=>t.replace(/\s/g,"").length<15).length;
  const scanned=n>0&&empty>=Math.ceil(n/2);
  say(scanned?("偵測到 "+empty+" 頁選不到文字，判定為掃描件，改用視覺逐頁辨識"):("偵測為可選取文字文件，進入內容提煉"));
  return {text:text.replace(/\s+/g," ").trim(),pages:n,scanned,pdf};
}
// 掃描型 PDF 單頁渲染成圖片，交視覺模型讀取
async function pdfPageImage(pdf,pageIdx,scale=1.3){
  const p=await pdf.getPage(pageIdx);
  const vp=p.getViewport({scale});
  const cv=document.createElement("canvas");
  cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
  await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
  return cv.toDataURL("image/jpeg",0.85);
}

function buildMailContext(e){
  const lines=[];
  // 1. 客戶檔案
  const cname=(e.c||"").trim();
  const cust=DATA.customers.find(x=>x.name&&(x.name===cname||x.name.startsWith(cname)||(cname&&x.name.includes(cname))));
  if(cust){
    lines.push("【客戶檔案】");
    lines.push("公司："+(cust.name||"")+"｜法人："+(cust.member||"")+"｜EIN："+(cust.ein||"—")+"｜目前狀態："+(cust.status_lb||cust.status||"")+"｜內部編號：#"+cust.no);
    if(cust.mail)lines.push("客戶對外信箱："+cust.mail);
  }else{
    lines.push("【客戶檔案】系統中尚未建立該公司檔案，客戶名稱："+cname);
  }
  // 2. 本客戶歷史收件（依時間排序）
  const recv=(DATA.emails||[]).filter(x=>x.c===cname).sort((a,b)=>a.t.localeCompare(b.t));
  if(recv.length){
    lines.push("");
    lines.push("【與本客戶相關的歷史收件（依時間排序）】");
    recv.forEach(x=>{
      if(x.t===e.t)return; // 跳過本次新郵件
      lines.push("- ["+x.t+"] "+(x.from||"").split("<")[0].trim()+" 來信｜主旨："+(x.sub||"")+(x.auto_interp?("｜已有解讀："+x.auto_interp.slice(0,120)):""));
    });
  }
  // 3. 歷史外發：sent_log 中 to 是本次發件人域名，或 from 是本客戶信箱
  const custMail=cust?cust.mail:"";
  const brokerDomain=((e.from||"").split("@")[1]||"").toLowerCase();
  const sent=(DATA.sent||[]).filter(s=>{
    const toDom=((s.to||"").split("@")[1]||"").toLowerCase();
    return (brokerDomain&&toDom===brokerDomain)||(custMail&&(s.from||"").toLowerCase()===custMail.toLowerCase());
  });
  if(sent.length){
    lines.push("");
    lines.push("【我方過去寄出的相關郵件】");
    sent.slice(-12).forEach(s=>{
      lines.push("- [我方寄出] to: "+(s.to||"")+"｜主旨："+(s.subject||"")+"｜摘："+(s.body||"").slice(0,150).replace(/\s+/g," "));
    });
  }
  return lines.join("\n");
}
function fmtUSfromBJ(t){
  const m=t.match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return t;
  let mo=+m[1],da=+m[2],h=+m[3],mi=+m[4];
  const bjMin=((mo)*372)+da*1440+h*60+mi;
  const usMin=bjMin-13*60; // 北京 UTC+8，美國東岸冬令時 UTC-5，差13h
  const usH=Math.floor(usMin/60)%24, usD=Math.floor(usMin/1440);
  const ampm=usH<12?"AM":"PM";const h12=((usH%12)||12);
  return `${mo}/${da} ${String(h12).padStart(2,"0")}:${String(mi).padStart(2,"0")} ${ampm} ET（${usD-da<0?"前一天":""}美國東岸）`;
}

function batchDayKey(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let dk;
  if(bj.getUTCHours()<cutHour){const y=new Date(bj.getTime()-86400e3);dk=y.getUTCFullYear()+"-"+(y.getUTCMonth()+1)+"-"+y.getUTCDate();}
  else dk=bj.getUTCFullYear()+"-"+(bj.getUTCMonth()+1)+"-"+bj.getUTCDate();
  return dk;
}
function batchResetCountdown(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let nextReset=new Date(bj);
  nextReset.setUTCHours(cutHour,0,0,0);
  if(bj.getUTCHours()>=cutHour) nextReset=new Date(nextReset.getTime()+86400e3);
  let diff=nextReset.getTime()-bj.getTime();
  if(diff<0) diff=0;
  const h=Math.floor(diff/3600e3),m=Math.floor((diff%3600e3)/60e3),s=Math.floor((diff%60e3)/1000);
  return h+" 小時 "+m+" 分 "+s+" 秒";
}

async function runBatchAI(){
  const nos=[...arguments];
  const btn=document.getElementById("batchStartBtn");
  const pauseBtn=document.getElementById("batchPauseBtn");
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> 分析中…';
  if(pauseBtn){pauseBtn.style.display="inline-block";pauseBtn.textContent="⏸ 暫停分析";}
  window._batchPaused=false;
  window._batchResults=window._batchResults||[];
  const doneNos=window._batchResults.map(r=>r.no);
  const todoNos=nos.filter(n=>!doneNos.includes(n));
  const total=nos.length;
  for(let i=0;i<todoNos.length;i++){
    if(window._batchPaused){
      if(pauseBtn)pauseBtn.textContent="▶ 繼續分析";
      btn.innerHTML="已暫停";
      break;
    }
    const no=todoNos[i];
    const row=document.getElementById("batch_"+no);
    if(row){row.firstChild.innerHTML='<span class="spinner" style="width:14px;height:14px;border:2px solid rgba(139,92,246,.3);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;display:inline-block"></span>';row.style.background="rgba(139,92,246,.08)";}
    try{
      const cust=DATA.customers.find(x=>x.no===no);
      const mails=recentMailsForCustomer(cust,7);
      const files=((DATA.files||{})[no]||[]).map(f=>f.name||f.nm).slice(0,10);
      const tl=((DATA.timeline||{})[no]||[]).slice(0,5).map(t=>"- ["+(t.t||"")+"] "+(t.who||"")+": "+(t.txt||"")).join("\n");
      const ctx="客戶："+cust.name+"，法人="+cust.member+"，狀態="+st(cust.status).lb+"，信箱="+cust.mail+"\n附件："+(files.join("、")||"無")+"\n時間線最新記錄：\n"+(tl||"（無）")+"\n最近 7 天郵件：\n"+(mails.slice(0,5).map(m=>m.t+" "+m.from+"｜"+m.sub+"\n"+(m.body||"").slice(0,300)).join("\n\n")||"無");
      const sys=`你是美國海關 bond 業務顧問。精簡分析這個客戶目前狀態，輸出 JSON：{"summary_zh":"繁體一句話","summary_cn":"簡體一句話","summary_en":"English one line","next_actions":["繁中待辦1","繁中待辦2"]}。不要輸出其他內容。`;
      const out=await callAI(sys,ctx);
      let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={summary_zh:out.slice(0,200),next_actions:[]};}
      const sum=j.summary_zh||j.summary||out.slice(0,200);
      window._batchResults.push({no,cust,j});
      if(row){row.firstChild.textContent="✅";row.style.opacity=.55;row.style.background="";}
      DATA.timeline[no]=DATA.timeline[no]||[];
      const batchItem={t:nowBJ(),who:"AI 批量分析 · "+CURRENT_USER.nm,txt:"🤖 "+sum,summary:sum,nextActions:j.next_actions||[],key:"batch_"+Date.now()+"_"+no};
      DATA.timeline[no].unshift(batchItem);
      cust.aiLastAt=Date.now();persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"timeline",target_client:String(no),detail:JSON.stringify(batchItem)});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_last_at",target_client:String(no),detail:String(Date.now())});
    }catch(e){
      if(row){row.firstChild.textContent="❌";row.style.background="rgba(248,113,113,.08)";}
    }
    const done=window._batchResults.length;
    const pct=Math.round(done/total*100);
    const bar=document.getElementById("batchBar");const pctEl=document.getElementById("batchPct");
    if(bar)bar.style.width=pct+"%";
    if(pctEl)pctEl.textContent=done+" / "+total+"（"+pct+"%）";
  }
  btn.disabled=false;
  if(pauseBtn)pauseBtn.style.display="none";
  if(window._batchPaused){
    btn.innerHTML="▶ 繼續分析剩餘 "+(total-window._batchResults.length)+" 位";
    btn.onclick=function(){window._batchPaused=false;if(pauseBtn)pauseBtn.textContent="⏸ 暫停分析";runBatchAI(...nos);};
  } else {
    btn.innerHTML="✓ 確認寫入";
    btn.onclick=applyBatchResults;
  }
  localStorage.setItem("bcd_batch_ai_last",nowBJ()+" 完成 "+window._batchResults.length+" 位客戶");
}

function applyBatchResults(){
  let n=0;
  (window._batchResults||[]).forEach(r=>{
    const cust=DATA.customers.find(x=>x.no===r.no);if(!cust)return;
    cust.aiTodos=cust.aiTodos||[];
    cust.aiSuggestions=(r.j.next_actions||[]).map(a=>({t:a,added:false,ignored:false}));
    (r.j.next_actions||[]).forEach(a=>{if(!cust.aiTodos.some(t=>t.t===a))cust.aiTodos.unshift({t:a,done:false,ts:Date.now()});});
    cust.aiLastAt=Date.now();
    persistCust(r.no);
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(r.no),detail:JSON.stringify({aiTodos:cust.aiTodos,aiSuggestions:cust.aiSuggestions,aiLastAt:cust.aiLastAt})});
    addClientAudit(r.no,"AI 批量分析","","","AI 自動分析");
    n++;
  });
  closeModal();render();toast("✅ 已寫入並保存 "+n+" 位客戶的 AI 分析結果");
}

function doDeleteCust(no){
  const idx=DATA.customers.findIndex(x=>String(x.no)===String(no));
  if(idx<0){closeModal();return;}
  const backup=DATA.customers[idx];
  RECYCLE_BIN.push({
    cust:backup,
    timeline:DATA.timeline[no]||[],
    clientAudit:clientAudit[no]||[],
    deletedAt:Date.now(),
    expiresAt:Date.now()+30*86400e3
  });
  saveRecycleBin();
  DATA.customers.splice(idx,1);
  delete DATA.timeline[no];
  delete clientAudit[no];
  delete ownerMap[no];
  localStorage.removeItem("bcd_tl_"+no);
  localStorage.removeItem("bcd_client_audit_"+no);
  try{
    const saved=JSON.parse(localStorage.getItem("bcd_cust_override")||"{}");
    delete saved[no];
    localStorage.setItem("bcd_cust_override",JSON.stringify(saved));
  }catch(e){}
  addAudit("刪除客戶",backup.name);
  sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_delete",target_client:String(no),detail:JSON.stringify({name:backup.name,cust:backup,timeline:DATA.timeline[no]||[],deletedAt:Date.now(),expiresAt:Date.now()+30*86400e3})});
  saveDataJson();
  closeModal();
  curCust=null;custTab="info";
  render();
  toast("客戶已移入回收站，30 天內可恢復");
}
async function syncRecycleFromCloud(){
  try{
    const dels=await sbReq("audit_logs","GET",null,"?select=*&action=eq.cust_delete&order=created_at.desc&limit=200");
    const restores=await sbReq("audit_logs","GET",null,"?select=*&action=eq.cust_restore&order=created_at.desc&limit=200");
    const restoredNos=new Set((restores||[]).map(r=>String(r.target_client)));
    const now=Date.now();
    const seenNos=new Set(RECYCLE_BIN.map(r=>String(r.cust.no)));
    (dels||[]).forEach(d=>{
      if(restoredNos.has(String(d.target_client)))return;
      let detail={};try{detail=JSON.parse(d.detail||"{}");}catch(e){}
      if(!detail.cust)return;
      if(detail.expiresAt&&detail.expiresAt<now)return;
      if(seenNos.has(String(detail.cust.no)))return;
      seenNos.add(String(detail.cust.no));
      RECYCLE_BIN.push({cust:detail.cust,timeline:detail.timeline||[],clientAudit:detail.clientAudit||[],deletedAt:detail.deletedAt||Date.now(),expiresAt:detail.expiresAt||now+30*86400e3});
    });
    RECYCLE_BIN=RECYCLE_BIN.filter((r,i,arr)=>arr.findIndex(x=>String(x.cust.no)===String(r.cust.no))===i);
    saveRecycleBin();
  }catch(e){}
}
function renderRecycleBin(){
  const now=Date.now();
  RECYCLE_BIN=RECYCLE_BIN.filter(r=>{
    if(r.expiresAt<now){return false;}
    return true;

  RECYCLE_BIN=RECYCLE_BIN.filter((r,i,arr)=>arr.findIndex(x=>String(x.cust.no)===String(r.cust.no))===i);

  syncRecycleFromCloud().then(()=>{const el=document.getElementById("recycleBinList");if(el)el.outerHTML=renderRecycleBin();});

function restoreCust(i){

}

async function permanentDeleteCust(i){
  const r=RECYCLE_BIN[i];if(!r)return;
  const no=String(r.cust.no);
  toast("正在徹底刪除 "+(r.cust.name||"")+" 的所有文件…");
  try{
    const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
    // 1. 從 files.json 拿該客戶所有文件
    const fr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/files.json",{headers:{Authorization:"token "+ghtok}});
    const fm=await fr.json();
    const filesSha=fm.sha;
    const files=JSON.parse(decodeURIComponent(escape(atob(fm.content.replace(/\n/g,"")))));
    const toDel=(files[no]||[]).slice();
    // 2. 逐個刪除雲端文件
    let ok=0,fail=0;
    for(const f of toDel){
      const p=decodeURIComponent(f.path||"");
      try{
        const gr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+encodeURIComponent(p),{headers:{Authorization:"token "+ghtok}});
        if(gr.ok){const gm=await gr.json();await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+encodeURIComponent(p),{method:"DELETE",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"permanent delete "+no,sha:gm.sha})});ok++;}
      }catch(e){fail++;}
    }
    // 3. 從 files.json 刪除 key
    delete files[no];
    const fb64=btoa(unescape(encodeURIComponent(JSON.stringify(files))));
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/files.json",{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"永久刪除 #"+no,content:fb64,sha:filesSha})});
    // 4. 從 data.json 清理 timeline
    const dr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{headers:{Authorization:"token "+ghtok}});
    const dm=await dr.json();
    const data=JSON.parse(decodeURIComponent(escape(atob(dm.content.replace(/\n/g,"")))));
    if(data.timeline)delete data.timeline[no];
    if(data.customers)data.customers=data.customers.filter(c=>String(c.no)!==no);
    const db64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"永久刪除 #"+no+" 資料",content:db64,sha:dm.sha})});
    // 5. 從本地回收站移除
    RECYCLE_BIN.splice(i,1);
    saveRecycleBin();
    addAudit("永久刪除客戶",r.cust.name+"｜刪除文件"+ok+"個");
    toast("✅ 已永久刪除 "+(r.cust.name||"")+"，清除文件"+ok+"個");
    render();
  }catch(e){
    console.error("permanentDelete",e);
    toast("刪除過程出錯："+e.message);
  }
}

function initSlideLogin(){
  const track=document.getElementById("slideTrack");
  const handle=document.getElementById("slideHandle");
  const container=document.getElementById("slideLogin");
  const text=document.getElementById("slideText");
  if(!track||!handle||!container)return;
  const texts={zh:"右滑方塊登入",cn:"滑动方块登录",en:"Slide to Sign In"};
  text.textContent=texts[CURRENT_LANG]||texts.zh;
  let dragging=false,startX=0,currentX=0,done=false;
  const maxX=()=>container.offsetWidth-handle.offsetWidth;
  function onDown(e){
    if(done)return;
    dragging=true;
    const pt=e.touches?e.touches[0]:e;
    startX=pt.clientX-handle.offsetLeft;
    if(e.cancelable)e.preventDefault();
  }
  function onMove(e){
    if(!dragging||done)return;
    const pt=e.touches?e.touches[0]:e;
    const x=pt.clientX-startX;
    currentX=Math.max(0,Math.min(x,maxX()));
    handle.style.left=currentX+"px";
    track.style.width=currentX+handle.offsetWidth+"px";
    text.style.opacity=1-currentX/maxX();
    if(e.cancelable)e.preventDefault();
  }
  function onUp(){
    if(!dragging||done)return;
    dragging=false;
    if(currentX>=maxX()-10){
      done=true;
      handle.style.left=maxX()+"px";
      track.style.width="100%";
      handle.classList.add("done");
      handle.querySelector(".arrow").textContent="✓";
      text.style.opacity=0;
      setTimeout(()=>{doLogin();},300);
    }else{
      handle.style.left="0px";
      track.style.width="0px";
      text.style.opacity=1;
    }
  }
  handle.addEventListener("mousedown",onDown);
  handle.addEventListener("touchstart",onDown,{passive:false});
  container.addEventListener("mousedown",onDown);
  container.addEventListener("touchstart",onDown,{passive:false});
  document.addEventListener("mousemove",onMove);
  document.addEventListener("touchmove",onMove,{passive:false});
  document.addEventListener("mouseup",onUp);
  document.addEventListener("touchend",onUp);
  window._resetSlideLogin=function(){
    done=false;currentX=0;
    handle.style.left="0px";
    track.style.width="0px";
    handle.classList.remove("done");
    handle.querySelector(".arrow").textContent="⇨";
    text.style.opacity=1;
  };
}
