<script>
(function(){
  var V="v20261109winlane2";
  try{
    var oldV=localStorage.getItem("bcd_ver");
    if(oldV!==V){
      // 版本變更：保留本地客戶緩存與覆蓋，避免未同步修改被清掉；重複卡片由 loadPersisted 以 EIN 去重
      localStorage.setItem("bcd_ver",V);
      // 版本變更：強制帶時間戳重新抓取，徹底繞過 GitHub Pages CDN 快取
      var u=new URL(location.href);
      u.searchParams.set("v",V);
      if(location.href.split("#")[0]!==u.toString().split("#")[0]){location.replace(u.toString());return;}
      location.reload(true);
    }
  }catch(e){}
})();
</script>
<title>UCRM｜美國進口客戶關係管理系統</title>
<link rel="icon" href="favicon-32.png">
<style>
:root{
  --bg:#0a0f1e; --bg2:#111933; --card:#151e3a; --card2:#1a2547;
  --line:#253358; --txt:#e4e9f4; --mut:#8896b8; --dim:#5a6a8e;
  --acc:#5b8def; --acc2:#8bb4ff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --ind:#5b8def; --radius:16px; --radius-sm:12px;
  --shadow:0 4px 24px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.35);
}
body[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f8;
  --line:#d8e0ec; --txt:#1c2733; --mut:#5d6f84; --dim:#94a3b5;
  --acc:#1f6fe0; --acc2:#3b8bf5; --ok:#18a05f; --warn:#d98a16; --err:#d83a4b;
  --ind:#1f6fe0;
}
body[data-theme="light"] .side{background:linear-gradient(180deg,#ffffff,#f0f4fa);border-right:1px solid var(--line)}
body[data-theme="light"] .brand .logo{background:linear-gradient(135deg,#dce9fb,#eaf2fc);border-color:#bcd4f5;color:var(--acc)}
body[data-theme="light"] .mtop{background:rgba(255,255,255,.95)}
/* ===== 啟動載入頁：高端深色背景與真實 Logo ===== */
#bootLoader{
  background:
    radial-gradient(900px 520px at 82% -10%, rgba(74,158,255,.16), transparent 60%),
    radial-gradient(780px 540px at 6% 110%, rgba(41,128,185,.14), transparent 62%),
    radial-gradient(600px 400px at 50% 48%, rgba(124,192,255,.05), transparent 65%),
    linear-gradient(160deg,#0c1017 0%,#0e141d 46%,#0a0e14 100%);
  overflow:hidden;
}
#bootLoader::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(ellipse 72% 62% at 50% 45%,#000 28%,transparent 76%);
  mask-image:radial-gradient(ellipse 72% 62% at 50% 45%,#000 28%,transparent 76%);
}
#bootLoader::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 92% 82% at 50% 50%,transparent 52%,rgba(0,0,0,.52));
}
#bootLoader .boot-card{
  position:relative;z-index:2;width:342px;
  background:linear-gradient(165deg,rgba(30,38,52,.9),rgba(19,24,33,.92));
  border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:38px 34px 34px;
  box-shadow:0 32px 84px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  animation:bootCardIn .7s cubic-bezier(.22,.8,.3,1) both;
}
#bootLoader .boot-logo{
  width:74px;height:74px;margin:0 auto 16px;border-radius:19px;display:block;
  box-shadow:0 14px 32px rgba(41,128,185,.42),0 2px 8px rgba(0,0,0,.42);
  animation:bootLogoIn .8s cubic-bezier(.22,.8,.3,1) both,bootFloat 5s ease-in-out 1s infinite;
}
#bootLoader .boot-title{font-size:17px;font-weight:700;letter-spacing:.3px;color:var(--txt);text-align:center;margin-bottom:24px}
#bootLoader .boot-track{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-bottom:15px}
#bootLoader #bootProgress{height:100%;background:linear-gradient(90deg,#2980b9,#4a9eff,#7cc0ff);box-shadow:0 0 12px rgba(74,158,255,.6);border-radius:99px}
#bootLoader #bootStep{text-align:center;color:var(--mut);font-size:13px;letter-spacing:.2px}
@keyframes bootCardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bootLogoIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes bootFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#bootLoader *{animation:none!important}}
/* ===== 歸檔包：資料夾形態卡片 ===== */
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:8px}
.arch-card{position:relative;margin-top:12px;display:flex;flex-direction:column;align-items:center;text-align:center;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-top:none;
  border-radius:2px 10px 12px 12px;padding:22px 14px 16px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.arch-card::before{content:"";position:absolute;top:-13px;left:0;width:84px;height:14px;
  background:var(--card2);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0}
.arch-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.4);border-color:var(--acc)}
.arch-photo{width:64px;height:64px;border-radius:14px;object-fit:cover;margin-bottom:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.35);background:var(--bg2)}
.arch-name{font-size:14px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:4px;word-break:break-word}
.arch-no{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:8px;letter-spacing:.5px}
.arch-meta{font-size:12px;color:var(--mut);margin-bottom:14px}
/* 客戶頭像重疊堆疊 */
.avatar-stack{display:inline-flex;align-items:center}
.avatar-stack .ast{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);object-fit:cover;margin-left:-8px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);background:var(--card2)}
.avatar-stack .ast:first-child{margin-left:0}
.avatar-stack .ast-more{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--txt);background:var(--card2)}
.ast-card{cursor:default}
.ast-card .vl{font-size:34px}
.ast-wrap{position:relative;display:inline-block;margin-top:14px}
.ast-pop{display:none;position:absolute;bottom:calc(100% + 10px);left:0;
  background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  min-width:240px;box-shadow:0 18px 44px rgba(0,0,0,.55);z-index:30;font-size:12px;color:var(--txt)}
.ast-pop:after{content:"";position:absolute;top:100%;left:24px;border:6px solid transparent;border-top-color:var(--line)}
.ast-wrap:hover .ast-pop{display:block}
/* 已出單慶賀高卡 */
.issued-card{position:relative;flex:0 0 26%;min-width:210px;border-radius:16px;padding:22px 22px 18px;
  background:linear-gradient(160deg,#16243a 0%,#131a26 60%,#10151f 100%);border:1px solid rgba(124,192,255,.28);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.iss-glow{position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,158,255,.35) 0%,rgba(124,192,255,.12) 45%,transparent 70%);pointer-events:none}
.iss-lb{font-size:13px;color:var(--mut);letter-spacing:.3px;position:relative}
.iss-vl{font-size:52px;font-weight:800;color:#fff;line-height:1.1;margin:6px 0 2px;position:relative}
.iss-vl span{font-size:22px;font-weight:600;color:var(--mut)}
.iss-tg{font-size:12px;color:#7fd1a0;position:relative}
.iss-inc{position:relative;margin-top:10px;font-size:11.5px;color:var(--mut)}
.iss-inc b{color:#fff;font-size:15px;margin-left:4px}
.done-avatars{margin-top:auto;padding-top:16px;display:flex;align-items:center}
.done-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #1c2b40;margin-left:-10px;
  box-shadow:0 6px 18px rgba(74,158,255,.35)}
.done-avatar:first-child{margin-left:0}
/* 付款上下結構卡 */
.pay-card{display:flex;flex-direction:column;padding:14px 16px}
.pay-half{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pay-div{height:1px;background:var(--line);margin:8px 0}
.ph-head{display:flex;align-items:baseline;justify-content:space-between}
.ph-lb{font-size:12px;color:var(--mut)}
.ph-num{font-size:26px;font-weight:700;color:var(--txt)}
/* 更大頭像，彈窗往下開 */
.ast{width:44px;height:44px;border-width:2.5px}
.ast-wrap{margin-top:10px}
.ast-pop{top:calc(100% + 12px);bottom:auto;font-size:12.5px;min-width:250px}
.ast-pop:after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--line)}
/* language dropdown */
.lang{position:relative}
.lang .menu{display:none;position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;overflow:hidden;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lang .menu.show{display:block}
.lang .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:10px 14px;font-size:13px;cursor:pointer}
.lang .menu button:hover{background:var(--card2)}
/* notification drawer */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:90;transition:right .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
.drawer.show{right:0}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:10px}
.drawer .dgroup{font-size:11px;color:var(--dim);padding:8px 8px 4px;letter-spacing:.05em}
.drawer .ditem{display:flex;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:var(--card2)}
.drawer .ditem.unread{box-shadow:inset 3px 0 0 var(--err)}
.drawer .ditem .who{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--ind);border-radius:6px;padding:2px 7px;height:fit-content}
.drawer .ditem .tx{flex:1;min-width:0}
.drawer .ditem .tt{font-size:13px;line-height:1.4}
.drawer .ditem .tm{font-size:11px;color:var(--dim);margin-top:2px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.app{display:flex;min-height:100vh}
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line);z-index:60;align-items:center;gap:10px;padding:0 14px}
.mtop .burger{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mtop .mtitle{font-size:14px;font-weight:700;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .bell2{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer;position:relative}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:55}
.overlay.show{display:block}
.side.open{transform:translateX(0)!important}@media(max-width:900px){
  body{overflow-x:hidden}
  .mtop{display:flex}
  .side{display:none;width:260px;z-index:70;transform:none;transition:none}
  .side.open{display:flex}
  .main{margin-left:0;padding:74px 14px 70px}
  .r4{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:repeat(1,1fr)}
  .form-grid{grid-template-columns:1fr}
  .topbar{display:none}
  .panel{overflow:hidden}
  .em,.mailitem .em{overflow-wrap:anywhere;word-break:break-all}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .funnel{flex-wrap:wrap}
  .search input{min-width:120px}
}
/* sidebar */
.side{width:248px;background:linear-gradient(180deg,#0d1530,#0a1128);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:20px 16px;display:flex;flex-direction:column;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 4px 20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d3350,#0e1c2e);border:1px solid #2b4a70;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc2);font-size:16px}
.brand .logo-img{height:64px;width:100%;border-radius:8px;object-fit:cover;object-position:center;flex:0 0 auto;display:block;box-sizing:border-box}
.brand .bt{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand .bs{font-size:10px;color:var(--dim)}
.sideclock{background:rgba(91,141,239,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:10px;line-height:1.9;color:var(--mut)}
.sideclock b{color:var(--txt);font-weight:600}
.sideclock .z{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px}.sideclock .z .zem{font-size:15px;flex:0 0 auto}.sideclock .z b{flex:1 1 auto;font-size:13px;font-weight:600}.sideclock .z span:last-child{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut)}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.nav{padding:4px 0}
.nav .grp{font-size:10px;color:var(--dim);text-transform:none;padding:22px 10px 8px;letter-spacing:.8px;font-weight:600;border-top:1px solid rgba(255,255,255,.05);margin-top:10px}
.nav .grp:first-child{border-top:none;margin-top:0;padding-top:8px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mut);font-size:13.5px;margin-bottom:3px;border:1px solid transparent;transition:all .18s ease;font-weight:500}
.nav a:hover{background:rgba(91,141,239,.1);color:var(--txt)}
.nav a.on{background:linear-gradient(135deg,#3b6fe0,#5b8def);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 16px rgba(91,141,239,.3)}
.nav a.on .ic{color:#fff}
.nav a .ic{width:20px;text-align:center;font-size:14px;color:var(--mut)}
.nav a.on .dot{background:#fff;color:var(--acc)}
.nav a .dot{margin-left:auto;background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
.side .foot{border-top:1px solid rgba(255,255,255,.06);padding-top:12px;margin-top:8px;flex-shrink:0}
.upgrade-banner{background:linear-gradient(135deg,rgba(74,158,255,.12),rgba(124,192,255,.06));border:1px solid rgba(74,158,255,.25);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
.upgrade-banner:hover{border-color:rgba(74,158,255,.5);background:linear-gradient(135deg,rgba(74,158,255,.18),rgba(124,192,255,.1))}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26334a;color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-row .nm{font-size:12px;color:var(--txt)}
.user-row .rl{font-size:10px;color:var(--dim)}
/* main */
.main{margin-left:248px;flex:1;min-width:0;padding:24px 32px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.topbar .time{font-size:11px;color:var(--mut);margin-right:auto;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.lang{position:relative}
.lang button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.bell{position:relative;background:var(--bg2);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:15px}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:700}
/* headings */
h1{font-size:24px;font-weight:700;color:var(--txt);margin-bottom:6px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px;margin-bottom:24px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
/* cards */
.row{display:grid;gap:16px}
.row>*{min-width:0}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease;box-shadow:var(--shadow)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--acc)}
.stat:before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,30%),rgba(74,158,255,.10),transparent 60%);opacity:0;transition:.2s;pointer-events:none}
.stat:hover:before{opacity:1}
.ast-card{cursor:default;transition:transform .18s ease,box-shadow .18s ease}
.ast-card:hover{transform:scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ast-card:before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,30%),rgba(74,158,255,.10),transparent 60%);opacity:0;transition:.2s;pointer-events:none;border-radius:inherit}
.ast-card:hover:before{opacity:1}
.issued-card{transition:transform .18s ease}
.issued-card:hover{transform:scale(1.01)}
.stat.featured{border-color:var(--acc);background:linear-gradient(135deg,rgba(59,130,246,.08),transparent)}
.stat .lb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:28px;font-weight:800;color:var(--txt);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat.featured .vl{color:var(--acc)}
.stat .tg{font-size:11px;color:var(--ok);margin-top:4px}
.stat .tag2{font-size:11px;color:var(--warn)}
table td,table th{font-variant-numeric:tabular-nums}
table td.num,table th.num{text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
/* funnel */
.funnel{display:flex;gap:8px;align-items:flex-end}
.fb{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(74,158,255,.5),rgba(74,158,255,.12));border:1px solid #2b4a70;padding:10px 8px 8px;text-align:center;position:relative}
.fb .fv{font-size:20px;font-weight:800;color:var(--acc2)}
.fb .fl{font-size:10px;color:var(--mut);margin-top:2px}
/* chart ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{--p:70;width:150px;height:150px;position:relative;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#26344a 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .rc{position:relative;font-size:22px;font-weight:800;color:var(--txt)}
.legend{display:grid;gap:8px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* AI Document Bot workspace */
.ai-workspace{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.ai-side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.ai-side-sec{display:flex;flex-direction:column;gap:8px}

.ai-doc-tabs button,.ai-sig-tabs button{flex:1;background:transparent;border:none;color:var(--mut);font-size:12px;padding:7px 6px;border-radius:7px;cursor:pointer;transition:.15s;line-height:1.3}
.ai-doc-tabs button.on,.ai-sig-tabs button.on{background:var(--acc);color:#fff}
.ai-select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--txt);font-size:13px;outline:none;cursor:pointer}
.ai-fl{font-size:11px;color:var(--dim);margin-top:2px}
.ai-side-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ai-side-actions .btn{display:flex;align-items:center;justify-content:center;gap:7px}
.ai-llm{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--mut)}
.ai-llm-dot{width:8px;height:8px;border-radius:50%;background:#6b7280;flex-shrink:0}
.ai-llm-dot.ok{background:#3fca8a}.ai-llm-dot.fb{background:#f59e0b}.ai-llm-dot.load{background:#3b82f6;animation:aiPulse 1s infinite}
@keyframes aiPulse{50%{opacity:.35}}
.ai-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:80px 20px;color:var(--mut);text-align:center;min-height:420px}
.ai-empty svg{opacity:.4}
@keyframes aiSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes aiPulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes aiBar{0%{width:8%}50%{width:72%}100%{width:96%}}
.ai-load-spin{animation:aiSpin 1.6s linear infinite;color:var(--fg)}
.ai-load-spark-big{color:var(--fg);animation:aiSpark 1.8s ease-in-out infinite}
@keyframes aiSpark{0%,100%{transform:scale(1) rotate(0deg);opacity:.55}50%{transform:scale(1.18) rotate(12deg);opacity:1}}
.ai-load-spark{animation:aiPulse 1.2s ease-in-out infinite;color:var(--fg)}
.ai-prog{width:220px;height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.ai-prog>i{display:block;height:100%;background:var(--fg);border-radius:99px;animation:aiBar 2.4s ease-in-out infinite}
.ai-load-time{font-size:11px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}
.ai-gen{outline:none}
.ai-gen:focus{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.ai-main{min-width:0;overflow-x:auto}
.ai-sheet{background:#fff;color:#000;border-radius:14px;border:1px solid var(--line);padding:20px 24px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:210mm;min-height:297mm;max-width:100%;margin:0 auto;box-sizing:border-box}
.ai-gen{font-family:'Times New Roman',Times,serif;color:#000!important;outline:none;min-height:260mm}
.ai-gen *{color:#000!important;border-color:#000!important}
.ai-gen table{border-collapse:collapse}
.ai-gen td,.ai-gen th{padding:5px 8px;border:1px solid #000;font-size:12px;color:#000}
.ai-gen input,.ai-gen button{color:#000!important}
.ai-head-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ai-head-row .ai-statusbar{margin-top:0}
.ai-load-btn{display:inline-flex;align-items:center;gap:8px}
.ai-load-btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:ai-spin .8s linear infinite;display:inline-block}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-period{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mut)}
.ai-period input[type=month]{flex:1;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12px;outline:none}
.ai-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;transition:.15s;color:var(--mut)}
.ai-drop:hover{border-color:var(--acc);color:var(--fg);background:var(--bg)}
@page{size:A4;margin:12mm}
@media print{
  body *{visibility:hidden}
  .ai-sheet,.ai-sheet *{visibility:visible}
  .ai-sheet{position:absolute;left:0;top:0;width:210mm;min-height:297mm;border:none;box-shadow:none;border-radius:0;padding:0}
  .ai-gen{width:100%!important;max-width:none!important}
  .ai-gen input,.ai-gen button{display:none!important}
  .ai-gen .sig-line{display:block!important}
  .sidebar,.topbar,.ai-side,.ai-statusbar,.ai-note,h1,.toast,.modal{display:none!important}
}
.pfs-doc h2{text-align:center;letter-spacing:3px;font-size:18px;margin-bottom:20px;color:#111}
.pfs-top{display:grid;grid-template-columns:1fr 200px;gap:14px;margin-bottom:16px}
.pfs-top label,.bond-fl label,.sig-date label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px;font-weight:700}
.ai-text{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:8px 10px;font-size:13px;outline:none;background:#fff;color:#111}
.ai-text:focus{border-color:var(--acc)}
.pfs-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.pfs-table th{background:#f3f4f6;border:1px solid #9ca3af;padding:7px;font-size:12px;text-align:left;letter-spacing:.5px}
.pfs-table td{border:1px solid #9ca3af;padding:5px 8px}
.pfs-table td.lb{width:32%;font-size:12px;color:#374151}
.pfs-table td.vl{width:18%}
.ai-money{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:12px;outline:none;text-align:right;background:#fff;color:#111}
.pfs-table tr.sum td{background:#f9fafb;font-weight:700;font-size:12px}
.bond-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bond-fl.full{grid-column:1/-1}
.sig-block{margin-top:22px;border-top:1px solid #d1d5db;padding-top:16px}
.sig-title{font-size:12px;font-weight:700;color:#374151;margin-bottom:12px;letter-spacing:.5px}
.sig-type{max-width:340px}
.ai-signame{width:100%;border:none;border-bottom:1px solid #9ca3af;background:transparent;font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;padding:4px 2px;outline:none;color:#111}
.sig-line{height:1px;background:#9ca3af;margin-top:6px}
.sig-type label{display:block;font-size:11px;color:#6b7280;margin-top:4px}
.sig-draw{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sig-draw canvas{border:1px dashed #9ca3af;border-radius:8px;background:#fafafa;width:100%;max-width:420px;touch-action:none}
.sig-up{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sig-up img{max-height:90px;border:1px solid #e5e7eb;border-radius:8px;padding:6px;background:#fafafa}
.sig-date{max-width:220px;margin-top:14px}
.ai-statusbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-top:14px;font-size:12px;color:var(--mut)}
.ai-dot{width:8px;height:8px;border-radius:50%;background:#3fca8a}
.ai-dot.dirty{background:#f59e0b}
.ai-note{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:10px}
@media(max-width:900px){.ai-workspace{grid-template-columns:1fr}.ai-side{position:static}.pfs-top{grid-template-columns:1fr}.bond-grid{grid-template-columns:1fr}}
/* view switch */
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.switch button{padding:7px 16px;background:transparent;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.switch button.on{background:#1e3a5c;color:var(--acc2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--mut);text-align:left;padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a2230;color:var(--txt)}
tr:hover td{background:rgba(91,141,239,.06)}
/* tags */
.tag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.t-blue{background:rgba(74,158,255,.14);color:var(--acc2);border:1px solid #2b4a70}
.t-green{background:rgba(63,202,138,.14);color:var(--ok);border:1px solid #23583f}
.t-amber{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid #5a4527}
.t-red{background:rgba(255,93,108,.14);color:var(--err);border:1px solid #5a2b34}
.t-gray{background:rgba(132,148,167,.14);color:var(--mut);border:1px solid #333c4c}
/* client card */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.2s;position:relative;display:flex;gap:16px;align-items:stretch;overflow:hidden;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ccard:before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,30%),rgba(74,158,255,.10),transparent 60%);opacity:0;transition:.2s;pointer-events:none}
.ccard:hover:before{opacity:1}
.cphoto{width:100px;align-self:stretch;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid var(--line);background:#1a2230;display:block}
.ccard .cbody{flex:1;min-width:0;padding-bottom:34px;position:relative}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ccard .no{font-size:11px;color:var(--dim)}
.noref{font-weight:400;font-size:9px;color:var(--mut);margin-left:4px;opacity:.8}
.ccard .nm{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;word-break:keep-all;overflow-wrap:normal;max-width:100%;line-height:1.3}
.ccard .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7}
.ccard .meta b{color:var(--txt);font-weight:600}
.ccard .foots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ccard .foots .badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.badge.warn{color:var(--err);border-color:#5a2b34}
/* quick buttons */
.quick{position:absolute;bottom:8px;right:10px;display:flex;gap:5px;flex-wrap:wrap;opacity:0;transition:.15s;z-index:2}
.ccard:hover .quick{opacity:1}
.quick button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer}
.quick button:hover{color:var(--acc2);border-color:#2f4a6e}
/* search */
.search{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.search input{flex:1;min-width:200px}
/* button */
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 16px;border-radius:10px;font-size:12.5px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:#2f4a6e;color:var(--acc2)}
.btn.primary{background:linear-gradient(135deg,#3b6fe0,#5b8def);border-color:#3b6fe0;color:#fff;box-shadow:0 4px 14px rgba(91,141,239,.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:11px}
/* mail status */
.mailitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #1a2230}
.mailitem:last-child{border-bottom:0}
.mailitem .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mailitem .st.fail{background:var(--err)}
.mailitem .em{font-size:12px;color:var(--txt);flex:1}
.mailitem .nm{font-size:11px;color:var(--mut)}
.mailitem .unread{background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.mailitem .done{color:var(--dim);font-size:11px}
/* log */
.logrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #1a2230;font-size:12px;align-items:flex-start}
.logrow .t{color:var(--dim);white-space:nowrap;font-size:11px}
.logrow .c{color:var(--txt);flex:1}
.logrow .o{color:var(--ok);font-size:11px;white-space:nowrap}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 16px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.field{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #1a2230;font-size:13px;align-items:start}
.field .k{color:var(--mut)}
.field .v{color:var(--txt)}
.field .v.warn{color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px}
.fg textarea{min-height:80px;resize:vertical}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:800px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-size:16px;margin-bottom:16px;color:var(--txt)}
.mbox .mrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* timeline */
.tl{position:relative;margin-left:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#223048}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tli.e-mail::before{background:var(--acc)}
.tli.e-note::before{background:var(--warn)}
.tli.e-auto::before{background:var(--mut)}
.tli.e-doc::before{background:var(--ok)}
.tli .tt{font-size:13px;color:var(--txt);font-weight:600}
.tli .tm{font-size:11px;color:var(--dim);margin-top:2px}
.tli .tx{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.tli .src{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5c;color:#e6f0ff;padding:11px 20px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;display:none;border:1px solid #2b5a92}
.ghgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docbox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit}
.docbox .fi{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.fthumb{cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.fthumb img{width:100%;height:90px;object-fit:cover;display:block}
.fthumb .fcap{font-size:10px;padding:6px 8px;color:var(--mut);word-break:break-all;line-height:1.3;max-height:3.4em;overflow:hidden}
.docbox .fn{font-size:12px;color:var(--txt);flex:1;word-break:break-all}
.docbox .ft{font-size:10px;color:var(--dim)}
.draftbox{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:2;color:var(--txt)}
.sync{display:inline-block;font-size:10px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sync.ok{color:var(--ok);border:1px solid #23583f}
.sync.no{color:var(--warn);border:1px solid #5a4527}
.sync.fail{color:var(--err);border:1px solid #5a2b34}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.hidden{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .25s;width:248px;z-index:70}.main{margin-left:0}.r4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.ccard .foots .tag,.ccard .foots .badge{font-size:10px}.ccard .cphoto{width:60px;height:60px}.ccard .quick button{font-size:10px}}
/* ===== 登入頁 ===== */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,rgba(74,158,255,.18),transparent),var(--bg);padding:20px}
#loginScreen.hide{display:none}
.login-card{width:380px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card .form-group{margin:16px 0}
.login-card .form-group label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:500}
.login-card .form-group input{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .2s}
.login-card .form-group input:focus{border-color:var(--acc)}
.login-btn{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
/* 滑塊登錄 */
.slide-login{margin-top:22px;position:relative;height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;user-select:none}
.slide-login .slide-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--mut);pointer-events:none}
.slide-login .slide-track{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));width:0;transition:width .2s}
.slide-login .slide-handle{position:absolute;left:0;top:0;width:46px;height:46px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:2;transition:background .2s}
.slide-login .slide-handle:active{cursor:grabbing}
.slide-login .slide-handle.done{background:var(--acc2)}
.slide-login .slide-handle .arrow{font-size:18px;color:var(--acc);transition:color .2s}
.slide-login .slide-handle.done .arrow{color:#fff}
.login-err{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
.login-foot{text-align:center;color:var(--dim);font-size:11px;margin-top:18px}
.login-head{text-align:center;margin-bottom:8px}
.login-head .logo-ico{width:58px;height:58px;border-radius:14px;margin:0 auto 10px;object-fit:cover;display:block}
.login-head .lt{font-size:20px;font-weight:800;letter-spacing:1px}
.login-head .ls{font-size:13px;color:var(--mut);margin-top:4px}
.login-lang{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.login-lang button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.login-lang button.on{color:var(--acc);border-color:var(--acc)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;opacity:0;transform:translateY(12px)}
.doc-card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.15)}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card-animate{animation:cardIn .35s ease forwards}
/* 骨架屏 */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,rgba(255,255,255,.06) 50%,var(--bg2) 75%);background-size:400px 100%;animation:shimmer 1.2s infinite linear;border-radius:8px}
.skeleton-text{height:14px;margin:6px 0}
.skeleton-title{height:20px;width:60%;margin:8px 0}
.skeleton-card{height:120px;margin-bottom:12px}
.skeleton-avatar{width:40px;height:40px;border-radius:50%}
/* 圖片模糊漸顯 */
img.blur-up{filter:blur(12px);opacity:0;transition:filter .5s ease,opacity .5s ease}
img.blur-up.loaded{filter:blur(0);opacity:1}
/* 按鈕加載狀態 */
.btn.loading{opacity:.7;pointer-events:none;position:relative}
.btn.loading::after{content:"";position:absolute;right:12px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 403 無權限 */
.forbidden-page{text-align:center;padding:60px 20px}
.forbidden-page .code{font-size:72px;font-weight:800;color:var(--acc);opacity:.3;margin-bottom:16px}
.forbidden-page .msg{font-size:16px;color:var(--txt);margin-bottom:8px}
.forbidden-page .sub{font-size:13px;color:var(--mut);margin-bottom:24px}
.doc-ava{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:30px;margin-bottom:10px}
.doc-ava img{width:100%;height:100%;object-fit:cover}
.doc-nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-mb{font-size:11px;color:var(--mut);margin-top:2px}
.doc-cnt{font-size:11px;color:var(--dim);margin-top:6px}
.doc-own{display:inline-block;margin-top:6px;font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(90,140,255,.15);color:#8fb4ff}
.own-chip{display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--mut);font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer}
.own-chip.on{background:var(--acc);color:#fff}
.own-face{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file-cell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file-cell .pv{width:100%;aspect-ratio:4/3;background:#0d1420;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;cursor:pointer}
.file-cell .pv img{width:100%;height:100%;object-fit:cover}
.file-cell .fn{font-size:11px;padding:6px 8px;line-height:1.3;word-break:break-all;min-height:30px}
.file-cell .meta{font-size:10px;color:var(--dim);padding:0 8px 6px}
/* AI 即時進度浮動面板 */
#aiLogPanel{position:fixed;right:14px;bottom:14px;width:320px;max-width:calc(100vw - 28px);background:var(--bg2,#1e2126);border:1px solid var(--line,#333);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:9000;display:none;flex-direction:column;overflow:hidden}
#aiLogPanel.open{display:flex}
#aiLogHead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(139,92,246,.12);font-size:12px;font-weight:600;color:var(--tx,#eee);cursor:pointer}
#aiLogHead .dot{width:8px;height:8px;border-radius:50%;background:#8b5cf6;animation:aiPulse 1.2s infinite}
#aiLogHead.done .dot{background:#10b981;animation:none}
@keyframes aiPulse{0%,100%{opacity:1}50%{opacity:.35}}
#aiLogBody{max-height:220px;overflow-y:auto;padding:8px 12px;font-size:11.5px;line-height:1.7;color:var(--mut,#bbb)}
#aiLogBody .lg{padding:2px 0;border-bottom:1px dashed var(--line,#2c2c2c)}
#aiLogBody .lg b{color:var(--tx,#ddd);font-weight:600}
#aiLogBody .lg.ok{color:#10b981}
#aiLogBody .lg.warn{color:#f0a040}
#aiLogBody .lg.err{color:#ef4444}
#aiLogMin{margin-left:auto;font-size:13px;color:var(--mut,#99);line-height:1;padding:2px 8px;border-radius:6px;cursor:pointer;user-select:none}
#aiLogMin:hover{background:rgba(255,255,255,.08);color:#fff}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}@keyframes spin{to{transform:rotate(360deg)}}

.ic-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.nav a .ic-circle{width:28px;height:28px}
</style>

// 4 位參考編號 sysId：雲端已有則原樣保留，缺號才從 1000 補；新建客戶由 nextSysId 分配並持久化進 data.json，原 no 保留為內部序號
function normalizeSysId(){
  const used=new Set((DATA.customers||[]).map(c=>String(c.sysId||"")));
  let n=1000;
  (DATA.customers||[]).forEach(c=>{
    if(!c.sysId){while(used.has(String(n)))n++;c.sysId=String(n);used.add(c.sysId);n++;}
  });
}
function nextSysId(){
  let mx=999;
  (DATA.customers||[]).forEach(c=>{const v=parseInt(c.sysId);if(v>=1000&&v<=9999&&v>mx)mx=v;});
  let n=mx+1;while((DATA.customers||[]).some(c=>String(c.sysId)===String(n)))n++;
  return String(n);
}
// 內部序號 no 安全最大值，空資料時從 2 開始，避免 -Infinity
function maxNo(){let m=1;(DATA.customers||[]).forEach(c=>{const v=parseInt(c.no);if(v>m)m=v;});return m+1;}
// 公司名標準化：忽略大小寫、多餘空白與全半角差異，供重名比對
function normName(s){return String(s||"").toLowerCase().replace(/[\s\u3000]+/g," ").replace(/[.,]/g,"").trim();}

  }

      if(!meta.sha){lastErr="讀取雲端檔案失敗 "+(meta.message||"");await new Promise(r=>setTimeout(r,800));continue;}

function dlStatus(c){
  const L=CURRENT_LANG==="en"?{ok:"Valid",exp:"Expired",soon:"Expires within 90 days"}:CURRENT_LANG==="cn"?{ok:"有效",exp:"已过期",soon:"90天内过期"}:{ok:"有效",exp:"已過期",soon:"90天內過期"};
  if(!c.dl_exp)return {lb:c.dl||L.ok,warn:false,expired:false};
  const exp=new Date(c.dl_exp+"T00:00:00");
  const now=new Date();
  const diff=(exp-now)/86400e3;
  if(diff<0)return {lb:L.exp,warn:true,expired:true,exp:c.dl_exp};

}

async function optimisticUpdate(updater,apiCall,rollback){
  const oldData=JSON.parse(JSON.stringify(DATA));
  try{
    updater();
    render();
    await apiCall();
    toast("已保存","ok");
  }catch(e){
    Object.assign(DATA,JSON.parse(JSON.stringify(oldData)));

  }
}

let _sr=null;
function injectMicButtons(){
  document.querySelectorAll('textarea, input[type="text"], input[type="search"], input:not([type])').forEach(el=>{
    if(el.dataset.micBound)return;
    // 登錄頁面的輸入框不加語音按鈕
    if(el.closest('#loginScreen'))return;
    // AI 生成的正式文檔裡面不加語音按鈕，保持 PDF 乾淨
    if(el.closest('.ai-gen'))return;
    el.dataset.micBound="1";
    const wrap=document.createElement("div");
    wrap.style.cssText="position:relative;display:inline-block;width:100%";
    el.parentNode.insertBefore(wrap,el);wrap.appendChild(el);
    el.style.width="100%";el.style.paddingRight="36px";
    const btn=document.createElement("button");
    btn.type="button";
    btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    btn.style.cssText="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;opacity:.5;color:var(--mut)";
    btn.title=CURRENT_LANG==="en"?"Voice input":(CURRENT_LANG==="cn"?"语音输入":"語音輸入");
    btn.onclick=(e)=>{e.preventDefault();toggleMic(el,btn);};
    wrap.appendChild(btn);
  });
}
function toggleMic(el,btn){
  if(_sr&&_sr._active){_sr.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("瀏覽器不支持語音識別，請用 Chrome");return;}
  const sr=new SR();
  sr.continuous=true;sr.interimResults=true;
  sr.lang=PREF.voiceLang||(CURRENT_LANG==="cn"?"zh-CN":(CURRENT_LANG==="en"?"en-US":"zh-HK"));
  const orig=el.value;
  sr.onresult=(e)=>{
    let fin="",inter="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
      else inter+=e.results[i][0].transcript;
    }
    el.value=orig+fin+inter;
    el.dispatchEvent(new Event("input",{bubbles:true}));
  };
  sr.onend=()=>{btn.style.opacity=".5";btn.style.background="";_sr=null;};
  sr.onerror=(e)=>{btn.style.opacity=".5";btn.style.background="";_sr=null;};
  sr._active=true;_sr=sr;
  btn.style.opacity="1";btn.style.background="#ef4444";btn.style.borderRadius="50%";
  sr.start();
}

function applyLangText(){
  if(!_enKeys)_enKeys=Object.keys(ENMAP).sort((a,b)=>b.length-a.length);
  document.querySelectorAll("#view [placeholder]").forEach(e=>{const p=e.placeholder.trim();if(ENMAP[p])e.placeholder=ENMAP[p];});
  // 只替换叶子元素，保留 DOM 结构；叶子内中文短语按字典子串替换
  document.querySelectorAll("#view").forEach(root=>{
    root.querySelectorAll("*").forEach(e=>{
      if(e.children.length>0)return;
      let t=e.textContent;if(!t||!t.trim())return;let out=t;
      _enKeys.forEach(k=>{if(out.includes(k))out=out.split(k).join(ENMAP[k]);});
      if(out!==t)e.textContent=out;
    });
  });
}

function enMap(s){if(!s)return s;if(EN[s.trim()])return EN[s.trim()];let out=s;Object.keys(EN).sort((a,b)=>b.length-a.length).forEach(k=>{if(out.includes(k))out=out.split(k).join(EN[k]);});return out;}
function applyLangText(){if(CURRENT_LANG!=="en")return;[document.getElementById("view"),document.getElementById("modal")].forEach(root=>{if(!root)return;root.querySelectorAll("*").forEach(el=>{if(el.children.length===0){const t=el.textContent;if(t&&t.trim()){const tr=enMap(t);if(tr!==t)el.textContent=tr;}}if(el.placeholder){const p=enMap(el.placeholder);if(p!==el.placeholder)el.placeholder=p;}});});}

function brokerCo(from){
  const m=(from||"").match(/^\s*"?([^"<]+?)"?\s*<([^>]+)>\s*$/);
  if(m)return m[1].trim();
  const em=(from||"").match(/([\w.-]+)@([\w.-]+)/);
  return em?em[2].replace(/\.[a-z]+$/i,""):from;
}

function syncMailNotifs(){
  if(!Array.isArray(DATA.emails))return;
  const seen=new Set(NOTIFS.filter(n=>n._key).map(n=>n._key));
  DATA.emails.forEach(e=>{
    if(!e.unread)return;
    if(!canViewMail(e))return;
    const key="mail:"+(e.sub||"")+"|"+(e.from||"");
    if(seen.has(key))return;
    seen.add(key);
    const cust=mailOwnerClient(e);
    const co=brokerCo(e.from);
    NOTIFS.unshift({who:cust?ownerName(cust.no):"系統",txt:`${cust?cust.name+" ":""}Received email from ${co}: ${e.sub}`,t:e.date||nowBJ(),unread:true,goto:"queue",_key:key});

}

function hoursSince(tm){
  const m=String(tm).match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return 999;
  const now=new Date();const bj=new Date(now.getTime()+8*3600e3);
  const curMin=(bj.getUTCMonth()+1)*372+bj.getUTCDate()*1440+bj.getUTCHours()*60+bj.getUTCMinutes();
  const thatMin=(+m[1])*372+(+m[2])*1440+(+m[3])*60+(+m[4]);
  return (curMin-thatMin)/60;
}

async function runBulkTranslate(target){
  const items=collectNotesNeedingTranslation();
  const key=target==="en"?"tEn":"tCn";
  const need=items.filter(x=>!x.obj[key]);
  if(!need.length){toast(CURRENT_LANG==="en"?"All notes already have translation":"全部已齊全");return;}
  const btn=document.getElementById(target==="en"?"trEnBtn":"trCnBtn");
  if(btn)btn.disabled=true;
  const llm=getNewLLM();
  if(!llm.key){toast("請先在系統管理頁填入新 LLM Key");return;}
  let done=0,fail=0;
  for(let i=0;i<need.length;i++){
    const it=need[i];
    try{
      const r=await fetch(llm.baseURL+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+llm.key},body:JSON.stringify({model:llm.model,messages:[{role:"system",content:target==="en"?"Translate the following Chinese note into professional, business-grade English. Return ONLY the English translation, no quotes, no explanation.":"將下列繁體中文備註翻譯為簡體中文，用詞符合內陸商務用語。只返回翻譯結果，不要解釋。"},{role:"user",content:it.src}],max_tokens:400})});
      const j=await r.json();
      const out=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"").trim();
      if(out){it.obj[key]=out;done++;}else{fail++;}
    }catch(e){fail++;}
    if(btn)btn.textContent=`${done}/${need.length}`;
  }
  await saveDataJson();
  toast(`完成 ${done} 條翻譯${fail?`，失敗 ${fail}`:""}`);
  closeModal();render();
}

async function editPhotoSave(no){
  const img=document.getElementById("editImg");if(!img)return;
  const btn=event.target;btn.disabled=true;btn.textContent="儲存中…";
  try{
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");
    const rot=window._editRot||0;
    const rad=rot*Math.PI/180;
    const w=img.naturalWidth,h=img.naturalHeight;
    if(Math.abs(rot%180)===90){canvas.width=h;canvas.height=w;}else{canvas.width=w;canvas.height=h;}
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.rotate(rad);
    ctx.scale(window._editFlipH?-1:1,window._editFlipV?-1:1);
    ctx.drawImage(img,-w/2,-h/2);
    const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.9));
    const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
    const path="attachments/"+no+"/member-photo-edited.jpg";
    const base64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(",")[1]);fr.readAsDataURL(blob);});
    let body={message:"edit photo for #"+no,content:base64};
    let method="PUT";
    let url="https://api.github.com/repos/uscrm26/bcd/contents/"+path;
    try{const exist=await fetch(url,{headers:{Authorization:"token "+ghtok}}).then(x=>x.json());if(exist&&exist.sha)body.sha=exist.sha;}catch(e){}
    const r=await fetch(url,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){
      PHOTO_OVERRIDE[no]=path;
      localStorage.setItem("bcd_photo_override",JSON.stringify(PHOTO_OVERRIDE));
      toast("照片已儲存");
      closeModal();
      if(typeof render==="function")render();
    }else{
      toast("⚠️ 儲存失敗 HTTP "+r.status);
      btn.disabled=false;btn.textContent="儲存修改";
    }
  }catch(e){console.warn(e);toast("儲存失敗："+e.message);btn.disabled=false;btn.textContent="儲存修改";}
}

R.commission=()=>{

  const prevM=bj.getUTCMonth()===0?12:bj.getUTCMonth();const prevY=bj.getUTCMonth()===0?bj.getUTCFullYear()-1:bj.getUTCFullYear();

let _fileRecChain=Promise.resolve();
function addFileRecord(no,name,path,type){

      const metaR=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/files.json",{headers:{Authorization:"token "+ghtok}});
      const meta=await metaR.json();
      const c=(meta.content||"").replace(/\n/g,"");
      const fj=JSON.parse(decodeURIComponent(escape(atob(c))));
      fj[no]=fj[no]||[];
      if(!fj[no].find(x=>x.path===path))fj[no].unshift({no:no,name:name,path:path,type:type||"image"});
      const b=JSON.stringify(fj);

    }catch(e){}
  });
  return _fileRecChain;

function bufToB64(buf){
  const bytes=new Uint8Array(buf);let bin="";const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
async function compressImgForUpload(file){
  if(!/\.(jpe?g|png|webp)$/i.test(file.name))return file;
  try{
    const bmp=await createImageBitmap(file);
    const maxSide=1600;
    let w=bmp.width,h=bmp.height;
    if(w>maxSide||h>maxSide){const s=Math.min(maxSide/w,maxSide/h);w=Math.round(w*s);h=Math.round(h*s);}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    cv.getContext("2d").drawImage(bmp,0,0,w,h);
    let q=0.82;
    let blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
    while(blob.size>900*1024&&q>0.4){q-=0.12;blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));}
    return new File([blob],file.name.replace(/\.[^.]+$/,".jpg"),{type:"image/jpeg"});
  }catch(e){return file;}
}
function fileSlug(name){
  const n=name.toLowerCase();
  const suf="-"+Math.floor(10000+Math.random()*90000);
  if(/駕照正面|license.*front|front.*license/.test(n))return "driver-license-front"+suf;
  if(/駕照背面|license.*back|back.*license/.test(n))return "driver-license-back"+suf;
  if(/人像|人頭|member.*photo|headshot/.test(n))return "member-photo"+suf;
  if(/ein/.test(n))return "ein-letter"+suf;
  if(/章程|articles.*organization/.test(n))return "articles-of-organization"+suf;
  if(/申請|通知書|filing|confirmation/.test(n))return "filing-confirmation"+suf;
  if(/w-?9/.test(n))return "w9-form"+suf;
  if(/護照|passport/.test(n))return "passport"+suf;
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/.test(n))return "screenshot-"+n.slice(0,8)+suf;
  return "doc-"+Date.now().toString(36).slice(-4)+suf;
}
function displayFileName(fname){
  if(!fname)return "";
  const i=fname.indexOf("——");
  if(i>=0)return fname.slice(i+2);
  const j=fname.indexOf("-");
  if(j>0 && fname.length<60)return fname.slice(j+1).trim();
  return fname;
}
async function ghFetch(url,opts,timeoutMs){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),timeoutMs||60000);
  try{return await fetch(url,{...opts,signal:ctrl.signal});}
  finally{clearTimeout(t);}
}
async function uploadToGithub(no,f){
  const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
  if(!ghtok){window._lastUpErr="無存取權杖";return false;}
  try{
    const sf=await compressImgForUpload(f);
    const buf=await sf.arrayBuffer();
    const base64=bufToB64(buf);
    const ext=(sf.name.match(/\.([^.]+)$/)||["","bin"])[1].toLowerCase().slice(0,5);
    const safeName=fileSlug(sf.name)+"."+ext;
    const path="attachments/"+no+"/"+safeName;
    window._uploadedPaths=window._uploadedPaths||[];
    let r;
    try{
      r=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"upload "+sf.name,content:base64})},60000);
    }catch(netErr){
      window._lastUpErr="網路逾時或中斷："+(netErr.name==="AbortError"?"30秒逾時":netErr.message);
      return false;
    }
    if(r.status===409||r.status===422){
      try{
        const exist=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{headers:{Authorization:"token "+ghtok}},30000).then(x=>x.json());
        if(exist&&exist.sha){
          r=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"update "+sf.name,content:base64,sha:exist.sha})},60000);
        }
      }catch(e){}
      // 拉不到舊檔或覆蓋仍失敗：等待2秒後不帶sha重傳一次，繞過偶發git索引衝突
      if(!r.ok){
        await new Promise(rs=>setTimeout(rs,2000));
        try{
          r=await ghFetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"upload-retry "+sf.name,content:base64})},60000);
        }catch(netErr){}
      }
    }
    if(r.ok){
      const ftype=/\.pdf$/i.test(sf.name)?"pdf":/\.(jpe?g|png|gif|webp)$/i.test(sf.name)?"image":"text";
      DATA.files[no]=DATA.files[no]||[];
      if(!DATA.files[no].find(x=>x.path===encodeURIComponent(path)))DATA.files[no].unshift({no:no,name:sf.name,path:encodeURIComponent(path),type:ftype});
      addFileRecord(no,sf.name,encodeURIComponent(path),ftype).catch(()=>{});
      if(typeof loadStorageList==="function")setTimeout(()=>loadStorageList(no),300);
      window._uploadedPaths.push(path);
      return true;
    }
    let errBody="";
    try{errBody=await r.text();const ej=JSON.parse(errBody);if(ej.message)errBody=ej.message;}catch(e){}
    window._lastUpErr="HTTP "+r.status+" "+(errBody||"").slice(0,120);
    console.warn("uploadToGithub",r.status,errBody);
    return false;
  }catch(e){
    window._lastUpErr="程式例外："+String(e).slice(0,100);
    console.warn("uploadToGithub exc",e);
    return false;
  }
}
async function cleanupUploadedPaths(){
  const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
  if(!window._uploadedPaths||!ghtok)return;
  for(const path of window._uploadedPaths){
    try{
      const meta=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{headers:{Authorization:"token "+ghtok}}).then(r=>r.json());
      if(meta&&meta.sha){
        await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{method:"DELETE",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"cleanup on failed customer create",sha:meta.sha})});
      }
    }catch(e){}
  }
  window._uploadedPaths=[];
}
function uploadFileToQiniu(no,f){
  return new Promise(resolve=>{
    if(f.size>MAX_MB*1024*1024){resolve(false);return;}
    loadQiniuToken().then(token=>{
      if(!token){resolve(false);return;}
      const safeName=(f.name||"file").replace(/[\\/:*?"<>|\s]/g,"_");
      const key="docs/"+no+"/"+Date.now()+"_"+safeName;
      const fd=new FormData();fd.append("token",token);fd.append("key",key);fd.append("file",f);
      fetch("https://upload-z2.qiniup.com/",{method:"POST",body:fd}).then(r=>r.json()).then(j=>{
        if(j.key===key){
          addAudit("上傳文件",f.name);
          const meta=JSON.stringify({no:no,name:f.name,key:key});
          fetch("https://api.github.com/repos/uscrm26/bcd/issues",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:"SIGN:"+key,body:meta})}).catch(()=>{});
          resolve(true);
        }else resolve(false);
      }).catch(()=>resolve(false));
    }).catch(()=>resolve(false));
  });
}

// AI 文件交叉審查：以駕照/護照姓名為基準，檢查拼寫、過期、缺漏，總結存後台，問題進待辦與時間線
async function runDocumentReview(no,files,cust,onProgress){
  const imgs=(files||[]).filter(f=>/\.(jpe?g|png|webp)$/i.test(f.name));
  const pdfs=(files||[]).filter(f=>/\.pdf$/i.test(f.name));
  if(!imgs.length&&!pdfs.length)return;
  const c=DATA.customers.find(x=>String(x.no)===String(no));if(!c)return;
  const say=(m,k)=>{aiLog(m,k);if(typeof onProgress==="function")onProgress(m,k);};
  aiLogStart("AI 正在交叉審查全部文件");
  try{
    const issues=[];const summaryParts=[];
    let baseName="";const docFacts=[];
    // 圖片走視覺模型：以駕照/護照姓名為基準交叉比對
    if(imgs.length){
      say("讀取 "+imgs.length+" 張證件照片，準備以駕照護照姓名為基準");
      const parts=[];
      for(const f of imgs){try{say("轉換照片 "+f.name);parts.push({type:"image_url",image_url:{url:await fileToDataURL(f)}});}catch(e){}}
      if(parts.length){
        const sys="你是美國海關 continuous bond 開戶文件審查員。仔細閱讀每張證件照片（駕照、護照、公司文件）。以駕照或護照上的法人法定姓名為基準，交叉比對其他文件的姓名拼寫是否一致、證件是否已過期、是否缺漏必備文件。只輸出 JSON，不要多餘說明：{\"owner_name\":\"以證件為準的法人姓名\",\"docs\":[{\"file\":\"檔名\",\"type\":\"文件類型\",\"name\":\"姓名\",\"company\":\"公司名\",\"ein\":\"EIN\",\"expiry\":\"有效期或空\"}],\"issues\":[{\"level\":\"error|warn\",\"doc\":\"哪份文件\",\"problem\":\"問題描述\",\"fix\":\"建議處理\"}],\"summary\":\"一段繁體中文審查總結，供後台留存，不直接給客戶看\"}。";
        parts.unshift({type:"text",text:"檔案清單："+imgs.map(f=>f.name).join("、")+"。請逐張辨識並交叉比對，輸出指定 JSON。"});
        say("視覺模型正在比對照片間的姓名拼寫、有效期與缺漏");
        try{
          const out=await callAIVision(sys,parts);
          let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={summary:out.slice(0,300),issues:[]};}
          if(j.owner_name){baseName=j.owner_name;say("法定姓名基準："+j.owner_name,"ok");}
          if(Array.isArray(j.docs))j.docs.forEach(d=>docFacts.push(d));
          if(j.summary)summaryParts.push("照片："+j.summary);
          (Array.isArray(j.issues)?j.issues:[]).forEach(it=>issues.push(it));
        }catch(e){console.warn("視覺審查失敗",e);say("照片比對失敗，已略過","warn");}
      }
    }
    // PDF：每份獨立識別內容（文字型全文分段／掃描型逐頁視覺），產生識別卡存後台
    c.fileInsights=c.fileInsights||[];
    for(const f of pdfs){
      let pa=(window._pdfInsightMap||{})[f.name];
      if(pa){say("複用已完成的 "+f.name+" 識別結果");}
      if(!pa){try{pa=await analyzePdfDoc(f,say);}catch(e){console.warn("PDF分析失敗",f.name,e);say(f.name+" 分析失敗，已略過","warn");continue;}}
      const card={file:f.name,via:pa.via,pages:pa.pages,type:pa.doc_type||"未分類",summary:pa.summary||"",key_facts:pa.key_facts||"",company:pa.company||"",member:pa.member||"",ein:pa.ein||""};
      c.fileInsights=c.fileInsights.filter(x=>x.file!==f.name);
      c.fileInsights.unshift(card);
      docFacts.push({file:f.name,type:card.type,name:card.member,company:card.company,ein:card.ein,expiry:""});
      if(pa.summary)summaryParts.push(`PDF ${f.name}（${card.type}）：${pa.summary}${pa.key_facts?"｜關鍵："+pa.key_facts:""}`);
      (Array.isArray(pa.issues)?pa.issues:[]).forEach(it=>issues.push(it));
    }
    // 整體交叉比對：以駕照/護照法人姓名為基準，檢查各文件姓名拼寫、EIN、公司是否一致
    if(docFacts.length&&(baseName||c.member)){
      const basis=baseName||c.member;
      say("以法人「"+basis+"」為基準，比對全部文件的姓名、公司、EIN 是否一致");
      try{
        const factText=docFacts.map(d=>`${d.file}｜類型:${d.type||""}｜姓名:${d.name||""}｜公司:${d.company||""}｜EIN:${d.ein||""}`).join("\n");
        const xout=await callAI("你是文件一致性審查員。基準法人姓名："+basis+"。比對下列每份文件的姓名拼寫、公司名、EIN 是否與基準一致，是否有拼寫落差或矛盾。只輸出JSON {\"issues\":[{\"level\":\"error|warn\",\"doc\":\"檔名\",\"problem\":\"問題\",\"fix\":\"建議\"}]}，一致則issues為空，不要編造。","基準法人："+basis+"\n文件清單：\n"+factText);
        let xj={};try{xj=JSON.parse(xout.replace(/```json|```/g,"").trim());}catch(e){}
        (Array.isArray(xj.issues)?xj.issues:[]).forEach(it=>{if(!issues.some(x=>x.doc===it.doc&&x.problem===it.problem))issues.push(it);});
      }catch(e){console.warn("整體交叉比對失敗",e);say("整體比對失敗，已保留各文件獨立結果","warn");}
    }
    c.reviewReport=summaryParts.join("\n");
    // 問題寫入 AI 待辦
    c.aiTodos=c.aiTodos||[];
    c.aiTodos.forEach(x=>{if(!x.done)x.superseded=true;});
    issues.forEach(it=>{const t=`[文件審查] ${it.doc||""}：${it.problem||""}${it.fix?"（建議："+it.fix+"）":""}`;if(!c.aiTodos.some(x=>x.t===t))c.aiTodos.unshift({t,done:false,ts:Date.now()});});
    // 時間線審查記錄
    DATA.timeline[no]=DATA.timeline[no]||[];
    const n=issues.length;
    const reviewItem={t:nowBJ(),who:"AI 文件交叉審查",txt:n?`⚠️ 發現 ${n} 項文件問題，詳見待辦`:"✅ 文件交叉審查通過，未發現姓名、過期或缺漏問題",detail:issues.map(it=>`· [${it.level==="error"?"嚴重":"提醒"}] ${it.doc||""}：${it.problem||""}${it.fix?"；建議 "+it.fix:""}`).join("\n")||"所有文件姓名一致、均在有效期內、無缺漏。",key:"review_"+Date.now()};
    DATA.timeline[no].unshift(reviewItem);
    persistCust(no);
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"timeline",target_client:String(no),detail:JSON.stringify(reviewItem)});
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(no),detail:JSON.stringify({aiTodos:c.aiTodos,reviewReport:c.reviewReport,fileInsights:c.fileInsights,aiLastAt:c.aiLastAt})});
    syncCustomerToRepo(no);
    render();
    aiLogDone(n?`交叉審查完成，發現 ${n} 項問題`:"交叉審查完成，全部一致");
    say(n?`完成：發現 ${n} 項問題，已寫入待辦`:"完成：姓名、有效期、缺漏均無問題",n?"warn":"ok");
  }catch(e){console.warn("文件審查失敗",e);aiLog("文件審查中斷："+e.message,"err");}
}

async function togglePin(no){
  const me=CURRENT_USER.id;
  if(!PINNED[me])PINNED[me]=[];
  const i=PINNED[me].indexOf(no);
  if(i>=0)PINNED[me].splice(i,1);else PINNED[me].unshift(no);
  try{
    const tok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
    const meta=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/pinned.json",{headers:{Authorization:"token "+tok}});
    let sha="";
    if(meta.ok){const m=await meta.json();sha=m.sha;}
    const body={message:"更新置頂",content:btoa(unescape(encodeURIComponent(JSON.stringify(PINNED)))),...(sha?{sha}:{})};
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/pinned.json",{method:"PUT",headers:{Authorization:"token "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
  }catch(e){console.warn("pin save fail",e);}
  refreshCustList();
}

function custGridHTML(){

  if(pinned.length){
    html+=`<div style="font-size:14px;font-weight:700;color:#d4a017;margin:16px 0 8px">${CURRENT_LANG==="en"?"Pinned":CURRENT_LANG==="cn"?"置顶":"置頂"}</div>`;

  }
  // Group rest by month
  const groups={};
  rest.forEach(c=>{const mk=c.created||"2026-11";const ym=mk.slice(0,7);if(!groups[ym])groups[ym]=[];groups[ym].push(c);});
  Object.keys(groups).sort().reverse().forEach(ym=>{
    html+=`<div style="font-size:14px;font-weight:700;color:var(--mut);margin:16px 0 8px">${monthLabel(ym+"-01")}</div>`;

  });

}

function aiStatusCard(ts){

  const diff=Date.now()-ts;
  const mins=Math.floor(diff/60000);
  let ago;
  if(mins<1)ago="剛才";else if(mins<60)ago=mins+" 分鐘前";else if(mins<1440)ago=Math.floor(mins/60)+" 小時前";else ago=Math.floor(mins/1440)+" 天前";

async function aiRefillCustomer(no){
  const c=DATA.customers.find(x=>String(x.no)===String(no));if(!c)return;
  // 右下角小窗
  let win=document.getElementById("refillWin");if(win)win.remove();
  win=document.createElement("div");win.id="refillWin";
  win.style.cssText="position:fixed;bottom:"+floatNext()+"px;right:20px;width:480px;max-height:500px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:9999;overflow:hidden";
  win.innerHTML=`<div style="padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700;color:#8b5cf6">AI 重填資料</span><button onclick="this.closest('#refillWin').remove()" style="background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer">×</button></div><div id="refillLog" style="padding:14px 16px;font-size:12px;line-height:1.8;max-height:380px;overflow-y:auto"></div>`;
  document.body.appendChild(win);
  const log=document.getElementById("refillLog");
  const say=(t,cl)=>{const d=document.createElement("div");d.style.cssText="margin-bottom:4px;color:"+(cl||"var(--text)");d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;};

  try{
    const allFiles=((DATA.files||{})[no]||[]);
    const pdfFiles=allFiles.filter(f=>f.type==="pdf");
    const txtFiles=allFiles.filter(f=>f.type==="text"||f.name.endsWith(".txt"));
    say("找到 "+pdfFiles.length+" 份 PDF，"+txtFiles.length+" 份文本文件");
    const allText=[];
    for(let i=0;i<pdfFiles.length;i++){
      const f=pdfFiles[i];
      const url=resolveFile(f.path);
      say("讀取 "+f.name+" ...");
      try{
        const resp=await fetch(url);
        const blob=await resp.blob();
        const fileObj=new File([blob],f.name,{type:"application/pdf"});
        const ext=await extractPdfFull(fileObj,(s)=>{if(i<3)say("  "+s);});
        if(ext.text&&ext.text.length>50){
          allText.push("=== "+f.name+" ===\n"+ext.text.slice(0,4000));
          say("  成功提取 "+ext.text.length+" 字");
        }else{
          say("  文字太少，略過");
        }
      }catch(e){say("  讀取失敗："+e.message);}
    }
    for(const f of txtFiles){
      try{
        const resp=await fetch(resolveFile(f.path));
        const t=await resp.text();
        if(t&&t.length>10){
          allText.push("=== "+f.name+" ===\n"+t.slice(0,4000));
          say("讀取 "+f.name+" ... 成功");
        }
      }catch(e){say("  "+f.name+" 讀取失敗");}
    }
    if(!allText.length){say("沒有可用文字，結束。");return;}
    say("正在交 AI 分析所有文件...");
    const ctx=`客戶：${c.name}，法人：${c.member}，EIN：${c.ein}
當前資料：電話=${c.phone||"(空)"}，地址=${c.address||"(空)"}，備註=${c.notes||"(空)"}

以下是客戶所有文件的內容，請從中提取以下欄位：

function applyRefillResult(no){

  "2":"Immunora-Bio","3":"Oliveware","5":"Pebblehome","7":"Sageware","8":"Nervaqon",
  "61":"Huntington","64":"JELD-WEN","66":"Kervalonix","69":"L3Harris","71":"Laureate",
  "73":"Leidos","75":"Lennar","89":"Home Depot","90":"Honeywell","93":"Interface","98":"Kontoor"
};
function resolveFile(p,no){
  if(!p)return "#";
  try{var dec=decodeURIComponent(p);}catch(e){var dec=p;}
  if(IMGMAP[dec])return FILEBASE+IMGMAP[dec];
  if(dec.startsWith("attachments/"))return "https://xlcyumbyqcwedqwpspzs.supabase.co/storage/v1/object/public/"+encodeURI(dec);
  if(QMAP[dec])return QMAP[dec].replace(/^http:\/\//i,"https://");
  // GitHub Pages: files in docs/clients/{folder}/
  if(no&&CLIENT_FOLDERS[String(no)])return FILEBASE+"clients/"+CLIENT_FOLDERS[String(no)]+"/"+encodeURIComponent(dec);
  // 副檔名不一致：本來記 .png 實際是 .jpg，本地 img/ 優先，避免被七牛 HTTP 混合內容擋掉
  var jpg=dec.replace(/\.(png|jpeg)$/i,".jpg");
  if(IMGMAP[jpg])return FILEBASE+IMGMAP[jpg];
  if(QMAP[jpg])return QMAP[jpg].replace(/^http:\/\//i,"https://");
  // 副檔名缺失（檔名結尾是句號）：補常見副檔名再查本地映射
  if(/\.$/.test(dec)){
    var base=dec.replace(/\.$/,".");
    for(var i=0;i<3;i++){
      var ext=[".jpg",".png",".jpeg"][i];
      if(IMGMAP[base+ext])return FILEBASE+IMGMAP[base+ext];
      if(QMAP[base+ext])return QMAP[base+ext].replace(/^http:\/\//i,"https://");
    }
  }
  return FILEBASE+p;
}

async function enhancedUploadAnalyze(no,c,files){
  aiLogStart("AI 正在分析補充上傳的 "+files.length+" 個檔案");
  const results=[];
  let okCount=0,failCount=0;
  for(const f of files){
    aiLog("〔"+f.name+"〕開始同步到加密雲端");
    const upOK=await uploadToGithub(no,f);
    if(!upOK){aiLog("〔"+f.name+"〕同步失敗 "+(window._lastUpErr||""),"err");failCount++;continue;}
    aiLog("〔"+f.name+"〕已同步","ok");okCount++;
    // AI 分析
    const isImg=/\.(jpe?g|png|gif|webp)$/i.test(f.name);
    let j={doc_type:"",notes:""};
    try{
      if(/\.pdf$/i.test(f.name)){
        const pa=await analyzePdfDoc(f,(m,k)=>aiLog("〔"+f.name+"〕"+m,k));
        j={company:pa.company,member:pa.member,ein:pa.ein,address:pa.address,phone:pa.phone,doc_type:pa.doc_type,notes:pa.summary};
      }else if(isImg){
        aiLog("〔"+f.name+"〕讀取證件照片");
        const dv=await fileToDataURL(f,1200);
        const out=await callAIVision("你是美國海關bond業務證件辨識員，只輸出指定JSON。",[{type:"text",text:"檔名："+f.name+"。輸出JSON：{company,member,ein,address,phone,doc_type,notes}"},{type:"image_url",image_url:{url:dv}}]);
        if(out==="ERROR_OVERDUE"){aiLog("〔"+f.name+"〕方舟欠費","err");j={doc_type:"",notes:"方舟欠費未分析"};}
        else if(out){try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={notes:out.slice(0,200)};}}
        if(!j.doc_type){
          const out2=await callAI("根據檔名判斷文件類型，輸出JSON{doc_type,notes}："+f.name);
          try{j=Object.assign(j,JSON.parse(out2.replace(/```json|```/g,"").trim()));}catch(e){}
        }
      }else{
        const out=await callAI("根據檔名判斷文件類型，輸出JSON{doc_type,notes}："+f.name);
        try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){}
      }
    }catch(e){aiLog("〔"+f.name+"〕分析失敗："+e.message,"warn");}
    results.push({file:f.name,data:j});
    aiLog("〔"+f.name+"〕"+(j.doc_type||"已辨識")+(j.member?"｜法人:"+j.member:""),"ok");
  }
  // === 衝突性分析 ===
  aiLog("正在比對新文件與客戶既有資料…");
  const conflicts=[];
  for(const r of results){
    const d=r.data;
    if(d.ein){const einA=String(d.ein).replace(/\D/g,"");if(einA&&c.ein&&einA!==String(c.ein).replace(/\D/g,""))conflicts.push({doc:r.file,problem:"EIN不一致：新文件"+d.ein+" vs 系統"+c.ein});}
    if(d.member&&c.member){const nmA=d.member.toUpperCase().replace(/\s+/g,"");const nmB=c.member.toUpperCase().replace(/\s+/g,"");if(nmA&&nmB&&nmA!==nmB)conflicts.push({doc:r.file,problem:"姓名不一致：新文件"+d.member+" vs 系統"+c.member});}
    if(d.company&&c.name){const cA=d.company.toUpperCase().replace(/[^A-Z0-9]/g,"");const cB=c.name.toUpperCase().replace(/[^A-Z0-9]/g,"");if(cA&&cB&&!cB.includes(cA)&&!cA.includes(cB))conflicts.push({doc:r.file,problem:"公司名不一致：新文件"+d.company+" vs 系統"+c.name});}
  }
  // === 身份驗證：新文件裡的人是不是同一個 ===
  const newNames=results.map(r=>r.data.member).filter(Boolean);
  const identityMismatch=newNames.some(n=>{
    const na=n.toUpperCase().replace(/[^A-Z]/g,"");const nb=(c.member||"").toUpperCase().replace(/[^A-Z]/g,"");
    return na&&nb&&na!==nb&&!na.includes(nb)&&!nb.includes(na);
  });
  if(identityMismatch){
    const names=newNames.join("、");
    const proceed=await new Promise(res=>{
      openModal(`<div style="text-align:center;padding:16px">
        <div style="font-size:18px;font-weight:700;color:#ef4444;margin-bottom:10px">⚠️ 身份可能不符</div>
        <div style="font-size:13px;color:var(--mut);line-height:1.8;margin-bottom:16px">
          新上傳文件中的姓名為「<b style="color:var(--tx)">${esc(names)}</b>」<br>
          系統中登記的法人為「<b style="color:var(--tx)">${esc(c.member||"—")}</b>」<br><br>
          這可能不是同一個人，確定要繼續加入這些文件嗎？
        </div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn" onclick="closeModal();res(false)">取消上傳</button>
          <button class="btn" style="background:#dc2626;color:#fff" onclick="closeModal();res(true)">仍要加入</button>
        </div>
      </div>`);
      window.res=res;
    });
    if(!proceed){aiLogDone("已取消身份不符的上傳");toast("已取消");return;}
  }
  // === 更新場景偵測：同類型舊文件標註為已作廢 ===
  const docTypeMap={};
  for(const r of results){
    const t=r.data.doc_type||"";
    if(/駕照|driver|license|DL/i.test(t))docTypeMap["dl"]=r.file;
    else if(/EIN|稅號/i.test(t))docTypeMap["ein"]=r.file;
    else if(/地址|街景|verify/i.test(t))docTypeMap["addr"]=r.file;
  }
  c.fileInsights=c.fileInsights||[];
  const superseded=[];
  for(const [cat,newFile] of Object.entries(docTypeMap)){
    const catRe=/駕照|driver|license|DL/i.test(cat)?"/駕照|driver|license/i":cat==="ein"?"/EIN|稅號/i":"/地址|街景/i";
    const oldOnes=c.fileInsights.filter(x=>!x.superseded&&new RegExp(catRe).test(x.type||"")&&x.file!==newFile);
    for(const old of oldOnes){old.superseded=true;old.notes=(old.notes||"")+" 【已被"+newFile+"取代】";superseded.push(old.file);}
    // 標註新文件為最新
    const ni=c.fileInsights.find(x=>x.file===newFile);if(ni)ni.current=true;
  }
  // === 自動偵測人像並設為法人照片 ===
  for(const r of results){
    if(/人像|人頭|headshot|selfie|portrait|法人照片/i.test(r.data.doc_type||"")||/人像|人頭|法人照片/i.test(r.file)){
      const f=(DATA.files[no]||[]).find(x=>(x.name||"")===r.file);
      if(f){c.memberPhoto=resolveFile(f.path||"");aiLog("已自動設定為法人照片："+r.file,"ok");break;}
    }
  }
  // === 寫入 fileInsights ===
  for(const r of results){
    const card={file:r.file,via:"vision",type:r.data.doc_type||"未分類",summary:r.data.notes||"",company:r.data.company||c.name,member:r.data.member||c.member,ein:r.data.ein||c.ein,uploadedAt:Date.now()};
    c.fileInsights=c.fileInsights.filter(x=>x.file!==r.file);
    c.fileInsights.unshift(card);
  }
  // === 自動完成相關待辦 ===
  c.aiTodos=c.aiTodos||[];
  const closedTodos=[];
  for(const r of results){
    const t=r.data.doc_type||"";
    if(/駕照|driver|license/i.test(t)){
      c.aiTodos=c.aiTodos.filter(x=>{if(!x.done&&/駕照|license|DL/i.test(x.t)){closedTodos.push(x.t);x.done=true;x.doneAt=Date.now();return true;}return true;});
    }
    if(/EIN|稅號/i.test(t)){
      c.aiTodos=c.aiTodos.filter(x=>{if(!x.done&&/EIN|稅號/i.test(x.t)){closedTodos.push(x.t);x.done=true;x.doneAt=Date.now();return true;}return true;});
    }
  }
  // === 寫入時間線 ===
  DATA.timeline[no]=DATA.timeline[no]||[];
  const tlItem={t:nowBJ(),who:"補充上傳",txt:"上傳 "+results.length+" 份文件："+results.map(r=>r.file).join("、"),detail:"",key:"upload_"+Date.now()};
  let detailLines=results.map(r=>"· "+r.file+"（"+(r.data.doc_type||"未分類")+(r.data.member?"｜法人:"+r.data.member:"")+"）");
  if(superseded.length)detailLines.push("📦 已作廢舊版："+superseded.join("、"));
  if(closedTodos.length)detailLines.push("✅ 自動完成待辦："+closedTodos.join("；"));
  if(conflicts.length)detailLines.push("⚠️ 衝突提醒："+conflicts.map(x=>x.problem).join("；"));
  tlItem.detail=detailLines.join("\n");
  DATA.timeline[no].unshift(tlItem);
  addAudit("補充上傳",c.name+"｜"+results.length+"份");
  persistCust(no);
  syncCustomerToRepo(no);
  // === 完成總結 ===
  const okMsg=results.length+" 份文件已完成分析並加入客戶檔案";
  aiLogDone(okMsg);
  openModal(`<div style="text-align:center;padding:16px">
    <div style="font-size:18px;font-weight:700;color:#10b981;margin-bottom:10px">✅ 補充上傳完成</div>
    <div style="font-size:13px;color:var(--mut);line-height:1.8;text-align:left;margin-bottom:14px">
      <div>📄 上傳成功：<b style="color:var(--tx)">${okCount}</b> 份</div>
      ${failCount?`<div>❌ 失敗：<b style="color:#ef4444">${failCount}</b> 份</div>`:""}
      ${superseded.length?`<div>📦 舊版已標註作廢：<b style="color:var(--tx)">${superseded.join("、")}</b></div>`:""}
      ${closedTodos.length?`<div>✅ 自動完成待辦：<b style="color:#10b981">${closedTodos.length}</b> 項</div>`:""}
      ${conflicts.length?`<div style="color:#f0a040">⚠️ 衝突提醒：${conflicts.length} 項，詳見待辦</div>`:"<div style='color:#10b981'>✓ 與既有資料無衝突</div>"}
