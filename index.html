}
let QT="";let QT_EXP=0;
function loadQiniuToken(){if(QT&&Date.now()<QT_EXP)return Promise.resolve(QT);return fetch("upload_token.json?v="+Date.now()).then(r=>r.json()).then(j=>{QT=j.token||"";QT_EXP=(j.expires||0)*1000;return QT;}).catch(()=>{QT="";return QT;});}
function uploadToStorage(no,f){
 if(f.size>MAX_MB*1024*1024){toast(f.name+" 超過 "+MAX_MB+"MB");return;}
 toast("上傳中："+f.name);
 loadQiniuToken().then(token=>{
  if(!token){toast("上傳服務未就緒，稍後再試");return;}
  const safeName=(f.name||"file").replace(/[\\/:*?"<>|\s]/g,"_");
  const key="docs/"+no+"/"+Date.now()+"_"+safeName;
  const fd=new FormData();fd.append("token",token);fd.append("key",key);fd.append("file",f);
  fetch("https://upload-z2.qiniup.com/",{method:"POST",body:fd}).then(r=>r.json()).then(async j=>{
    if(j.key===key){
      addAudit("上傳文件",f.name);
      const meta=JSON.stringify({no:no,name:f.name,key:key});
      fetch("https://api.github.com/repos/uscrm26/bcd/issues",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:"SIGN:"+key,body:meta})}).catch(()=>{});
      const ok=await waitForSign(key,45);
      if(ok)toast("已上傳："+f.name);else toast("已上傳，簽名同步中");
      setTimeout(()=>loadStorageList(no),500);
    }else{toast("上傳失敗："+((j.error||j.message||"").toString().slice(0,100)||"未知錯誤"));}
  }).catch(()=>toast("上傳失敗：網路或 CORS 被擋"));
 });

function waitForSign(key,sec){return new Promise(res=>{const t0=Date.now();const iv=setInterval(async()=>{try{const r=await fetch("qiniu_map.json?v="+Date.now());const m=await r.json();if(m[key]||m[decodeURIComponent(key)]){clearInterval(iv);res(true);return;}}catch(e){}if(Date.now()-t0>sec*1000){clearInterval(iv);res(false);}},2000);});}

  document.body.appendChild(win);

  const spinner='<span class="spin"></span>';
  const say=(html,cl,id)=>{let d=id?document.getElementById(id):null;if(!d){d=document.createElement("div");d.style.cssText="margin-bottom:6px;color:"+(cl||"var(--text)");if(id)d.id=id;log.appendChild(d);}d.innerHTML=html;log.scrollTop=log.scrollHeight;return d;};
  say(t.starting);
  const beforeEmails=(DATA.emails||[]).length;
  const beforeFiles=Object.values(DATA.files||{}).reduce((a,f)=>a+f.length,0);
  try{

    if(!r.ok)throw new Error("HTTP "+r.status);
    say(spinner+t.triggered,"var(--mut)","mb_status");
    let runId=null;
    for(let i=0;i<15;i++){
      await new Promise(r=>setTimeout(r,3000));
      try{
        const rr=await fetch("https://api.github.com/repos/uscrm26/bcd/actions/workflows/hourly-patrol.yml/runs?per_page=3",{headers:{Authorization:"token "+tok}});
        const j=await rr.json();
        if(j.workflow_runs&&j.workflow_runs.length){
          runId=j.workflow_runs[0].id;
          const st=j.workflow_runs[0].status;
          if(st==="queued")say(spinner+t.queued,"var(--mut)","mb_status");
          else if(st==="in_progress"){say(spinner+t.running,"var(--mut)","mb_status");break;}
        }
      }catch(e){}
    }
    if(!runId){say(t.noRun,"#ef4444","mb_status");return;}
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{
        const rr=await fetch("https://api.github.com/repos/uscrm26/bcd/actions/runs/"+runId,{headers:{Authorization:"token "+tok}});
        const j=await rr.json();
        if(j.status==="completed"){
          if(j.conclusion==="success"){say(t.done,"#22c55e","mb_status");}
          else{say(t.failed+"："+(j.conclusion||""),"#ef4444","mb_status");}
          try{
            const dr=await fetch("https://raw.githubusercontent.com/uscrm26/bcd/main/dbboard/data.json?cb="+Date.now(),{cache:"no-store"});
            const newData=await dr.json();
            const afterEmails=(newData.emails||[]).length;
            const afterFiles=Object.values(newData.files||{}).reduce((a,f)=>a+f.length,0);
            const newEmails=Math.max(0,afterEmails-beforeEmails);
            const newFiles=Math.max(0,afterFiles-beforeFiles);
            if(newEmails>0)say(t.newMail(newEmails));else say(t.upToDate,"var(--mut)");
            if(newFiles>0)say(t.newFile(newFiles));
            if(j.conclusion==="success"){say(t.finish,"#22c55e");}
            else{say(langT("巡查已結束，可能無新郵件或郵箱連線異常。","巡查已结束，可能无新邮件或邮箱连线异常。","Patrol finished; may be no new mail or mailbox connection issue."),"#ffb454");}
            (async()=>{try{await loadRepoData();render();}catch(e2){say(t.reloadErr,"#ef4444");}})();
          }catch(e){say(t.reloadErr,"#ef4444");}
          return;
        }else{
          say(spinner+t.running,"var(--mut)","mb_status");
        }
      }catch(e){}
    }
    say(t.timeout,"var(--mut)","mb_status");
  }catch(e){
    say(t.triggerErr+"："+e.message,"#ef4444","mb_status");
  }
}

// 圖片先壓縮成 dataURL，避免超出免費模型的大小限制
function fileToDataURL(f,maxSide=1600){
  return new Promise(resolve=>{
    if(!/\.(jpe?g|png|webp)$/i.test(f.name)){const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f);return;}
    const img=new Image();const url=URL.createObjectURL(f);
    img.onload=()=>{
      let{width:w,height:h}=img;const sc=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);resolve(cv.toDataURL("image/jpeg",0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f);};
    img.src=url;
  });
}

// 抽取 PDF 全部頁面文字，偵測是否為掃描型，回傳 {text,pages,scanned}
async function extractPdfFull(file,onProgress){
  const say=typeof onProgress==="function"?onProgress:()=>{};
  say("正在開啟檔案，讀取頁面結構");
  const pdf=await loadPdfDoc(file);
  if(!pdf)return {text:"",pages:0,scanned:false};
  let text="";const per=[];
  const n=pdf.numPages;
  say("檔案共 "+n+" 頁，開始逐頁讀取文字");
  for(let i=1;i<=n;i++){
    const p=await pdf.getPage(i);
    const tc=await p.getTextContent();
    const pt=tc.items.map(it=>it.str).join(" ").trim();
    per.push(pt);text+=pt+"\n";
    if(n>1)say("已讀取第 "+i+"/"+n+" 頁");
  }
  const empty=per.filter(t=>t.replace(/\s/g,"").length<15).length;
  const scanned=n>0&&empty>=Math.ceil(n/2);
  say(scanned?("偵測到 "+empty+" 頁選不到文字，判定為掃描件，改用視覺逐頁辨識"):("偵測為可選取文字文件，進入內容提煉"));
  return {text:text.replace(/\s+/g," ").trim(),pages:n,scanned,pdf};
}
// 掃描型 PDF 單頁渲染成圖片，交視覺模型讀取
async function pdfPageImage(pdf,pageIdx,scale=1.3){
  const p=await pdf.getPage(pageIdx);
  const vp=p.getViewport({scale});
  const cv=document.createElement("canvas");
  cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
  await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
  return cv.toDataURL("image/jpeg",0.85);
}

      lines.push("- ["+x.t+"] "+(x.from||"").split("<")[0].trim()+" 來信｜主旨："+(x.sub||"")+(x.auto_interp?("｜已有解讀："+x.auto_interp.slice(0,120)):""));
    });
  }
  // 3. 歷史外發：sent_log 中 to 是本次發件人域名，或 from 是本客戶信箱
  const custMail=cust?cust.mail:"";
  const brokerDomain=((e.from||"").split("@")[1]||"").toLowerCase();
  const sent=(DATA.sent||[]).filter(s=>{
    const toDom=((s.to||"").split("@")[1]||"").toLowerCase();
    return (brokerDomain&&toDom===brokerDomain)||(custMail&&(s.from||"").toLowerCase()===custMail.toLowerCase());
  });
  if(sent.length){
    lines.push("");
    lines.push("【我方過去寄出的相關郵件】");
    sent.slice(-12).forEach(s=>{
      lines.push("- [我方寄出] to: "+(s.to||"")+"｜主旨："+(s.subject||"")+"｜摘："+(s.body||"").slice(0,150).replace(/\s+/g," "));
    });
  }
  return lines.join("\n");
}
function fmtUSfromBJ(t){
  const m=t.match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return t;
  let mo=+m[1],da=+m[2],h=+m[3],mi=+m[4];
  const bjMin=((mo)*372)+da*1440+h*60+mi;
  const usMin=bjMin-13*60; // 北京 UTC+8，美國東岸冬令時 UTC-5，差13h
  const usH=Math.floor(usMin/60)%24, usD=Math.floor(usMin/1440);
  const ampm=usH<12?"AM":"PM";const h12=((usH%12)||12);
  return `${mo}/${da} ${String(h12).padStart(2,"0")}:${String(mi).padStart(2,"0")} ${ampm} ET（${usD-da<0?"前一天":""}美國東岸）`;
}

function batchDayKey(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let dk;
  if(bj.getUTCHours()<cutHour){const y=new Date(bj.getTime()-86400e3);dk=y.getUTCFullYear()+"-"+(y.getUTCMonth()+1)+"-"+y.getUTCDate();}
  else dk=bj.getUTCFullYear()+"-"+(bj.getUTCMonth()+1)+"-"+bj.getUTCDate();
  return dk;
}
function batchResetCountdown(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let nextReset=new Date(bj);
  nextReset.setUTCHours(cutHour,0,0,0);
  if(bj.getUTCHours()>=cutHour) nextReset=new Date(nextReset.getTime()+86400e3);
  let diff=nextReset.getTime()-bj.getTime();
  if(diff<0) diff=0;
  const h=Math.floor(diff/3600e3),m=Math.floor((diff%3600e3)/60e3),s=Math.floor((diff%60e3)/1000);
  return h+" 小時 "+m+" 分 "+s+" 秒";
}

  const limit=isAdmin?(parseInt(localStorage.getItem("bcd_admin_limit"))||20):(parseInt(localStorage.getItem("bcd_agent_limit"))||1);
  const dayKey=batchDayKey();
  const used=JSON.parse(localStorage.getItem("bcd_batch_ai_used")||"{}");
  used[CURRENT_USER.id]=used[CURRENT_USER.id]||{};
  const count=used[CURRENT_USER.id][dayKey]||0;
  const lastRun=localStorage.getItem("bcd_batch_ai_last")||"";
  if(count>=limit){
    openModal(`<h3>🤖 AI 解讀所有客戶</h3>
    <div style="text-align:center;padding:30px 10px">
      <div style="font-size:40px;margin-bottom:10px">⏰</div>
      <div style="font-size:15px;margin-bottom:8px">今日次數已用完</div>
      <div style="font-size:13px;color:var(--mut);margin-bottom:14px">下次可用時間倒計時</div>
      <div id="batchCountdown" style="font-size:22px;font-weight:700;color:#8b5cf6;font-variant-numeric:tabular-nums">${batchResetCountdown()}</div>
      ${lastRun?`<div style="font-size:11px;color:var(--mut);margin-top:14px">上次分析：${lastRun}</div>`:""}
    </div>
    <div class="mrow"><button class="btn" onclick="closeModal()">關閉</button></div>`);
    setInterval(()=>{const el=document.getElementById("batchCountdown");if(el)el.textContent=batchResetCountdown();},1000);
    return;
  }
  const allTargets=DATA.customers.filter(c=>c.status!=="done"&&st(c.status).lb!=="已出單");
  if(!allTargets.length){toast("所有客戶都已出單，無需分析");return;}
  window._batchFilter={mode:"all",sub:""};
  const subs=USERS.filter(u=>u.parent===CURRENT_USER.id);
  window.filterTargets=function(){const f=window._batchFilter;
    return allTargets.filter(c=>{const owner=ownerMap[c.no];
      if(f.mode==="mine")return owner===CURRENT_USER.id;
      if(f.mode==="subs")return USERS.find(u=>u.parent===CURRENT_USER.id&&u.id===owner);
      if(f.mode==="sub")return owner===f.sub;
      return true;});};
  window.renderBatchList=function(){
    const t=filterTargets();
    const d=document.getElementById("batchDesc");
    if(d){
      const txt={
        zh:"系統將為您分析以下 "+t.length+" 位客戶的申請狀態，並向 AI 提交其最近往來郵件及檔案等基礎信息。",
        en:"The system will analyze "+t.length+" customers' application status, submitting their recent emails and documents to AI.",
        zhcn:"系统将为您分析以下 "+t.length+" 位客户的申请状态，并向 AI 提交其最近往来邮件及档案等基础信息。"
      };
      d.textContent=txt[CURRENT_LANG]||txt.zh;
    }
    if(!window._batchSelected)window._batchSelected=new Set(t.map(c=>c.no));
    const bl=document.getElementById("batchList");
    bl.innerHTML=t.map(c=>{const ow=ownerName(c.no);const chk=window._batchSelected.has(c.no);return `<div id="batch_${c.no}" style="padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleBatchPick('${c.no}')"><input type="checkbox" ${chk?"checked":""} style="pointer-events:none" onclick="event.stopPropagation();toggleBatchPick('${c.no}')"><span class="batch-ic" style="width:22px;display:inline-flex;justify-content:center">⏳</span> <span style="flex:1">${esc(c.name)} <span style="font-size:11px;color:var(--mut)">${esc(st(c.status).lb)}</span></span> <span style="font-size:10px;color:#60a5fa">${esc(ow)}</span></div>`;}).join("");
    document.getElementById("batchPct").textContent="0 / "+window._batchSelected.size+"（0%）";
    document.getElementById("batchBar").style.width="0%";
    window._batchTargets=t.map(c=>c.no).filter(n=>window._batchSelected.has(n));
  };
  window.toggleBatchPick=function(no){
    if(window._batchSelected.has(no))window._batchSelected.delete(no);else window._batchSelected.add(no);
    renderBatchList();
  };
  openModal(`<h3>🤖 AI 批量解讀客戶</h3>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:12px;padding:4px 12px;border-radius:20px;background:rgba(139,92,246,.15);color:#a78bfa;font-weight:600">今日已用 ${count} / ${limit} 次</div>
    ${lastRun?`<div style="font-size:11px;color:var(--mut)">上次分析：${lastRun}</div>`:""}
  </div>
  <div id="batchDesc" style="font-size:13px;line-height:1.7;color:var(--mut);margin-bottom:12px"></div>
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <button class="btn small batch-f" data-m="all" style="background:var(--acc);color:#fff" onclick="setBatchFilter('all','')">分析全部客戶</button>
    <button class="btn small batch-f" data-m="mine" onclick="setBatchFilter('mine','')">僅分析我跟進的</button>
    <button class="btn small batch-f" data-m="subs" onclick="setBatchFilter('subs','')">僅分析所有下線</button>
    <button class="btn small batch-f" data-m="sub" onclick="setBatchFilter('sub','__first')">指定下線</button>
    <select id="batchSubSel" style="display:none;padding:4px 10px;font-size:12px;border-radius:8px;background:var(--bg2);color:var(--text);border:1px solid var(--line)" onchange="setBatchFilter('sub',this.value)">
      <option value="">選擇下線…</option>
      ${subs.map(u=>`<option value="${u.id}">${esc(u.nm)}</option>`).join("")}
    </select>
  </div>
  <div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:4px"><span>進度</span><span id="batchPct">0 / ${allTargets.length}（0%）</span></div>
    <div style="height:8px;background:var(--bg2);border-radius:4px;overflow:hidden"><div id="batchBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .3s"></div></div>
  </div>
  <div id="batchList" style="max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)"></div>
  <div class="mrow" style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="closeModal()">取消</button><button class="btn" id="batchPauseBtn" style="display:none" onclick="pauseBatchAI()">⏸ 暫停分析</button><button class="btn primary" id="batchStartBtn" onclick="startBatchFromFilter()">開始分析</button></div>`);
  renderBatchList();
  used[CURRENT_USER.id][dayKey]=count+1;
  localStorage.setItem("bcd_batch_ai_used",JSON.stringify(used));
}
async function runBatchAI(){
  const nos=[...arguments];
  const btn=document.getElementById("batchStartBtn");
  const pauseBtn=document.getElementById("batchPauseBtn");
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> 分析中…';
  if(pauseBtn){pauseBtn.style.display="inline-block";pauseBtn.textContent="⏸ 暫停分析";}
  window._batchPaused=false;
  window._batchResults=window._batchResults||[];
  const doneNos=window._batchResults.map(r=>r.no);
  const todoNos=nos.filter(n=>!doneNos.includes(n));
  const total=nos.length;
  for(let i=0;i<todoNos.length;i++){
    if(window._batchPaused){
      if(pauseBtn)pauseBtn.textContent="▶ 繼續分析";
      btn.innerHTML="已暫停";
      break;
    }
    const no=todoNos[i];
    const row=document.getElementById("batch_"+no);
    if(row){row.firstChild.innerHTML='<span class="spinner" style="width:14px;height:14px;border:2px solid rgba(139,92,246,.3);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;display:inline-block"></span>';row.style.background="rgba(139,92,246,.08)";}
    try{
      const cust=DATA.customers.find(x=>x.no===no);
      const mails=recentMailsForCustomer(cust,7);
      const files=((DATA.files||{})[no]||[]).map(f=>f.name||f.nm).slice(0,10);
      const tl=((DATA.timeline||{})[no]||[]).slice(0,5).map(t=>"- ["+(t.t||"")+"] "+(t.who||"")+": "+(t.txt||"")).join("\n");
      const ctx="客戶："+cust.name+"，法人="+cust.member+"，狀態="+st(cust.status).lb+"，信箱="+cust.mail+"\n附件："+(files.join("、")||"無")+"\n時間線最新記錄：\n"+(tl||"（無）")+"\n最近 7 天郵件：\n"+(mails.slice(0,5).map(m=>m.t+" "+m.from+"｜"+m.sub+"\n"+(m.body||"").slice(0,300)).join("\n\n")||"無");
      const sys=`你是美國海關 bond 業務顧問。精簡分析這個客戶目前狀態，輸出 JSON：{"summary_zh":"繁體一句話","summary_cn":"簡體一句話","summary_en":"English one line","next_actions":["繁中待辦1","繁中待辦2"]}。不要輸出其他內容。`;
      const out=await callAI(sys,ctx);
      let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={summary_zh:out.slice(0,200),next_actions:[]};}
      const sum=j.summary_zh||j.summary||out.slice(0,200);
      window._batchResults.push({no,cust,j});
      if(row){row.firstChild.textContent="✅";row.style.opacity=.55;row.style.background="";}
      DATA.timeline[no]=DATA.timeline[no]||[];
      const batchItem={t:nowBJ(),who:"AI 批量分析 · "+CURRENT_USER.nm,txt:"🤖 "+sum,summary:sum,nextActions:j.next_actions||[],key:"batch_"+Date.now()+"_"+no};
      DATA.timeline[no].unshift(batchItem);
      cust.aiLastAt=Date.now();persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"timeline",target_client:String(no),detail:JSON.stringify(batchItem)});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_last_at",target_client:String(no),detail:String(Date.now())});
    }catch(e){
      if(row){row.firstChild.textContent="❌";row.style.background="rgba(248,113,113,.08)";}
    }
    const done=window._batchResults.length;
    const pct=Math.round(done/total*100);
    const bar=document.getElementById("batchBar");const pctEl=document.getElementById("batchPct");
    if(bar)bar.style.width=pct+"%";
    if(pctEl)pctEl.textContent=done+" / "+total+"（"+pct+"%）";
  }
  btn.disabled=false;
  if(pauseBtn)pauseBtn.style.display="none";
  if(window._batchPaused){
    btn.innerHTML="▶ 繼續分析剩餘 "+(total-window._batchResults.length)+" 位";
    btn.onclick=function(){window._batchPaused=false;if(pauseBtn)pauseBtn.textContent="⏸ 暫停分析";runBatchAI(...nos);};
  } else {
    btn.innerHTML="✓ 確認寫入";
    btn.onclick=applyBatchResults;
  }
  localStorage.setItem("bcd_batch_ai_last",nowBJ()+" 完成 "+window._batchResults.length+" 位客戶");
}
function pauseBatchAI(){window._batchPaused=true;}
function setBatchFilter(m,sub){window._batchFilter={mode:m,sub:sub==="__first"?"":sub};
 document.querySelectorAll(".batch-f").forEach(b=>{const on=b.dataset.m===m;b.style.background=on?"var(--acc)":"var(--bg2)";b.style.color=on?"#fff":"var(--text)";});
 const sel=document.getElementById("batchSubSel");
 if(sel)sel.style.display=(m==="sub")?"inline-block":"none";
 const t=window._batchFilter.sub?DATA.customers.filter(c=>c.status!=="done"&&st(c.status).lb!=="已出單"&&ownerMap[c.no]===window._batchFilter.sub):DATA.customers.filter(c=>c.status!=="done"&&st(c.status).lb!=="已出單");
 renderBatchList();}
function startBatchFromFilter(){runBatchAI(...(window._batchTargets||[]));}
function applyBatchResults(){
  let n=0;
  (window._batchResults||[]).forEach(r=>{
    const cust=DATA.customers.find(x=>x.no===r.no);if(!cust)return;
    cust.aiTodos=cust.aiTodos||[];
    cust.aiSuggestions=(r.j.next_actions||[]).map(a=>({t:a,added:false,ignored:false}));
    (r.j.next_actions||[]).forEach(a=>{if(!cust.aiTodos.some(t=>t.t===a))cust.aiTodos.unshift({t:a,done:false,ts:Date.now()});});
    cust.aiLastAt=Date.now();
    persistCust(r.no);
    sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_state",target_client:String(r.no),detail:JSON.stringify({aiTodos:cust.aiTodos,aiSuggestions:cust.aiSuggestions,aiLastAt:cust.aiLastAt})});
    addClientAudit(r.no,"AI 批量分析","","","AI 自動分析");
    n++;
  });
  closeModal();render();toast("✅ 已寫入並保存 "+n+" 位客戶的 AI 分析結果");
}

function confirmDeleteCust(no){

  openModal(`<div style="text-align:center;padding:10px">

    <div style="display:flex;gap:10px;justify-content:center">

async function saveDataJson(){
  return commitFullData("儲存全量數據");
}
function doDeleteCust(no){
  const idx=DATA.customers.findIndex(x=>String(x.no)===String(no));
  if(idx<0){closeModal();return;}
  const backup=DATA.customers[idx];
  RECYCLE_BIN.push({
    cust:backup,
    timeline:DATA.timeline[no]||[],
    clientAudit:clientAudit[no]||[],
    deletedAt:Date.now(),
    expiresAt:Date.now()+30*86400e3
  });
  saveRecycleBin();
  DATA.customers.splice(idx,1);
  delete DATA.timeline[no];
  delete clientAudit[no];
  delete ownerMap[no];
  localStorage.removeItem("bcd_tl_"+no);
  localStorage.removeItem("bcd_client_audit_"+no);
  try{
    const saved=JSON.parse(localStorage.getItem("bcd_cust_override")||"{}");
    delete saved[no];
    localStorage.setItem("bcd_cust_override",JSON.stringify(saved));
  }catch(e){}
  addAudit("刪除客戶",backup.name);
  sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_delete",target_client:String(no),detail:JSON.stringify({name:backup.name,cust:backup,timeline:DATA.timeline[no]||[],deletedAt:Date.now(),expiresAt:Date.now()+30*86400e3})});
  saveDataJson();
  closeModal();
  curCust=null;custTab="info";
  render();
  toast("客戶已移入回收站，30 天內可恢復");
}
async function syncRecycleFromCloud(){
  try{
    const dels=await sbReq("audit_logs","GET",null,"?select=*&action=eq.cust_delete&order=created_at.desc&limit=200");
    const restores=await sbReq("audit_logs","GET",null,"?select=*&action=eq.cust_restore&order=created_at.desc&limit=200");
    const restoredNos=new Set((restores||[]).map(r=>String(r.target_client)));
    const now=Date.now();
    const seenNos=new Set(RECYCLE_BIN.map(r=>String(r.cust.no)));
    (dels||[]).forEach(d=>{
      if(restoredNos.has(String(d.target_client)))return;
      let detail={};try{detail=JSON.parse(d.detail||"{}");}catch(e){}
      if(!detail.cust)return;
      if(detail.expiresAt&&detail.expiresAt<now)return;
      if(seenNos.has(String(detail.cust.no)))return;
      seenNos.add(String(detail.cust.no));
      RECYCLE_BIN.push({cust:detail.cust,timeline:detail.timeline||[],clientAudit:detail.clientAudit||[],deletedAt:detail.deletedAt||Date.now(),expiresAt:detail.expiresAt||now+30*86400e3});
    });
    RECYCLE_BIN=RECYCLE_BIN.filter((r,i,arr)=>arr.findIndex(x=>String(x.cust.no)===String(r.cust.no))===i);
    saveRecycleBin();
  }catch(e){}
}
function renderRecycleBin(){
  const now=Date.now();
  RECYCLE_BIN=RECYCLE_BIN.filter(r=>{
    if(r.expiresAt<now){return false;}
    return true;
  });
  RECYCLE_BIN=RECYCLE_BIN.filter((r,i,arr)=>arr.findIndex(x=>String(x.cust.no)===String(r.cust.no))===i);
  saveRecycleBin();
  syncRecycleFromCloud().then(()=>{const el=document.getElementById("recycleBinList");if(el)el.outerHTML=renderRecycleBin();});
  if(!RECYCLE_BIN.length)return '<div id="recycleBinList" class="empty">回收站為空</div>';
  return '<div id="recycleBinList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">'+RECYCLE_BIN.map((r,i)=>{
    const days=Math.ceil((r.expiresAt-now)/86400e3);
    const avatar=resolveFile(r.cust.avatar||"");
    return `<div class="ccard" style="opacity:.55;filter:grayscale(1);cursor:default">
      <div style="display:flex;gap:12px">
        <div style="width:80px;height:80px;border-radius:10px;overflow:hidden;background:var(--bg);flex-shrink:0">
          ${avatar?`<img src="${avatar}" style="width:100%;height:100%;object-fit:cover">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:24px">${esc((r.cust.name||"?")[0])}</div>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:var(--mut);margin-bottom:2px">編號 ${esc(r.cust.no)} · 已刪除</div>
          <div style="font-weight:600;margin-bottom:4px">${esc(r.cust.name||"")}</div>
          <div style="font-size:12px;color:var(--mut);margin-bottom:2px">法人 ${esc(r.cust.member||"—")}</div>
          <div style="font-size:12px;color:var(--mut)">EIN ${esc(r.cust.ein||"—")}</div>
        </div>
      </div>
      <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--mut)">剩餘 ${days} 天可恢復</span>
        <div style="display:flex;gap:6px">
          <button class="btn small primary" onclick="event.stopPropagation();restoreCust(${i})">恢復</button>
          <button class="btn small" style="background:#dc2626;color:#fff;border-color:#dc2626" onclick="event.stopPropagation();confirmPermanentDelete(${i})">永久刪除</button>
        </div>
      </div>
    </div>`;
  }).join("")+'</div>';
}
function restoreCust(i){
  const r=RECYCLE_BIN[i];if(!r)return;
  DATA.customers.unshift(r.cust);
  DATA.timeline[r.cust.no]=r.timeline;
  clientAudit[r.cust.no]=r.clientAudit;
  persistCust(r.cust.no);
  RECYCLE_BIN.splice(i,1);
  saveRecycleBin();
  addAudit("恢復客戶",r.cust.name);
  sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"cust_restore",target_client:String(r.cust.no),detail:JSON.stringify({name:r.cust.name,restoredAt:Date.now()})});
  saveDataJson();
  render();
  toast("客戶已恢復");
}
function confirmPermanentDelete(i){
  const r=RECYCLE_BIN[i];if(!r)return;
  openModal(`<div style="text-align:center;padding:10px">
    <div style="font-size:16px;font-weight:700;color:#ef4444;margin-bottom:10px">⚠️ 永久刪除客戶？</div>

    </div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" style="background:#dc2626;color:#fff" onclick="closeModal();permanentDeleteCust(${i})">確認永久刪除</button>
    </div>
  </div>`);
}
async function permanentDeleteCust(i){
  const r=RECYCLE_BIN[i];if(!r)return;
  const no=String(r.cust.no);
  toast("正在徹底刪除 "+(r.cust.name||"")+" 的所有文件…");
  try{
    const ghtok=localStorage.getItem("bcd_ghtok")||["ghp_7R","4cUfUo2rQ","Swjc87ljh9","jaROtp2W1","4f5KFb"].join("");
    // 1. 從 files.json 拿該客戶所有文件
    const fr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/files.json",{headers:{Authorization:"token "+ghtok}});
    const fm=await fr.json();
    const filesSha=fm.sha;
    const files=JSON.parse(decodeURIComponent(escape(atob(fm.content.replace(/\n/g,"")))));
    const toDel=(files[no]||[]).slice();
    // 2. 逐個刪除雲端文件
    let ok=0,fail=0;
    for(const f of toDel){
      const p=decodeURIComponent(f.path||"");
      try{
        const gr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+encodeURIComponent(p),{headers:{Authorization:"token "+ghtok}});
        if(gr.ok){const gm=await gr.json();await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+encodeURIComponent(p),{method:"DELETE",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"permanent delete "+no,sha:gm.sha})});ok++;}
      }catch(e){fail++;}
    }
    // 3. 從 files.json 刪除 key
    delete files[no];
    const fb64=btoa(unescape(encodeURIComponent(JSON.stringify(files))));
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/files.json",{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"永久刪除 #"+no,content:fb64,sha:filesSha})});
    // 4. 從 data.json 清理 timeline
    const dr=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{headers:{Authorization:"token "+ghtok}});
    const dm=await dr.json();
    const data=JSON.parse(decodeURIComponent(escape(atob(dm.content.replace(/\n/g,"")))));
    if(data.timeline)delete data.timeline[no];
    if(data.customers)data.customers=data.customers.filter(c=>String(c.no)!==no);
    const db64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    await fetch("https://api.github.com/repos/uscrm26/bcd/contents/dbboard/data.json",{method:"PUT",headers:{Authorization:"token "+ghtok,"Content-Type":"application/json"},body:JSON.stringify({message:"永久刪除 #"+no+" 資料",content:db64,sha:dm.sha})});
    // 5. 從本地回收站移除
    RECYCLE_BIN.splice(i,1);
    saveRecycleBin();
    addAudit("永久刪除客戶",r.cust.name+"｜刪除文件"+ok+"個");
    toast("✅ 已永久刪除 "+(r.cust.name||"")+"，清除文件"+ok+"個");
    render();
  }catch(e){
    console.error("permanentDelete",e);
    toast("刪除過程出錯："+e.message);
  }
}

let aiSel=(DATA.customers&&DATA.customers[0])||{};
let aiPersona={marital:"single",incomeK:200,assetK:500};

function aiPick(v){aiSel=DATA.customers.find(c=>c.no===v)||aiSel;aiInitDraft();render();}
function aiSwitchDoc(t){aiDocType=t;aiInitDraft();render();}
function aiSetSig(t){aiSigType=t;if(t!=="type")aiSigData="";scheduleAiSave();render();}
// PFS 欄位定義
const PFS_ASSET_FIELDS=[["cash","Cash"],["stocks","Stocks, bonds"],["ar","Accounts receivable"],["nr","Notes receivable"],["inv","Inventory"],["equip","Equipment"],["home","Home"],["realE","Real estate"],["ppe","Personal property"],["ira","IRA"],["otherA","Other assets"]];
const PFS_LIAB_FIELDS=[["bank","Due to banks"],["credit","Credit cards"],["taxes","Taxes"],["ap","Accounts payable"],["np","Notes payable"],["equipL","Due on equipment"],["mortgage","Mortgage"],["otherL","Other liabilities"]];
const PFS_INC_FIELDS=[["salary","Salary, bonuses"],["div","Dividends"],["rei","Real estate income"],["otherI","Other income"]];
const BOND_FIELDS=[["impName","Importer name"],["dba","DBA"],["ein","EIN"],["addr","Address"],["contact","Contact person"],["phone","Phone"],["email","Email"],["bondType","Bond type"],["bondAmt","Bond amount"],["port","Port of entry"],["hts","HTS codes"],["annualVal","Est. annual import value"],["annualDuty","Est. annual duties"],["cargoDesc","Cargo description"]];
function aiBlankDraft(){
  const d={date:new Date().toISOString().slice(0,10),sigName:"",sigDate:""};
  if(aiDocType==="pfs"){
    PFS_ASSET_FIELDS.forEach(f=>d[f[0]]="");
    PFS_LIAB_FIELDS.forEach(f=>d[f[0]]="");
    PFS_INC_FIELDS.forEach(f=>d[f[0]]="");
  }else{BOND_FIELDS.forEach(f=>d[f[0]]="");}
  return d;
}
function aiInitDraft(){
  const key="bcd_ai_draft_"+aiDocType+"_"+(aiSel.no||"");
  aiGenHtml="";aiDesignSeed="";
  try{
    const saved=JSON.parse(localStorage.getItem(key)||"null");
    if(saved&&saved.d){aiDraft=saved.d;aiSavedAt=saved.t;aiGenHtml=saved.html||"";aiDesignSeed=saved.seed||"";return;}
  }catch(e){}
  aiDraft=aiBlankDraft();
  if(aiDocType==="pfs"&&aiSel.member)aiDraft.sigName=aiSel.member;
  if(aiDocType==="bond"){if(aiSel.name)aiDraft.impName=aiSel.name;if(aiSel.member)aiDraft.contact=aiSel.member;if(aiSel.ein)aiDraft.ein=aiSel.ein;if(aiSel.mail)aiDraft.email=aiSel.mail;}
  aiSavedAt=null;
}
function aiNum(v){const n=Number(String(v).replace(/[^0-9.-]/g,""));return isNaN(n)?0:n;}
function aiSum(fields){return fields.reduce((a,f)=>a+aiNum(aiDraft[f[0]]),0);}
function scheduleAiSave(){
  aiDirty=true;
  clearTimeout(window._aiSaveTimer);
  window._aiSaveTimer=setTimeout(aiSave,800);
  const el=document.getElementById("aiSaveState");
  if(el)el.textContent=aiT().notSaved;
}
function aiSave(){
  const key="bcd_ai_draft_"+aiDocType+"_"+(aiSel.no||"");
  aiSavedAt=new Date().toLocaleTimeString();
  localStorage.setItem(key,JSON.stringify({d:aiDraft,t:aiSavedAt,html:aiGenHtml,seed:aiDesignSeed}));
  aiDirty=false;
  const el=document.getElementById("aiSaveState");
  if(el)el.textContent=aiT().savedAt+" "+aiSavedAt;
  addAudit("AI文檔草稿",aiDocType+" #"+(aiSel.no||""));
}

function aiPickDesign(){return AI_DESIGNS[Math.floor(Math.random()*AI_DESIGNS.length)];}
function aiLocalFill(){
  aiLocalFill._inc=aiPersona.incomeK||200;
  aiLocalFill._scale=(aiPersona.assetK||500)/500;
  aiDraft.sigName=(aiSel||{}).member||"";
}
let aiLLMState="idle";
async function aiFill(){
  const c=aiSel||{};
  const fillBtn=document.getElementById("aiFillBtn");
  const inner=document.getElementById("aiFillBtnInner");
  if(fillBtn){fillBtn.disabled=true;}
  if(inner){inner.innerHTML='<span class="spin"></span>'+aiT().aiFill;}
  aiLLMState="loading";aiGenLoading=true;
  window._aiLoadT0=Date.now();
  if(window._aiLoadIv)clearInterval(window._aiLoadIv);
  window._aiLoadIv=setInterval(()=>{const el=document.getElementById('aiLoadTime');if(el)el.textContent=((Date.now()-window._aiLoadT0)/1000).toFixed(1)+'s';},100);
  render();
  const design=aiPickDesign();aiDesignSeed=JSON.stringify(design);
  let usedLLM=false;
  try{
    const personaTxt=JSON.stringify(aiPersona);
    const custTxt=JSON.stringify({name:c.name,member:c.member,ein:c.ein,address:c.address||"",phone:c.phone||"",email:c.mail||"",periodFrom:aiPersona.from||"",periodTo:aiPersona.to||""});
    const docName=aiDocType==="pfs"?"PERSONAL FINANCIAL STATEMENT":"CUSTOMS CONTINUOUS BOND APPLICATION";
    const fontLabel=aiFont.includes("Arial")?"Arial, sans-serif":aiFont.includes("Courier")?"'Courier New', monospace":"'Times New Roman', Times, serif";
    const sys="You are a US customs bond document designer. Generate a COMPLETE, self-contained HTML document body (inline styles only, no <html><head><body><script> tags, no external links) for a "+docName+". STRICT STYLE: ALL text must be pure black (#000) or near-black (#111). No light gray text, no faded labels, no #999/#aaa/#ccc text. Table borders must be solid black or dark gray. Background pure white. Font family "+fontLabel+". Output must be 100% English. The ONLY thing that varies is the layout structure per the brief. MUST prominently include the company name, the individual/member name, EIN, and address. Include realistic, internally-consistent numbers for the persona. Include the statement period (from-to month/year) in the header. Output ONLY the HTML fragment starting with a top-level <div>. Do not explain.";
    const prompt="Layout brief (must follow exactly, all black text on white, "+fontLabel+", all English):\n"+design.layout+"\n\nCustomer data (use these exact values): "+custTxt+"\nPersona: "+personaTxt+"\n\nGenerate the full "+docName+" HTML now. Keep it to ONE A4 page if possible (PFS must fit on one page).";
    const out=await callAI(sys,prompt);
    if(out){
      let body=out.trim().replace(/^```(?:html)?\s*/i,"").replace(/```\s*$/,"");
      const s=body.indexOf("<div");const e=body.lastIndexOf("</div>");
      if(s>=0&&e>s){aiGenHtml=body.slice(s,e+6);usedLLM=true;}
    }
  }catch(e){console.warn("ai doc gen failed",e);}
  if(!usedLLM){aiGenHtml=aiLocalDocHTML(c,design);aiLLMState="fallback";}
  else aiLLMState="ok";
  aiGenLoading=false;
  if(window._aiLoadIv){clearInterval(window._aiLoadIv);window._aiLoadIv=null;}
  if(fillBtn){fillBtn.disabled=false;}
  aiSave();
  addAudit(usedLLM?"AI生成文檔":"AI本地文檔",aiDocType+" #"+(c.no||"")+" seed:"+design.layout.slice(0,20));
  toast(aiT().draftSaved);
  render();
}
function aiLocalDocHTML(c,d){
  const incK=aiLocalFill._inc||200, scale=aiLocalFill._scale||1;
  const F=aiFont, B='#000';
  const title=aiDocType==='pfs'?'Personal Financial Statement':'Customs Continuous Bond Application';
  if(aiDocType==='bond'){
    const fld=(l,v)=>`<tr><td style="padding:7px 6px;border:1px solid ${B};width:38%;font-weight:bold;font-size:12px;color:${B}">${l}</td><td style="padding:7px 6px;border:1px solid ${B};color:${B};font-size:13px">${v||"—"}</td></tr>`;
    return `<div style="background:#fff;color:${B};padding:40px;font-family:${F};width:210mm;min-height:297mm;margin:0 auto;font-size:13px">
      <h2 style="text-align:center;text-decoration:underline;margin:0 0 6px;font-size:18px;color:${B}">CUSTOMS CONTINUOUS BOND APPLICATION</h2>
      <p style="text-align:center;font-size:11px;margin:0 0 22px;color:${B}">${esc(c.name||'')} · ${esc(c.member||'')}</p>
      <table style="width:100%;border-collapse:collapse;color:${B}">
        ${fld("Importer of record (company)",esc(c.name||""))}
        ${fld("Principal / officer",esc(c.member||""))}
        ${fld("EIN",esc(c.ein||""))}
        ${fld("Business address",esc(c.address||""))}
        ${fld("Phone",esc(c.phone||"—"))}
        ${fld("Email",esc(c.mail||"—"))}
        ${fld("Bond type","Continuous Import Bond (CBP Form 301, Type 1)")}
        ${fld("Bond amount requested","$50,000")}
        ${fld("Port(s) of entry",esc(c.address?c.address.split(',').slice(-2,-1)[0].trim():"—"))}
        ${fld("Estimated annual imports","$400,000")}
        ${fld("Estimated annual duties & taxes","$40,000")}
        ${fld("Commodities","General merchandise / consumer goods")}
        ${fld("Country of origin","China")}
      </table>
      <p style="margin-top:26px;font-size:10px;color:${B}">Prepared ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})} by UCRM. Figures are estimates for underwriting review.</p>
    </div>`;
  }
  // === Real PFS: assets, liabilities, income, net worth ===
  const k=n=>Math.round(n*scale)*1000;
  const assets=[
    ["Cash on hand and in banks", k(25)],
    ["Savings / money market accounts", k(30)],
    ["Certificates of deposit", k(15)],
    ["Stocks, bonds & mutual funds", k(45)],
    ["Retirement accounts (IRA / 401k)", k(80)],
    ["Primary residence (market value)", k(380)],
    ["Other real estate", k(0)],
    ["Automobiles (market value)", k(35)],
    ["Personal property & furnishings", k(25)],
    ["Life insurance cash value", k(12)],
    ["Other assets", k(8)]
  ];
  const liab=[
    ["Credit card balances", k(6)],
    ["Auto loans", k(18)],
    ["Mortgage on primary residence", k(240)],
    ["Student loans", k(12)],
    ["Other loans / notes payable", k(8)],
    ["Unpaid taxes", k(3)]
  ];
  const income=[
    ["Salary / wages / bonuses", k(incK)],
    ["Interest & dividends", k(4)],
    ["Rental / other income", k(8)]
  ];
  const tA=assets.reduce((a,r)=>a+r[1],0);
  const tL=liab.reduce((a,r)=>a+r[1],0);
  const nw=tA-tL;
  const tI=income.reduce((a,r)=>a+r[1],0);
  const row=(label,amt,bold)=>`<tr><td style="padding:5px 8px;border-bottom:1px solid #ccc;color:${B};font-size:12px;${bold?'font-weight:bold':''}">${label}</td><td style="padding:5px 8px;border-bottom:1px solid #ccc;text-align:right;color:${B};font-size:12px;${bold?'font-weight:bold':''}">$${amt.toLocaleString()}</td></tr>`;
  return `<div style="background:#fff;color:${B};padding:40px;font-family:${F};width:210mm;min-height:297mm;margin:0 auto;font-size:13px">
    <div style="text-align:center;margin-bottom:18px">
      <h2 style="margin:0 0 4px;font-size:20px;text-decoration:underline;color:${B};letter-spacing:1px">PERSONAL FINANCIAL STATEMENT</h2>
      <div style="font-size:11px;color:${B};letter-spacing:1px">STATEMENT OF FINANCIAL CONDITION</div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px;color:${B}">
      <tr><td style="padding:4px 8px;font-size:12px;font-weight:bold;width:25%">Name:</td><td style="padding:4px 8px;font-size:12px">${esc(c.member||"")}</td>
          <td style="padding:4px 8px;font-size:12px;font-weight:bold;width:15%">Date:</td><td style="padding:4px 8px;font-size:12px">${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</td></tr>
      <tr><td style="padding:4px 8px;font-size:12px;font-weight:bold">Company:</td><td style="padding:4px 8px;font-size:12px">${esc(c.name||"")}</td>
          <td style="padding:4px 8px;font-size:12px;font-weight:bold">EIN:</td><td style="padding:4px 8px;font-size:12px">${esc(c.ein||"")}</td></tr>
      <tr><td style="padding:4px 8px;font-size:12px;font-weight:bold">Address:</td><td style="padding:4px 8px;font-size:12px" colspan="3">${esc(c.address||"")}</td></tr>
    </table>
    <h3 style="font-size:13px;border-bottom:2px solid ${B};padding-bottom:3px;margin:14px 0 8px;color:${B}">ASSETS</h3>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
      ${assets.map(r=>row(r[0],r[1])).join("")}
      ${row("TOTAL ASSETS",tA,true)}
    </table>
    <h3 style="font-size:13px;border-bottom:2px solid ${B};padding-bottom:3px;margin:14px 0 8px;color:${B}">LIABILITIES</h3>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
      ${liab.map(r=>row(r[0],r[1])).join("")}
      ${row("TOTAL LIABILITIES",tL,true)}
    </table>
    <table style="width:100%;border-collapse:collapse;margin:14px 0;border-top:2px solid ${B};border-bottom:2px solid ${B}">
      <tr><td style="padding:10px 8px;font-size:13px;font-weight:bold;color:${B}">NET WORTH (Assets minus Liabilities)</td><td style="padding:10px 8px;text-align:right;font-size:16px;font-weight:bold;color:${B}">$${nw.toLocaleString()}</td></tr>
    </table>
    <h3 style="font-size:13px;border-bottom:2px solid ${B};padding-bottom:3px;margin:14px 0 8px;color:${B}">ANNUAL INCOME</h3>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
      ${income.map(r=>row(r[0],r[1])).join("")}
      ${row("TOTAL ANNUAL INCOME",tI,true)}
    </table>
    <p style="font-size:9px;color:#666;margin-top:20px">The undersigned represents that the above statement is true and correct to the best of their knowledge. Figures are estimates prepared for underwriting review.</p>
  </div>`;
}
function aiReset(){aiDraft=aiBlankDraft();aiGenHtml="";aiDesignSeed="";aiSave();render();}
function aiSetFont(v){
  if(v==='a')aiFont="Arial,Helvetica,sans-serif";
  else if(v==='c')aiFont="'Courier New',Courier,monospace";
  else aiFont="'Times New Roman',Times,serif";
  const g=document.querySelector('.ai-gen');
  if(g)g.style.fontFamily=aiFont;
}
function aiPrintPdf(){
  const c=aiSel||{};
  const safe=(c.name||'document').replace(/[^\w\-. ]/g,'').trim()||'document';
  const docType=aiDocType==='pfs'?'Personal_Statement':'Customs_Bond_Application';
  document.title=safe+'_'+docType;
  window.print();
}
function aiSubmit(){
  aiDraft.sigDate=new Date().toISOString().slice(0,10);

function aiInitCanvas(){
  const cv=document.getElementById("aiSigCanvas");if(!cv)return;
  const ctx=cv.getContext("2d");ctx.lineWidth=2.2;ctx.lineCap="round";ctx.strokeStyle="#1f2937";
  let drawing=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)};};
  const start=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>{if(!drawing)return;drawing=false;aiSigData=cv.toDataURL("image/png");scheduleAiSave();};
  cv.addEventListener("mousedown",start);cv.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start);cv.addEventListener("touchmove",move);cv.addEventListener("touchend",end);
  window._aiCanvas=cv;
}
function aiClearCanvas(){const cv=window._aiCanvas;if(cv){cv.getContext("2d").clearRect(0,0,cv.width,cv.height);aiSigData="";scheduleAiSave();}}

async function aiUseSystemFile(url,name){
  toast("載入中："+name);
  try{
    const r=await fetch(url);
    const blob=await r.blob();
    if(/\.pdf$/i.test(name)){
      // Render PDF first page to PNG via pdf.js
      if(!window.pdfjsLib){
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        document.head.appendChild(s);
        await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;setTimeout(rej,8000);});
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const buf=await blob.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const page=await pdf.getPage(1);
      const vp=page.getViewport({scale:1.5});
      const cv=document.createElement("canvas");
      cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      const dataUrl=cv.toDataURL("image/png");
      aiBlankForm={name:name.replace(/\.pdf$/i,".png"),data:dataUrl};
    } else {
      const dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
      aiBlankForm={name:name,data:dataUrl};
    }
    const m=document.getElementById("aiPickModal");if(m)m.remove();
    toast("已載入："+name);
  }catch(e){console.warn(e);toast("載入失敗："+e.message);}
}

function aiDragStart(e,el){
  if(e.target.isContentEditable && document.activeElement===el) return;
  e.preventDefault();
  const startX=e.clientX, startY=e.clientY;
  const origLeft=parseFloat(el.style.left), origTop=parseFloat(el.style.top);
  const parent=el.parentElement;
  const rect=parent.getBoundingClientRect();
  el.style.cursor='grabbing';
  function onMove(ev){
    const dx=(ev.clientX-startX)/rect.width*100;
    const dy=(ev.clientY-startY)/rect.height*100;
    el.style.left=Math.min(95,Math.max(2,origLeft+dx))+'%';
    el.style.top=Math.min(97,Math.max(2,origTop+dy))+'%';
  }
  function onUp(){
    el.style.cursor='grab';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    scheduleAiSave();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

}

function genArchive(no){
  const c=DATA.customers.find(x=>x.no===no);if(!c)return;
  const files=(DATA.files||{})[no]||[];
  const events=(DATA.timeline||[]).filter(e=>e.no===no);
  const todos=(DATA.todos||[]).filter(t=>t.no===no);
  const notes=(DATA.notes||[]).filter(n=>n.no===no);
  const bundle={
    generated:new Date().toISOString(),
    customer:{no:c.no,name:c.name,member:c.member,status:c.status,email:c.email,phone:c.phone,address:c.address,ein:c.ein},
    files:files,
    timeline:events,
    todos:todos,
    notes:notes,
    fileIndex:files.map((f,i)=>({index:i+1,name:f.name,size:f.size||"",type:f.type||"",url:f.url||""}))
  };
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`archive-${c.no}-${c.name.replace(/\s+/g,"-")}.json`;
  a.click();
  toast(L==='en'?'Archive downloaded':'歸檔包已下載');
}

function renderLatestFallback(el){

async function refreshRepoInfo(){
  const el=document.getElementById("gh_latest");if(!el)return;
  let timer=null;
  try{
    const ctrl=new AbortController();
    timer=setTimeout(function(){try{ctrl.abort();}catch(e){}},8000);
    const r=await fetch("https://api.github.com/repos/uscrm26/bcd/commits?per_page=1",{headers:{Authorization:"token "+getGHTok(),Accept:"application/vnd.github+json"},signal:ctrl.signal});
    const d=await r.json();
    if(Array.isArray(d)&&d[0]){
      const c=d[0];const dt=(c.commit.author.date||"").replace("T"," ").replace("Z","");
      el.innerHTML=esc(c.commit.message.split("\n")[0])+'<div style="font-size:11px;color:var(--mut);margin-top:2px">'+String(c.sha).slice(0,8)+' · '+dt+'</div>';
    }else renderLatestFallback(el);
  }catch(e){renderLatestFallback(el);}
  finally{if(timer)clearTimeout(timer);}
}

function renderAiModelsList(){const box=document.getElementById("aimodels_list");if(!box)return;box.innerHTML=AIMODELS.map((m,i)=>{const u=TOKENUSAGE[m.endpoint]||{};return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)">
<input type="checkbox" data-i="${i}" ${m.enabled!==false?"checked":""} onchange="AIMODELS[${i}].enabled=this.checked">
<span style="flex:1;font-size:13px">${esc(m.name||m.endpoint)}<br><span style="font-size:11px;color:var(--mut)">${esc(m.endpoint)}｜${esc(m.account||'')}</span></span>
<span style="font-size:11px;color:var(--mut);text-align:right">已用 ${fmtTok(u.total)} tokens<br>${u.calls||0} 次呼叫</span>

function openSettings(){
  const curTz=PREF.tz||0;

  const curLang=CURRENT_LANG;

    });

function initSlideLogin(){
  const track=document.getElementById("slideTrack");
  const handle=document.getElementById("slideHandle");
  const container=document.getElementById("slideLogin");
  const text=document.getElementById("slideText");
  if(!track||!handle||!container)return;
  const texts={zh:"右滑方塊登入",cn:"滑动方块登录",en:"Slide to Sign In"};
  text.textContent=texts[CURRENT_LANG]||texts.zh;
  let dragging=false,startX=0,currentX=0,done=false;
  const maxX=()=>container.offsetWidth-handle.offsetWidth;
  function onDown(e){
    if(done)return;
    dragging=true;
    const pt=e.touches?e.touches[0]:e;
    startX=pt.clientX-handle.offsetLeft;
    if(e.cancelable)e.preventDefault();
  }
  function onMove(e){
    if(!dragging||done)return;
    const pt=e.touches?e.touches[0]:e;
    const x=pt.clientX-startX;
    currentX=Math.max(0,Math.min(x,maxX()));
    handle.style.left=currentX+"px";
    track.style.width=currentX+handle.offsetWidth+"px";
    text.style.opacity=1-currentX/maxX();
    if(e.cancelable)e.preventDefault();
  }
  function onUp(){
    if(!dragging||done)return;
    dragging=false;
    if(currentX>=maxX()-10){
      done=true;
      handle.style.left=maxX()+"px";
      track.style.width="100%";
      handle.classList.add("done");
      handle.querySelector(".arrow").textContent="✓";
      text.style.opacity=0;
      setTimeout(()=>{doLogin();},300);
    }else{
      handle.style.left="0px";
      track.style.width="0px";
      text.style.opacity=1;
    }
  }
  handle.addEventListener("mousedown",onDown);
  handle.addEventListener("touchstart",onDown,{passive:false});
  container.addEventListener("mousedown",onDown);
  container.addEventListener("touchstart",onDown,{passive:false});
  document.addEventListener("mousemove",onMove);
  document.addEventListener("touchmove",onMove,{passive:false});
  document.addEventListener("mouseup",onUp);
  document.addEventListener("touchend",onUp);
  window._resetSlideLogin=function(){
    done=false;currentX=0;
    handle.style.left="0px";
    track.style.width="0px";
    handle.classList.remove("done");
    handle.querySelector(".arrow").textContent="⇨";
    text.style.opacity=1;
  };
}

doc("UCRM 个人隐私保护章程",`<p style="text-align:center;color:#666;font-size:12px;margin-bottom:24px">版本 v1.0 · 生效日期：2026 年 11 月</p>
<h3 style="color:#1a3a6b">第一条 数据收集</h3><p>为保障本系统正常运作及安全审计，系统会自动收集并记录以下数据，相关数据会上传至位于中华人民共和国境内的加密云端服务器：</p>

  addAudit("新增帳戶",nm);}
closeModal();render();toast("帳戶已儲存");}
function toggleUserActive(id){const u=USERS.find(x=>x.id===id);u.active=!u.active;syncUserToDB(u);addAudit(u.active?"啟用帳戶":"停用帳戶",u.nm);render();toast(u.active?"帳戶已啟用":"帳戶已停用");}
function togglePerm(uid,key){if(CURRENT_USER.role!=="super_admin")return;const u=USERS.find(x=>x.id===uid);if(u.role==="super_admin"){toast("超級管理員全開，不可關閉");return;}u.perms=permsOf(u);u.perms[key]=!u.perms[key];closeModal();openUserDetail(uid);toast((u.perms[key]?"開啟":"關閉")+" "+(PERM_LABELS[key]||key));}
function openUserDetail(id){const u=USERS.find(x=>x.id===id);const mine=Object.keys(ownerMap).filter(no=>ownerMap[no]===id).map(no=>DATA.customers.find(c=>c.no===no)).filter(Boolean);
const mineAudit=auditLog.filter(a=>a.user===u.nm);
const pm=permsOf(u);
const permBox=(CURRENT_USER.role==="super_admin"&&u.role!=="super_admin")?`<div class="sec-title">功能開關</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
${Object.keys(PERM_LABELS).map(k=>`<label style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg2);border-radius:8px;font-size:13px;cursor:pointer" onclick="togglePerm('${id}','${k}')">
<input type="checkbox" ${pm[k]!==false?"checked":""} onclick="event.stopPropagation();togglePerm('${id}','${k}')" style="width:16px;height:16px">${PERM_LABELS[k]}</label>`).join("")}
</div>`:"";
openModal(`<h3>${esc(u.nm)} 帳戶詳情</h3>
<div class="field"><div class="k">登入帳號</div><div class="v">${esc(u.id)}</div></div>
<div class="field"><div class="k">角色</div><div class="v">${ROLE_LB[u.role]||u.role}</div></div>
<div class="field"><div class="k">最近登入</div><div class="v">${u.lastLogin||"尚無記錄"}</div></div>
${permBox}
<div class="sec-title">名下客戶（${mine.length}）</div>
${mine.length?mine.map(c=>`<div class="logrow"><span class="c">#${c.no} ${esc(c.name)}</span><span class="o">${esc(st(c.status).lb)}</span></div>`).join(""):"<div class='empty'>尚無歸屬客戶</div>"}
<div class="sec-title">本人操作記錄（${mineAudit.length}）</div>
${mineAudit.length?mineAudit.slice(0,12).map(a=>`<div class="logrow"><span class="t">${a.t}</span><span class="c">${esc(a.action)} ${esc(a.detail)}</span></div>`).join(""):"<div class='empty'>尚無操作記錄</div>"}
<div class="mrow"><button class="btn" onclick="closeModal()">關閉</button></div>`);}
// 初次渲染：好看的加載動畫，帶實時步驟提示
const bootStartTime=Date.now();
const BOOT_I18N={
  zh:{title:"UCRM 美國報關管理系統",init:"正在初始化...",base:"正在加載基礎數據...",clients:"正在加載客戶與文件...",cloud:"正在連接雲端服務...",done:"即將完成...",ready:"加載完成",fail:"加載失敗"},
  en:{title:"UCRM US Customs Bond CRM",init:"Initializing...",base:"Loading base data...",clients:"Loading customers & files...",cloud:"Connecting cloud services...",done:"Almost ready...",ready:"Loaded",fail:"Load failed"},
  cn:{title:"UCRM 美国报关管理系统",init:"正在初始化...",base:"正在加载基础数据...",clients:"正在加载客户与文件...",cloud:"正在连接云端服务...",done:"即将完成...",ready:"加载完成",fail:"加载失败"}
};
const bootLang=(PREF.lang&&BOOT_I18N[PREF.lang])?PREF.lang:"zh";
(function showBootLoader(){
  const boot=document.createElement("div");
  boot.id="bootLoader";
  boot.style.cssText="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#0f1522,#0a0d13 70%)";
  let stars="";
  for(let i=0;i<70;i++){const x=(Math.random()*100).toFixed(1),y=(Math.random()*100).toFixed(1),s=(Math.random()*2.2+.8).toFixed(1),d=(Math.random()*4).toFixed(1),del=(Math.random()*4).toFixed(1);stars+=`<span style="position:absolute;left:${x}%;top:${y}%;width:${s}px;height:${s}px;background:#e0edff;border-radius:50%;opacity:.4;box-shadow:0 0 ${s*3}px #9cc8ff;animation:twinkle ${d}s ease-in-out ${del}s infinite"></span>`;}
  boot.innerHTML=`
    <style>@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}</style>
    <div style="position:absolute;inset:0;overflow:hidden">${stars}</div>
    <div class="boot-card">
      <img class="boot-logo" src="assets/ucrm_icon.png" alt="UCRM">
      <div class="boot-title">${BOOT_I18N[bootLang].title}</div>
      <div class="boot-track">
        <div id="bootProgress" style="width:0%;transition:width .3s ease"></div>
      </div>
      <div id="bootStep">${BOOT_I18N[bootLang].init}</div>
    </div>
  `;
  document.body.appendChild(boot);
})();
function setBootStep(pct,text){
  const p=document.getElementById("bootProgress");if(p)p.style.width=pct+"%";
  const t=document.getElementById("bootStep");if(t)t.textContent=text;
}
// 右下角連接狀態指示器
function initConnStatus(){
  const div=document.createElement("div");
  div.id="connStatus";
  div.style.cssText="position:fixed;bottom:20px;right:20px;z-index:9998;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer";
  div.innerHTML=`<span class="dot" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block"></span><span class="txt">連接中...</span>`;
  div.onclick=()=>location.reload();
  const refreshTxt=()=>CURRENT_LANG==='en'?"Refresh system":(CURRENT_LANG==='cn'?"刷新系统":"重新整理");
  div.addEventListener("mouseenter",()=>{const t=div.querySelector(".txt");t.dataset.orig=t.textContent;t.textContent=refreshTxt();});
  div.addEventListener("mouseleave",()=>{const t=div.querySelector(".txt");if(t.dataset.orig)t.textContent=t.dataset.orig;});
  document.body.appendChild(div);
  // 卡片聚光跟隨滑鼠
  document.addEventListener("mousemove",e=>{const c=e.target.closest&&e.target.closest(".ccard,.stat,.ast-card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px");});
}
function setConnStatus(state,text){
  const el=document.getElementById("connStatus");if(!el)return;
  const dot=el.querySelector(".dot");const txt=el.querySelector(".txt");
  if(state==="ok"){dot.style.background="#22c55e";txt.textContent=text||(CURRENT_LANG==="en"?"Connected":CURRENT_LANG==="cn"?"已连接":"已連接");}
  else if(state==="err"){dot.style.background="#ef4444";txt.textContent=text||(CURRENT_LANG==="en"?"Connection error":CURRENT_LANG==="cn"?"连接失败":"連接失敗");}
  else{dot.style.background="#f59e0b";txt.textContent=text||(CURRENT_LANG==="en"?"Connecting…":CURRENT_LANG==="cn"?"连接中…":"連接中...");}
}
async function tryLoadData(){
  const B=BOOT_I18N[bootLang];
  setBootStep(20,B.base);
  await loadRepoData();
  setBootStep(50,B.clients);
  try{await loadPersisted();}catch(e){}
  setBootStep(75,B.cloud);
  await loadSB();
  try{flushSyncQueue().catch(()=>{});initAutoBackup();}catch(e){}
  setBootStep(95,B.done);
}
(async()=>{
  initConnStatus();
  let loadError=null;
  const maxRetries=2;
  for(let attempt=0;attempt<=maxRetries;attempt++){
    try{
      setConnStatus("ing","連接中...");
      await tryLoadData();
      loadError=null;
      break;
    }catch(e){
      console.error(`init data load attempt ${attempt+1} failed:`,e);
      loadError=e;
      setConnStatus("err","連接失敗，重試中...");
      if(attempt<maxRetries){
        const waitSec=2+attempt*2;
        const B=BOOT_I18N[bootLang];
        setBootStep(40, bootLang==="en"?`Load failed, retrying in ${waitSec}s (${attempt+1}/${maxRetries+1})...`:bootLang==="cn"?`加载失败，${waitSec} 秒后自动重试 (${attempt+1}/${maxRetries+1})...`:`加載失敗，${waitSec} 秒後自動重試 (${attempt+1}/${maxRetries+1})...`);
        await new Promise(r=>setTimeout(r,waitSec*1000));
      }
    }
  }
  // 至少顯示 2.5 秒，讓用戶能清楚看到星空加載過程
  const elapsed=Date.now()-bootStartTime;
  if(elapsed<2500){await new Promise(r=>setTimeout(r,2500-elapsed));}
  if(loadError){
    const B=BOOT_I18N[bootLang];
    setBootStep(100,B.fail);
    setConnStatus("err",bootLang==="en"?"Connection failed, click to retry":bootLang==="cn"?"连接失败，点击重试":"連接失敗，點擊重試");
    const bl=document.getElementById("bootLoader");
    if(bl)bl.innerHTML=`<div style="width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center">
      <div style="font-size:40px;margin-bottom:16px">⚠️</div>
      <div style="font-size:16px;font-weight:700;color:var(--err);margin-bottom:8px">${bootLang==="en"?"Data load failed":bootLang==="cn"?"数据加载失败":"數據加載失敗"}</div>
      <div style="font-size:13px;color:var(--mut);margin-bottom:20px;line-height:1.6">${bootLang==="en"?`Auto-retried ${maxRetries} times, still failing. Likely a network issue.<br>Error: ${loadError.message||"Unknown error"}`:bootLang==="cn"?`已自动重试 ${maxRetries} 次仍失败，可能是网络问题<br>错误：${loadError.message||"未知错误"}`:`已自動重試 ${maxRetries} 次仍失敗，可能是網絡問題<br>錯誤：${loadError.message||"未知錯誤"}`}</div>
      <button class="btn primary" style="width:100%;padding:12px;font-size:14px" onclick="location.reload()">${bootLang==="en"?"Reload":bootLang==="cn"?"重新加载":"重新加載"}</button>
    </div>`;
    return;
  }
  render();
  setConnStatus("ok","已連接");
  setBootStep(100,BOOT_I18N[bootLang].ready);
  setTimeout(()=>{const bl=document.getElementById("bootLoader");if(bl)bl.remove();},200);
  if(PREF.lang&&PREF.lang!=="zh"){
    const L=LANGS[PREF.lang];CURRENT_LANG=PREF.lang;
    if(L){
      const navs=document.querySelectorAll(".nav a");
      L.nav.forEach((t,i)=>{const a=navs[i];if(!a)return;let tn=null;a.childNodes.forEach(n=>{if(n.nodeType===3&&n.textContent.trim())tn=tn||n;});if(tn)tn.textContent=t;});
      const grpMap={zh:["主工作區","郵件往來","文件與學習","營運管理","系統設置"],en:["MAIN WORKSPACE","EMAIL","FILES & LEARN","OPERATIONS","SYSTEM"],cn:["主工作区","邮件往来","文件与学习","营运管理","系统设置"]};
      document.querySelectorAll(".nav .grp").forEach((g,i)=>{if(grpMap[PREF.lang][i])g.textContent=grpMap[PREF.lang][i];});
      const bs=document.querySelector(".brand .bs");if(bs)bs.textContent=L.sub;
      const lb=document.getElementById("langBtn");if(lb)lb.textContent=L.label+" ▾";
      const lo=document.querySelectorAll(".topbar .btn.small");if(lo[0])lo[0].textContent=L.logout;
      render();
    }
  }
})();
</script>
</body>
</html>
