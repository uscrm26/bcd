<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customs-Bond 內部業務管理系統</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23122030'/%3E%3Ctext x='16' y='22' font-size='16' fill='%237cc0ff' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3ECB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1116; --bg2:#141922; --card:#171d28; --card2:#1d2431;
  --line:#232c3b; --txt:#d7dee8; --mut:#8494a7; --dim:#5b6b80;
  --acc:#4a9eff; --acc2:#7cc0ff; --ok:#3fca8a; --warn:#ffb454; --err:#ff5d6c;
  --ind:#4a9eff; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.app{display:flex;min-height:100vh}
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line);z-index:60;align-items:center;gap:10px;padding:0 14px}
.mtop .burger{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mtop .mtitle{font-size:14px;font-weight:700;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .bell2{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer;position:relative}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:55}
.overlay.show{display:block}
.side.open{transform:translateX(0)!important}@media(max-width:900px){
  body{overflow-x:hidden}
  .mtop{display:flex}
  .side{display:none;width:248px;z-index:70;transform:none;transition:none}
  .side.open{display:flex}
  .main{margin-left:0;padding:74px 14px 70px}
  .r4{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:repeat(1,1fr)}
  .form-grid{grid-template-columns:1fr}
  .topbar{display:none}
  .panel{overflow:hidden}
  .em,.mailitem .em{overflow-wrap:anywhere;word-break:break-all}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .funnel{flex-wrap:wrap}
  .search input{min-width:120px}
}
/* sidebar */
.side{width:232px;background:linear-gradient(180deg,#12161e,#10131a);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px 14px;display:flex;flex-direction:column;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d3350,#0e1c2e);border:1px solid #2b4a70;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc2);font-size:16px}
.brand .bt{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand .bs{font-size:10px;color:var(--dim)}
.sideclock{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:10px;line-height:1.9;color:var(--mut)}
.sideclock b{color:var(--txt);font-weight:600}
.sideclock .z{display:flex;align-items:center;gap:6px}.sideclock .z .zem{font-size:12px;flex:0 0 auto}.sideclock .z b{flex:1 1 auto}.sideclock .z span:last-child{font-variant-numeric:tabular-nums}
.nav{flex:1;overflow-y:auto}
.nav .grp{font-size:10px;color:var(--dim);text-transform:none;padding:12px 10px 6px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);font-size:13px;margin-bottom:2px;border:1px solid transparent;transition:.15s}
.nav a:hover{background:var(--bg2);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(74,158,255,.14),transparent);color:var(--acc2);border-color:#29476b}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.nav a .dot{margin-left:auto;background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
.side .foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26334a;color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-row .nm{font-size:12px;color:var(--txt)}
.user-row .rl{font-size:10px;color:var(--dim)}
/* main */
.main{margin-left:232px;flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-bottom:20px}
.topbar .time{font-size:11px;color:var(--mut);margin-right:auto;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.lang{position:relative}
.lang button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.bell{position:relative;background:var(--bg2);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:15px}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:700}
/* headings */
h1{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
/* cards */
.row{display:grid;gap:12px}
.row>*{min-width:0}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .lb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:26px;font-weight:800;color:var(--txt);margin-top:6px}
.stat .tg{font-size:11px;color:var(--ok);margin-top:4px}
.stat .tag2{font-size:11px;color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
/* funnel */
.funnel{display:flex;gap:8px;align-items:flex-end}
.fb{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(74,158,255,.5),rgba(74,158,255,.12));border:1px solid #2b4a70;padding:10px 8px 8px;text-align:center;position:relative}
.fb .fv{font-size:20px;font-weight:800;color:var(--acc2)}
.fb .fl{font-size:10px;color:var(--mut);margin-top:2px}
/* chart ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{--p:70;width:150px;height:150px;position:relative;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#26344a 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .rc{position:relative;font-size:22px;font-weight:800;color:var(--txt)}
.legend{display:grid;gap:8px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* view switch */
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.switch button{padding:7px 16px;background:transparent;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.switch button.on{background:#1e3a5c;color:var(--acc2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--mut);text-align:left;padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a2230;color:var(--txt)}
tr:hover td{background:#1a2130}
/* tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.t-blue{background:rgba(74,158,255,.14);color:var(--acc2);border:1px solid #2b4a70}
.t-green{background:rgba(63,202,138,.14);color:var(--ok);border:1px solid #23583f}
.t-amber{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid #5a4527}
.t-red{background:rgba(255,93,108,.14);color:var(--err);border:1px solid #5a2b34}
.t-gray{background:rgba(132,148,167,.14);color:var(--mut);border:1px solid #333c4c}
/* client card */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;position:relative;display:flex;gap:14px;align-items:flex-start}
.ccard:hover{border-color:#2f4a6e;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cphoto{width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid var(--line);background:#1a2230;display:block}
.ccard .cbody{flex:1;min-width:0}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ccard .no{font-size:11px;color:var(--dim)}
.noref{font-weight:400;font-size:9px;color:var(--mut);margin-left:4px;opacity:.8}
.ccard .nm{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.ccard .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7}
.ccard .meta b{color:var(--txt);font-weight:600}
.ccard .foots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ccard .foots .badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.badge.warn{color:var(--err);border-color:#5a2b34}
/* quick buttons */
.quick{position:absolute;top:12px;right:12px;display:flex;gap:5px;opacity:0;transition:.15s}
.ccard:hover .quick{opacity:1}
.quick button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer}
.quick button:hover{color:var(--acc2);border-color:#2f4a6e}
/* search */
.search{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.search input{flex:1;min-width:200px}
/* button */
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#2f4a6e;color:var(--acc2)}
.btn.primary{background:linear-gradient(135deg,#1e4d80,#17406c);border-color:#2b5a92;color:#e6f0ff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:11px}
/* mail status */
.mailitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #1a2230}
.mailitem:last-child{border-bottom:0}
.mailitem .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mailitem .st.fail{background:var(--err)}
.mailitem .em{font-size:12px;color:var(--txt);flex:1}
.mailitem .nm{font-size:11px;color:var(--mut)}
.mailitem .unread{background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.mailitem .done{color:var(--dim);font-size:11px}
/* log */
.logrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #1a2230;font-size:12px;align-items:flex-start}
.logrow .t{color:var(--dim);white-space:nowrap;font-size:11px}
.logrow .c{color:var(--txt);flex:1}
.logrow .o{color:var(--ok);font-size:11px;white-space:nowrap}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 16px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.field{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #1a2230;font-size:13px;align-items:start}
.field .k{color:var(--mut)}
.field .v{color:var(--txt)}
.field .v.warn{color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px}
.fg textarea{min-height:80px;resize:vertical}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:560px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-size:16px;margin-bottom:16px;color:var(--txt)}
.mbox .mrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* timeline */
.tl{position:relative;margin-left:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#223048}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tli.e-mail::before{background:var(--acc)}
.tli.e-note::before{background:var(--warn)}
.tli.e-auto::before{background:var(--mut)}
.tli.e-doc::before{background:var(--ok)}
.tli .tt{font-size:13px;color:var(--txt);font-weight:600}
.tli .tm{font-size:11px;color:var(--dim);margin-top:2px}
.tli .tx{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.tli .src{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5c;color:#e6f0ff;padding:11px 20px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;display:none;border:1px solid #2b5a92}
.ghgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docbox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit}
.docbox .fi{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.fthumb{cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.fthumb img{width:100%;height:90px;object-fit:cover;display:block}
.fthumb .fcap{font-size:10px;padding:6px 8px;color:var(--mut);word-break:break-all;line-height:1.3;max-height:3.4em;overflow:hidden}
.docbox .fn{font-size:12px;color:var(--txt);flex:1;word-break:break-all}
.docbox .ft{font-size:10px;color:var(--dim)}
.draftbox{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:2;color:var(--txt)}
.sync{display:inline-block;font-size:10px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sync.ok{color:var(--ok);border:1px solid #23583f}
.sync.no{color:var(--warn);border:1px solid #5a4527}
.sync.fail{color:var(--err);border:1px solid #5a2b34}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.hidden{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .25s;width:248px;z-index:70}.main{margin-left:0}.r4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.ccard .foots .tag,.ccard .foots .badge{font-size:10px}.ccard .cphoto{width:60px;height:60px}.ccard .quick button{font-size:10px}}
</style>
<script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<div class="mtop">
  <button class="burger" onclick="toggleSide()">☰</button>

</div>

<div class="app">
<aside class="side">

    <a data-v="doc"><span class="ic">▤</span>文件中心</a>
    <a data-v="archive"><span class="ic">▦</span>歸檔包</a>
    <div class="grp">系統</div>
    <a data-v="github"><span class="ic">⚙</span>GitHub 備份</a>
    <a data-v="system"><span class="ic">◫</span>系統管理</a>

</aside>

</div>
</div>

const PHOTO={

function aiDraft(){

  document.getElementById('aiEN').innerHTML=`<div class="sec-title">Financial Draft EN</div><div class="draftbox">Client ${no} ${cname}<br>Marital Married Filing Separately ｜ Household Income ~\$120k ｜ Assets US middle-class typical<br>Home ~\$400k ｜ Savings ~\$35k ｜ Liabilities auto+mortgage ~\$250k<br>AI draft for reference only, confirm before sending.</div>`;

R.ai=()=>`<h1>AI 表單助手</h1><div class="sub">AI Assistant ｜ AI 產生草稿，人工確認後才入庫</div>

<div class="panel"><div class="sec-title">AI 郵件草稿</div><p style="font-size:12px;color:var(--mut);margin-bottom:12px">選取一封信件，AI 依客戶時間線上下文產生繁中＋英文草稿。</p>

R.doc=()=>`<h1>文件中心</h1><div class="sub">Document Center ｜ 每位客戶全部上傳文件與照片，點圖片預覽、點文件開啟</div>
<div class="search"><input placeholder="搜尋文件名、公司名、法人" oninput="window._df=this.value;renderDoc()"></div>
<div id="docArea"></div>`;
function renderDoc(){
  const q=(window._df||"").toLowerCase();
  const box=document.getElementById("docArea");if(!box)return;
  const groups=DATA.customers.map(c=>({c,list:(DATA.files||{})[c.no]||[]}))
    .filter(g=>!q||(g.c.no+g.c.name+g.c.member+g.list.map(f=>f.name).join(" ")).toLowerCase().includes(q));
  const pub=(DATA.files||{})["_public"]||[];
  const block=g=>{
    const imgs=g.list.filter(f=>f.type==="image"),docs=g.list.filter(f=>f.type!=="image");
    return `<div class="panel"><div class="sec-title">內部參考 #${g.c.no} ｜ ${esc(g.c.name)} <span style="font-weight:400;color:var(--mut)">法人 ${esc(g.c.member)} ｜ ${g.list.length} 份</span></div>
    ${imgs.length?`<div class="fgrid">${imgs.map(fileThumb).join("")}</div>`:""}
    <div class="row r2">${docs.map(fileThumb).join("")||"<div class='empty'>無文件</div>"}</div></div>`;
  };
  box.innerHTML=`<div class="row r2">${groups.map(block).join("")||"<div class='empty'>無符合文件</div>"}
  ${pub.length?`<div class="panel"><div class="sec-title">公共附件（開發信樣本、表單、帳戶文件）</div><div class="row r2">${pub.map(fileThumb).join("")}</div></div>`:""}</div>`;
}

function saveSettings(){const v=Number(document.getElementById("set_cutoff").value);if(v>=0&&v<=23){SETTINGS.cutoff_hour=v;addAudit("修改系統設定","切日時間改為 "+v);render();toast("設定已儲存，全系統統計邏輯更新");}}
