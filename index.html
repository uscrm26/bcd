doc("UCRM Terms of Service",`<p style="text-align:center;color:#666;font-size:12px;margin-bottom:24px">Version v1.0 · Effective: November 2026</p>
<h3 style="color:#1a3a6b">Article 1. Scope</h3><p>These Terms of Service ("Terms") apply to all users of the UCRM system ("System"). By logging into the System, the user is deemed to have read, understood, and agreed to be bound by these Terms.</p>
<h3 style="color:#1a3a6b">Article 2. Acceptable Use</h3><p>While using the System, users must comply with the following rules:</p>
<p>(a) <b>No Screenshots or Leaks</b>: Without written authorization, users may not screenshot, screen-record, photograph, or otherwise transmit any system screens, data, reports, or client information to any third party outside the System.</p>
<p>(b) <b>No System Disruption</b>: Users may not disrupt, damage, or interfere with System operations, nor attempt unauthorized access, modification, deletion of, or attacks on the System servers or database. Users may not exploit System vulnerabilities for improper gain.</p>
<p>(c) <b>No Technical Scraping</b>: Users may not use any technical means, including but not limited to web crawlers, packet sniffers, reverse engineering, or automated scripts, to bulk-download or copy client data, emails, files, or financial records from the System.</p>
<p>(d) <b>No Illegal Use</b>: Users may not use the System for any activity that violates the laws of the People's Republic of China, nor perform unauthorized actions on behalf of third parties.</p>
<p>(e) <b>Account Security</b>: Users must keep their credentials secure and may not share accounts. The user is fully responsible for any consequences arising from password disclosure.</p>
<h3 style="color:#1a3a6b">Article 3. Accounts and Permissions</h3><p>The System administrator may assign or adjust user permissions based on operational needs. Users may only view and operate data within their assigned permissions and may not attempt to access other users' or other clients' data.</p>
<h3 style="color:#1a3a6b">Article 4. Violations</h3><p>If a user is found to have violated these Terms, the administrator may immediately suspend or terminate the account. Serious violations may be referred to judicial authorities under Article 285 (Illegal Intrusion into Computer Information Systems) and Article 286 (Damage to Computer Information Systems) of the Criminal Law of the PRC, and the Cybersecurity Law of the PRC.</p>
<h3 style="color:#1a3a6b">Article 5. Governing Law</h3><p>These Terms are governed by the laws of the People's Republic of China. Disputes shall first be resolved through negotiation; if unsuccessful, either party may bring proceedings in the people's court with jurisdiction over the System operator.</p>`),
doc("UCRM Privacy Policy",`<p style="text-align:center;color:#666;font-size:12px;margin-bottom:24px">Version v1.0 · Effective: November 2026</p>
<h3 style="color:#1a3a6b">Article 1. Data Collection</h3><p>To ensure System operation and security auditing, the System automatically collects and records the following data. All data is uploaded to encrypted cloud servers located within the territory of the People's Republic of China:</p>
<p>(a) User login and logout times, IP addresses, and geolocation information.</p>
<p>(b) All user actions within the System, including viewing, editing, deleting, sending emails, uploading files, and downloading attachments.</p>
<p>(c) Usage behavior data, such as browsing paths, click patterns, and page dwell time.</p>
<p>The above data is used for AI analysis and system improvement.</p>
<h3 style="color:#1a3a6b">Article 2. Legal Basis</h3><p>This System collects and processes user data in accordance with the Personal Information Protection Law of the PRC, the Data Security Law of the PRC, and the Cybersecurity Law of the PRC.</p>
<h3 style="color:#1a3a6b">Article 3. Confidentiality Commitment</h3><p>We commit that collected user behavior data is used solely for internal operational analysis and system improvement, and will not be provided to any third party for commercial purposes or external work analysis.</p>
<h3 style="color:#1a3a6b">Article 4. Implied Consent</h3><p>By logging into the System, the user is deemed to have read, understood, and agreed to this Policy in full. If the user does not agree, they must immediately stop using the System and contact the administrator to close the account.</p>
<h3 style="color:#1a3a6b">Article 5. User Rights</h3><p>Under Articles 44 to 50 of the Personal Information Protection Law of the PRC, users have the right to access, copy, correct, and delete their personal information, and to withdraw consent. To exercise these rights, please contact the System administrator.</p>`),
doc("UCRM Client Confidentiality Agreement",`<p style="text-align:center;color:#666;font-size:12px;margin-bottom:24px">Version v1.0 · Effective: November 2026</p>
<h3 style="color:#1a3a6b">Article 1. Confidentiality Obligation</h3><p>All client data encountered while using the System, including but not limited to company names, owner names, EIN tax IDs, contact information, financial data, passport and driver's license photos, and banking information, is strictly confidential business information.</p>
<h3 style="color:#1a3a6b">Article 2. Prohibition on Disclosure</h3><p>Users may not disseminate client data in any form, including but not limited to:</p>
<p>(a) Screenshotting, screen-recording, or photographing client data and sending it outside the System.</p>
<p>(b) Disclosing client data to anyone outside the System verbally, in writing, by email, or via instant messaging.</p>
<p>(c) Copying or downloading client data to unencrypted local devices or servers for storage.</p>
<h3 style="color:#1a3a6b">Article 3. Storage Standards</h3><p>Client data may only be stored on the System's encrypted cloud servers. Users may not save client data to unencrypted local computers, USB drives, personal cloud storage, or public clouds, as this may violate Articles 10 and 51 of the Personal Information Protection Law of the PRC. Users bear the corresponding legal liability.</p>
<h3 style="color:#1a3a6b">Article 4. Liability for Breach</h3><p>If a user breaches this Agreement and causes client data to be leaked, the breaching party shall bear full legal liability and compensation for all resulting damages under Article 66 of the Personal Information Protection Law of the PRC. Where the breach constitutes a crime, criminal liability shall be pursued under Article 253-1 of the Criminal Law of the PRC (Infringement of Citizens' Personal Information).</p>`)

function auditRow(a){return `<div style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-size:13px">
 <span style="color:var(--mut);font-size:11px;min-width:90px;font-variant-numeric:tabular-nums">${a.t}</span>
 <span style="flex:1;line-height:1.6"><span style="font-weight:600">${esc(a.user)}</span> ${esc(a.detail||a.action)}</span></div>`;}
function filterAudit(f){const list=auditLog.filter(a=>!f||(a.action+a.detail).includes(f));document.getElementById("auditArea").innerHTML=list.slice(0,100).map(a=>auditRow(a)).join("")||"<div class='empty'>無符合記錄</div>";}
function filterAuditByUser(u){const list=u?auditLog.filter(a=>a.user===u):auditLog;document.getElementById("auditArea").innerHTML=list.slice(0,100).map(a=>auditRow(a)).join("")||"<div class='empty'>無符合記錄</div>";}
function exportAuditXlsx(){if(CURRENT_USER.role!=="super_admin"){toast("僅超管可匯出審計");return;}
const head=["時間","操作人","動作","詳情"];const rows=auditLog.map(a=>[a.t,a.user,a.action,a.detail||""]);
if(typeof XLSX!=="undefined"){const ws=XLSX.utils.aoa_to_sheet([head,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"審計日誌");XLSX.writeFile(wb,"審計日誌_"+new Date().toISOString().slice(0,10)+".xlsx");toast("審計日誌已匯出 Excel");}
else{const csv="\ufeff"+[head,...rows].map(r=>r.map(x=>`"${String(x||"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="審計日誌.csv";a.click();toast("已匯出 CSV");}}

const roleOpts=canSuper?[["super_admin","超級管理員"],["supervisor","主管"],["operator","業務員"]]:[["operator","業務員"]];

async function saveUser(){const id=document.getElementById("au_user").value.trim();const nm=document.getElementById("au_name").value.trim();if(!id||!nm){toast("請填登入帳號與真實姓名");return;}
const role=document.getElementById("au_role").value;const parent=document.getElementById("au_parent").value||null;const pwd=document.getElementById("au_pwd").value;const avatar=document.getElementById("au_avatar").value.trim()||nm.charAt(0);
const perms={};Object.keys(PERM_LABELS).forEach(k=>{const el=document.getElementById("au_p_"+k);perms[k]=el?el.checked:false;});
if(_editUid){const u=USERS.find(x=>x.id===_editUid);u.nm=nm;u.role=role;u.parent=parent;u.avatar=avatar;u.perms=perms;if(pwd)u.pwd=pwd;syncUserToDB(u);addAudit("編輯帳戶",nm);}
else{if(USERS.some(x=>x.id===id)){toast("帳號已存在");return;}const row={id,nm,pwd:pwd||"0000",role,parent,active:true,lastLogin:"",avatar,perms};USERS.push(row);
  const res=await sbReq("accounts","POST",{id,display_name:nm,pin:String(pwd||"0000"),role:dbRoleOf(role),parent_id:parent||null,active:true,avatar_url:avatar||null});
  if(res===null)toast("注意：後台未開新帳號寫入權限，本帳號僅本機生效");
  addAudit("新增帳戶",nm);}
closeModal();render();toast("帳戶已儲存");}

<div class="sec-title">本人操作記錄（${mineAudit.length}）</div>
${mineAudit.length?mineAudit.slice(0,12).map(a=>`<div class="logrow"><span class="t">${a.t}</span><span class="c">${esc(a.action)} ${esc(a.detail)}</span></div>`).join(""):"<div class='empty'>尚無操作記錄</div>"}
<div class="mrow"><button class="btn" onclick="closeModal()">關閉</button></div>`);}
