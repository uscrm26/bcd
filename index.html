<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCRM｜美國進口客戶關係管理系統</title>
<link rel="icon" href="favicon-32.png">
<style>
:root{
  --bg:#0e1116; --bg2:#141922; --card:#171d28; --card2:#1d2431;
  --line:#232c3b; --txt:#d7dee8; --mut:#8494a7; --dim:#5b6b80;
  --acc:#4a9eff; --acc2:#7cc0ff; --ok:#3fca8a; --warn:#ffb454; --err:#ff5d6c;
  --ind:#4a9eff; --radius:12px;
}
body[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f8;
  --line:#d8e0ec; --txt:#1c2733; --mut:#5d6f84; --dim:#94a3b5;
  --acc:#1f6fe0; --acc2:#3b8bf5; --ok:#18a05f; --warn:#d98a16; --err:#d83a4b;
  --ind:#1f6fe0;
}
body[data-theme="light"] .side{background:linear-gradient(180deg,#ffffff,#f0f4fa);border-right:1px solid var(--line)}
body[data-theme="light"] .brand .logo{background:linear-gradient(135deg,#dce9fb,#eaf2fc);border-color:#bcd4f5;color:var(--acc)}
body[data-theme="light"] .mtop{background:rgba(255,255,255,.95)}
/* language dropdown */
.lang{position:relative}
.lang .menu{display:none;position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;overflow:hidden;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lang .menu.show{display:block}
.lang .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:10px 14px;font-size:13px;cursor:pointer}
.lang .menu button:hover{background:var(--card2)}
/* notification drawer */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:90;transition:right .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
.drawer.show{right:0}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:10px}
.drawer .dgroup{font-size:11px;color:var(--dim);padding:8px 8px 4px;letter-spacing:.05em}
.drawer .ditem{display:flex;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:var(--card2)}
.drawer .ditem.unread{box-shadow:inset 3px 0 0 var(--err)}
.drawer .ditem .who{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--ind);border-radius:6px;padding:2px 7px;height:fit-content}
.drawer .ditem .tx{flex:1;min-width:0}
.drawer .ditem .tt{font-size:13px;line-height:1.4}
.drawer .ditem .tm{font-size:11px;color:var(--dim);margin-top:2px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.app{display:flex;min-height:100vh}
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line);z-index:60;align-items:center;gap:10px;padding:0 14px}
.mtop .burger{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mtop .mtitle{font-size:14px;font-weight:700;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .bell2{background:var(--bg2);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer;position:relative}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:55}
.overlay.show{display:block}
.side.open{transform:translateX(0)!important}@media(max-width:900px){
  body{overflow-x:hidden}
  .mtop{display:flex}
  .side{display:none;width:248px;z-index:70;transform:none;transition:none}
  .side.open{display:flex}
  .main{margin-left:0;padding:74px 14px 70px}
  .r4{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:repeat(1,1fr)}
  .form-grid{grid-template-columns:1fr}
  .topbar{display:none}
  .panel{overflow:hidden}
  .em,.mailitem .em{overflow-wrap:anywhere;word-break:break-all}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .funnel{flex-wrap:wrap}
  .search input{min-width:120px}
}
/* sidebar */
.side{width:232px;background:linear-gradient(180deg,#12161e,#10131a);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px 14px;display:flex;flex-direction:column;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d3350,#0e1c2e);border:1px solid #2b4a70;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc2);font-size:16px}
.brand .logo-img{height:32px;width:auto;border-radius:8px;object-fit:contain;flex:0 0 auto}
.brand .bt{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand .bs{font-size:10px;color:var(--dim)}
.sideclock{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:10px;line-height:1.9;color:var(--mut)}
.sideclock b{color:var(--txt);font-weight:600}
.sideclock .z{display:flex;align-items:center;gap:6px}.sideclock .z .zem{font-size:12px;flex:0 0 auto}.sideclock .z b{flex:1 1 auto}.sideclock .z span:last-child{font-variant-numeric:tabular-nums}
.nav{flex:1;overflow-y:auto}
.nav .grp{font-size:10px;color:var(--dim);text-transform:none;padding:12px 10px 6px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);font-size:13px;margin-bottom:2px;border:1px solid transparent;transition:.15s}
.nav a:hover{background:var(--bg2);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(74,158,255,.14),transparent);color:var(--acc2);border-color:#29476b}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.nav a .dot{margin-left:auto;background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
.side .foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26334a;color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-row .nm{font-size:12px;color:var(--txt)}
.user-row .rl{font-size:10px;color:var(--dim)}
/* main */
.main{margin-left:232px;flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-bottom:20px}
.topbar .time{font-size:11px;color:var(--mut);margin-right:auto;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.lang{position:relative}
.lang button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.bell{position:relative;background:var(--bg2);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:15px}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:700}
/* headings */
h1{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
/* cards */
.row{display:grid;gap:12px}
.row>*{min-width:0}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .lb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:26px;font-weight:800;color:var(--txt);margin-top:6px}
.stat .tg{font-size:11px;color:var(--ok);margin-top:4px}
.stat .tag2{font-size:11px;color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
/* funnel */
.funnel{display:flex;gap:8px;align-items:flex-end}
.fb{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(74,158,255,.5),rgba(74,158,255,.12));border:1px solid #2b4a70;padding:10px 8px 8px;text-align:center;position:relative}
.fb .fv{font-size:20px;font-weight:800;color:var(--acc2)}
.fb .fl{font-size:10px;color:var(--mut);margin-top:2px}
/* chart ring */
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{--p:70;width:150px;height:150px;position:relative;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#26344a 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .rc{position:relative;font-size:22px;font-weight:800;color:var(--txt)}
.legend{display:grid;gap:8px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* view switch */
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.switch button{padding:7px 16px;background:transparent;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.switch button.on{background:#1e3a5c;color:var(--acc2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--mut);text-align:left;padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a2230;color:var(--txt)}
tr:hover td{background:#1a2130}
/* tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.t-blue{background:rgba(74,158,255,.14);color:var(--acc2);border:1px solid #2b4a70}
.t-green{background:rgba(63,202,138,.14);color:var(--ok);border:1px solid #23583f}
.t-amber{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid #5a4527}
.t-red{background:rgba(255,93,108,.14);color:var(--err);border:1px solid #5a2b34}
.t-gray{background:rgba(132,148,167,.14);color:var(--mut);border:1px solid #333c4c}
/* client card */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;position:relative;display:flex;gap:14px;align-items:stretch}
.ccard:hover{border-color:#2f4a6e;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cphoto{width:100px;align-self:stretch;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid var(--line);background:#1a2230;display:block}
.ccard .cbody{flex:1;min-width:0;padding-bottom:34px;position:relative}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ccard .no{font-size:11px;color:var(--dim)}
.noref{font-weight:400;font-size:9px;color:var(--mut);margin-left:4px;opacity:.8}
.ccard .nm{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.ccard .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7}
.ccard .meta b{color:var(--txt);font-weight:600}
.ccard .foots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ccard .foots .badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.badge.warn{color:var(--err);border-color:#5a2b34}
/* quick buttons */
.quick{position:absolute;bottom:8px;right:10px;display:flex;gap:5px;flex-wrap:wrap;opacity:0;transition:.15s;z-index:2}
.ccard:hover .quick{opacity:1}
.quick button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer}
.quick button:hover{color:var(--acc2);border-color:#2f4a6e}
/* search */
.search{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search input,.search select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.search input{flex:1;min-width:200px}
/* button */
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#2f4a6e;color:var(--acc2)}
.btn.primary{background:linear-gradient(135deg,#1e4d80,#17406c);border-color:#2b5a92;color:#e6f0ff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:11px}
/* mail status */
.mailitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #1a2230}
.mailitem:last-child{border-bottom:0}
.mailitem .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mailitem .st.fail{background:var(--err)}
.mailitem .em{font-size:12px;color:var(--txt);flex:1}
.mailitem .nm{font-size:11px;color:var(--mut)}
.mailitem .unread{background:var(--err);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.mailitem .done{color:var(--dim);font-size:11px}
/* log */
.logrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #1a2230;font-size:12px;align-items:flex-start}
.logrow .t{color:var(--dim);white-space:nowrap;font-size:11px}
.logrow .c{color:var(--txt);flex:1}
.logrow .o{color:var(--ok);font-size:11px;white-space:nowrap}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 16px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.field{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #1a2230;font-size:13px;align-items:start}
.field .k{color:var(--mut)}
.field .v{color:var(--txt)}
.field .v.warn{color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px}
.fg textarea{min-height:80px;resize:vertical}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:560px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-size:16px;margin-bottom:16px;color:var(--txt)}
.mbox .mrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* timeline */
.tl{position:relative;margin-left:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#223048}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tli.e-mail::before{background:var(--acc)}
.tli.e-note::before{background:var(--warn)}
.tli.e-auto::before{background:var(--mut)}
.tli.e-doc::before{background:var(--ok)}
.tli .tt{font-size:13px;color:var(--txt);font-weight:600}
.tli .tm{font-size:11px;color:var(--dim);margin-top:2px}
.tli .tx{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.tli .src{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5c;color:#e6f0ff;padding:11px 20px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;display:none;border:1px solid #2b5a92}
.ghgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docbox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit}
.docbox .fi{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.fthumb{cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.fthumb img{width:100%;height:90px;object-fit:cover;display:block}
.fthumb .fcap{font-size:10px;padding:6px 8px;color:var(--mut);word-break:break-all;line-height:1.3;max-height:3.4em;overflow:hidden}
.docbox .fn{font-size:12px;color:var(--txt);flex:1;word-break:break-all}
.docbox .ft{font-size:10px;color:var(--dim)}
.draftbox{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:2;color:var(--txt)}
.sync{display:inline-block;font-size:10px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sync.ok{color:var(--ok);border:1px solid #23583f}
.sync.no{color:var(--warn);border:1px solid #5a4527}
.sync.fail{color:var(--err);border:1px solid #5a2b34}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.hidden{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .25s;width:248px;z-index:70}.main{margin-left:0}.r4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.ccard .foots .tag,.ccard .foots .badge{font-size:10px}.ccard .cphoto{width:60px;height:60px}.ccard .quick button{font-size:10px}}
/* ===== 登入頁 ===== */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,rgba(74,158,255,.18),transparent),var(--bg);padding:20px}
#loginScreen.hide{display:none}
.login-card{width:380px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
.login-card input{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:14px;outline:none}
.login-card input:focus{border-color:var(--acc)}
.login-btn{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.login-err{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
.login-foot{text-align:center;color:var(--dim);font-size:11px;margin-top:18px}

async function sbReq(table,method,body,query){

    if(body)opt.body=JSON.stringify(body);

  const acc=await sbReq("accounts","GET",null,"?select=*");
  if(Array.isArray(acc)&&acc.length){
    acc.forEach(r=>{
      const fr=r.role==="admin"?"super_admin":r.role==="supervisor"?"supervisor":"operator";
      const exist=USERS.find(x=>x.id===r.id);
      const row={id:r.id,nm:r.display_name||r.id,pwd:String(r.pin||"0000"),role:fr,parent:r.parent_id||null,active:r.active!==false,lastLogin:"",avatar:(r.display_name||"X").charAt(0).toUpperCase(),perms:exist?exist.perms:{dashboard:true,customer:true,broker:true,ai:true,queue:true,doc:true,archive:true,github:fr==="super_admin",system:fr==="super_admin"}};
      if(exist)Object.assign(exist,row,{perms:exist.perms});else USERS.push(row);
    });
  }
  const own=await sbReq("client_ownership","GET",null,"?select=*");
  if(Array.isArray(own)){
    const KEY2NO={};Object.entries(NO2KEY).forEach(([n,k])=>KEY2NO[k]=n);
    own.forEach(r=>{
      const no=KEY2NO[r.client_key];if(!no)return;
      const c=DATA.customers.find(x=>x.no===no);
      if(c&&r.status){const s=DATA.statuses.find(x=>x.lb===r.status);if(s)c.status=s.id;}
      if(r.owner)ownerMap[no]=r.owner;
    });
  }
  const dl=await sbReq("deals","GET",null,"?select=*&order=closed_at.desc");
  if(Array.isArray(dl)){commissions.splice(0,commissions.length);dl.forEach(d=>commissions.push({cust:"",user:d.owner,amount:d.amount,mode:d.note,t:d.closed_at}));}
  const al=await sbReq("audit_logs","GET",null,"?select=*&order=created_at.desc&limit=500");
  if(Array.isArray(al)){
    auditLog.splice(0,auditLog.length);
    DATA.timeline=DATA.timeline||{};clientAudit=clientAudit||{};
    al.forEach(a=>{
      if(a.action==="timeline"&&a.target_client){
        try{const item=JSON.parse(a.detail);DATA.timeline[a.target_client]=DATA.timeline[a.target_client]||[];if(!DATA.timeline[a.target_client].some(x=>x.key===item.key))DATA.timeline[a.target_client].unshift(item);}catch(e){}
      }else if(a.action==="client_audit"&&a.target_client){
        try{const rec=JSON.parse(a.detail);clientAudit[a.target_client]=clientAudit[a.target_client]||[];clientAudit[a.target_client].unshift(rec);}catch(e){}
      }else if(a.action==="cust_state"&&a.target_client){const c=DATA.customers.find(x=>String(x.no)===String(a.target_client));if(c){try{const st=JSON.parse(a.detail);if(st.aiTodos)c.aiTodos=st.aiTodos;if(st.aiSuggestions)c.aiSuggestions=st.aiSuggestions;if(st.aiLastAt)c.aiLastAt=st.aiLastAt;}catch(e){}}
      }else if(a.action==="ai_todo_add"&&a.target_client){
        const c=DATA.customers.find(x=>String(x.no)===String(a.target_client));if(c){try{const rec=JSON.parse(a.detail);c.aiTodos=c.aiTodos||[];if(!c.aiTodos.some(t=>t.t===rec.t))c.aiTodos.unshift(rec);}catch(e){}}
      }else if(a.action==="ai_last_at"&&a.target_client){
        const c=DATA.customers.find(x=>String(x.no)===String(a.target_client));if(c)c.aiLastAt=parseInt(a.detail);
      }
      auditLog.push({t:a.created_at,user:a.display_name,action:a.action,detail:a.detail,target:a.target_client||""});
    });
  }
  render();
}

let _enKeys=null;
function applyLangText(){
  if(!_enKeys)_enKeys=Object.keys(ENMAP).sort((a,b)=>b.length-a.length);
  document.querySelectorAll("#view [placeholder]").forEach(e=>{const p=e.placeholder.trim();if(ENMAP[p])e.placeholder=ENMAP[p];});
  // 只替换叶子元素，保留 DOM 结构；叶子内中文短语按字典子串替换
  document.querySelectorAll("#view").forEach(root=>{
    root.querySelectorAll("*").forEach(e=>{
      if(e.children.length>0)return;
      let t=e.textContent;if(!t||!t.trim())return;let out=t;
      _enKeys.forEach(k=>{if(out.includes(k))out=out.split(k).join(ENMAP[k]);});
      if(out!==t)e.textContent=out;
    });
  });
}

function enMap(s){if(!s)return s;if(EN[s.trim()])return EN[s.trim()];let out=s;Object.keys(EN).sort((a,b)=>b.length-a.length).forEach(k=>{if(out.includes(k))out=out.split(k).join(EN[k]);});return out;}
function applyLangText(){if(CURRENT_LANG!=="en")return;[document.getElementById("view"),document.getElementById("modal")].forEach(root=>{if(!root)return;root.querySelectorAll("*").forEach(el=>{if(el.children.length===0){const t=el.textContent;if(t&&t.trim()){const tr=enMap(t);if(tr!==t)el.textContent=tr;}}if(el.placeholder){const p=enMap(el.placeholder);if(p!==el.placeholder)el.placeholder=p;}});});}

// 從來信寄件人抽公司/名稱顯示
function brokerCo(from){
  const m=(from||"").match(/^\s*"?([^"<]+?)"?\s*<([^>]+)>\s*$/);
  if(m)return m[1].trim();
  const em=(from||"").match(/([\w.-]+)@([\w.-]+)/);
  return em?em[2].replace(/\.[a-z]+$/i,""):from;
}
// 掃描未讀來信，為歸屬自己的客戶自動生成通知（去重）
function syncMailNotifs(){
  if(!Array.isArray(DATA.emails))return;
  const seen=new Set(NOTIFS.filter(n=>n._key).map(n=>n._key));
  DATA.emails.forEach(e=>{
    if(!e.unread)return;
    if(!canViewMail(e))return;
    const key="mail:"+(e.sub||"")+"|"+(e.from||"");
    if(seen.has(key))return;
    seen.add(key);
    const cust=mailOwnerClient(e);
    const co=brokerCo(e.from);
    NOTIFS.unshift({who:cust?ownerName(cust.no):"系統",txt:`${cust?cust.name+" ":""}收到 ${co} 的來信：${e.sub}`,t:nowBJ(),unread:true,goto:"queue",_key:key});
  });
}

function hoursSince(tm){
  const m=String(tm).match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return 999;
  const now=new Date();const bj=new Date(now.getTime()+8*3600e3);
  const curMin=(bj.getUTCMonth()+1)*372+bj.getUTCDate()*1440+bj.getUTCHours()*60+bj.getUTCMinutes();
  const thatMin=(+m[1])*372+(+m[2])*1440+(+m[3])*60+(+m[4]);
  return (curMin-thatMin)/60;
}

function followUpAlerts(){
  const rows=[];
  DATA.customers.forEach(c=>{
    if(["hold","reject","done"].includes(c.status))return;
    const tl=(DATA.timeline||{})[c.no]||[];
    let last=tl[0]?tl[0].tm:"";
    if(!last){const cd=CUST_CREATED[c.no]||"10/31";last=cd+" 12:00";}
    const h=hoursSince(last);
    const isNewMail=(DATA.emails||[]).some(e=>e.unread&&e.c===c.name.split(" ")[0]);
    rows.push({c,h,newMail:isNewMail,last:tl[0]});
  });
  rows.sort((a,b)=>b.h-a.h);
  const top=rows.slice(0,10);
  return `<div style="font-size:11px;color:var(--mut);margin:6px 0 10px">最久未跟進前 10 名</div>`+top.map((r,i)=>{
    const ph=PHOTO[r.c.no]||"";
    const lastTxt=r.last?((r.last.e==="email"?"📧 ":"")+esc(r.last.tt||"")):"尚無更新（依新增時間起算）";
    return `<div onclick="openCust('${r.c.no}')" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg2)">
      <span style="font-size:11px;color:var(--dim);width:16px">${i+1}</span>
      <img src="${ph}" onerror="this.style.display='none'" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0">
      <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;color:var(--tx)">${esc(r.c.name)}</div>
      <div style="font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lastTxt}</div></div>
      <span style="font-size:10px;color:${r.h>40?"var(--err)":"var(--warn)"};flex-shrink:0">${Math.round(r.h)}h</span></div>`;}).join("");
}
function statusPie(){
 const rows=[
  ["var(--acc)","處理中",countBy("new")+countBy("collect")+countBy("form")+countBy("submit")],
  ["var(--ok)","已出單",countBy("done")],

 ];
 const total=rows.reduce((a,r)=>a+r[2],0)||1;

   const len=r[2]/total*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${r[0]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len;return s;}).join("");

 <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">${segs}<text x="70" y="66" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">${total}</text><text x="70" y="84" text-anchor="middle" fill="#8b95a7" font-size="10">總客戶</text></svg>

 </div>${followUpAlerts()}`;}

async function onNewCustFiles(input){
  const files=input.files;if(!files.length)return;
  const no=(document.getElementById("nc_no")||{}).value||"new";
  toast("上傳 "+files.length+" 個檔案到 GitHub...");
  for(const f of Array.from(files)){
    try{
      const buf=await f.arrayBuffer();
      const base64=btoa(String.fromCharCode(...new Uint8Array(buf)));
      const path="attachments/"+no+"/"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const r=await fetch("https://api.github.com/repos/uscrm26/bcd/contents/"+path,{
        method:"PUT",
        headers:{Authorization:"token "+(localStorage.getItem("bcd_ghtok")||""),"Content-Type":"application/json"},
        body:JSON.stringify({message:"upload "+f.name,content:base64})
      });
      if(r.ok)toast("已上傳："+f.name);
      else toast("上傳失敗："+f.name);
      // 交 AI 分析
      const out=await callAI("你是美國海關bond業務助理。根據檔案名稱和類型，判斷文件類別，提取公司名、法人名、EIN、地址等信息，輸出JSON：{company,member,ein,address,doc_type,notes}",f.name);
      try{
        const j=JSON.parse(out.replace(/```json|```/g,"").trim());
        if(j.company&&!document.getElementById("nc_name").value)document.getElementById("nc_name").value=j.company;
        if(j.member)document.getElementById("nc_member").value=j.member;
        if(j.ein)document.getElementById("nc_ein").value=j.ein;
      }catch(e){}
    }catch(e){toast("錯誤："+f.name);}
  }
  toast("全部完成，AI 已自動填入客戶資料");
}

function aiStatusCard(ts){
  const d=new Date(ts);
  const bj=new Date(ts+8*3600e3);
  const pad=n=>String(n).padStart(2,"0");
  const timeStr=bj.getFullYear()+"-"+pad(bj.getMonth()+1)+"-"+pad(bj.getDate())+" "+pad(bj.getHours())+":"+pad(bj.getMinutes())+":"+pad(bj.getSeconds());
  const diff=Date.now()-ts;
  const mins=Math.floor(diff/60000);
  let ago;
  if(mins<1)ago="剛才";else if(mins<60)ago=mins+" 分鐘前";else if(mins<1440)ago=Math.floor(mins/60)+" 小時前";else ago=Math.floor(mins/1440)+" 天前";
  if(CURRENT_LANG==='en'){return "Last AI analysis: "+timeStr+" (CST)<br>"+ago+" ago.";}
  if(CURRENT_LANG==='cn'){return "最后一次 AI 分析时间："+timeStr+"（北京时间）<br>距今已过"+ago+"。";}
  return "最後一次 AI 分析時間："+timeStr+"（北京時間）<br>距今已過"+ago+"。";
}

    box.innerHTML=(imgs.length?`<div class="fgrid">${imgs.map(thumb).join("")}</div>`:"")+`<div class="row r2">${docs.map(thumb).join("")||""}</div>`;

  const cust=DATA.customers.find(x=>x.name&&(x.name===cname||x.name.startsWith(cname)||(cname&&x.name.includes(cname))));

  const recv=(DATA.emails||[]).filter(x=>x.c===cname).sort((a,b)=>a.t.localeCompare(b.t));

  // 3. 歷史外發：sent_log 中 to 是本次發件人域名，或 from 是本客戶信箱
  const custMail=cust?cust.mail:"";
  const brokerDomain=((e.from||"").split("@")[1]||"").toLowerCase();
  const sent=(DATA.sent||[]).filter(s=>{
    const toDom=((s.to||"").split("@")[1]||"").toLowerCase();
    return (brokerDomain&&toDom===brokerDomain)||(custMail&&(s.from||"").toLowerCase()===custMail.toLowerCase());
  });
  if(sent.length){
    lines.push("");
    lines.push("【我方過去寄出的相關郵件】");
    sent.slice(-12).forEach(s=>{
      lines.push("- [我方寄出] to: "+(s.to||"")+"｜主旨："+(s.subject||"")+"｜摘："+(s.body||"").slice(0,150).replace(/\s+/g," "));
    });
  }
  return lines.join("\n");
}
function fmtUSfromBJ(t){
  const m=t.match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return t;
  let mo=+m[1],da=+m[2],h=+m[3],mi=+m[4];
  const bjMin=((mo)*372)+da*1440+h*60+mi;
  const usMin=bjMin-13*60; // 北京 UTC+8，美國東岸冬令時 UTC-5，差13h
  const usH=Math.floor(usMin/60)%24, usD=Math.floor(usMin/1440);
  const ampm=usH<12?"AM":"PM";const h12=((usH%12)||12);
  return `${mo}/${da} ${String(h12).padStart(2,"0")}:${String(mi).padStart(2,"0")} ${ampm} ET（${usD-da<0?"前一天":""}美國東岸）`;
}

function batchDayKey(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let dk;
  if(bj.getUTCHours()<cutHour){const y=new Date(bj.getTime()-86400e3);dk=y.getUTCFullYear()+"-"+(y.getUTCMonth()+1)+"-"+y.getUTCDate();}
  else dk=bj.getUTCFullYear()+"-"+(bj.getUTCMonth()+1)+"-"+bj.getUTCDate();
  return dk;
}
function batchResetCountdown(){
  const bj=new Date(Date.now()+8*3600e3);
  const cutHour=5;
  let nextReset=new Date(bj);
  nextReset.setUTCHours(cutHour,0,0,0);
  if(bj.getUTCHours()>=cutHour) nextReset=new Date(nextReset.getTime()+86400e3);
  let diff=nextReset.getTime()-bj.getTime();
  if(diff<0) diff=0;
  const h=Math.floor(diff/3600e3),m=Math.floor((diff%3600e3)/60e3),s=Math.floor((diff%60e3)/1000);
  return h+" 小時 "+m+" 分 "+s+" 秒";
}

async function runBatchAI(){
  const nos=[...arguments];
  const btn=document.getElementById("batchStartBtn");
  const pauseBtn=document.getElementById("batchPauseBtn");
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> 分析中…';
  if(pauseBtn){pauseBtn.style.display="inline-block";pauseBtn.textContent="⏸ 暫停分析";}
  window._batchPaused=false;
  window._batchResults=window._batchResults||[];
  const doneNos=window._batchResults.map(r=>r.no);
  const todoNos=nos.filter(n=>!doneNos.includes(n));
  const total=nos.length;
  for(let i=0;i<todoNos.length;i++){
    if(window._batchPaused){
      if(pauseBtn)pauseBtn.textContent="▶ 繼續分析";
      btn.innerHTML="已暫停";
      break;
    }
    const no=todoNos[i];
    const row=document.getElementById("batch_"+no);
    if(row){row.firstChild.innerHTML='<span class="spinner" style="width:14px;height:14px;border:2px solid rgba(139,92,246,.3);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;display:inline-block"></span>';row.style.background="rgba(139,92,246,.08)";}
    try{
      const cust=DATA.customers.find(x=>x.no===no);
      const mails=recentMailsForCustomer(cust,7);
      const files=((DATA.files||{})[no]||[]).map(f=>f.name||f.nm).slice(0,10);
      const ctx="客戶："+cust.name+"，法人="+cust.member+"，狀態="+st(cust.status).lb+"，信箱="+cust.mail+"\n附件："+(files.join("、")||"無")+"\n最近 7 天郵件：\n"+(mails.slice(0,5).map(m=>m.t+" "+m.from+"｜"+m.sub+"\n"+(m.body||"").slice(0,300)).join("\n\n")||"無");
      const sys=`你是美國海關 bond 業務顧問。精簡分析這個客戶目前狀態，輸出 JSON：{"summary_zh":"繁體一句話","summary_cn":"簡體一句話","summary_en":"English one line","next_actions":["繁中待辦1","繁中待辦2"]}。不要輸出其他內容。`;
      const out=await callAI(sys,ctx);
      let j={};try{j=JSON.parse(out.replace(/```json|```/g,"").trim());}catch(e){j={summary:out.slice(0,100),next_actions:[]};}
      window._batchResults.push({no,cust,j});
      if(row){row.firstChild.textContent="✅";row.style.opacity=.55;row.style.background="";}
      DATA.timeline[no]=DATA.timeline[no]||[];
      const batchItem={t:nowBJ(),who:"AI 批量分析 · "+CURRENT_USER.nm,txt:"🤖 "+(j.summary||""),summary:j.summary||"",nextActions:j.next_actions||[],key:"batch_"+Date.now()+"_"+no};
      DATA.timeline[no].unshift(batchItem);
      cust.aiLastAt=Date.now();persistCust(no);sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"timeline",target_client:String(no),detail:JSON.stringify(batchItem)});sbReq("audit_logs","POST",{account_id:CURRENT_USER.id,display_name:CURRENT_USER.nm,action:"ai_last_at",target_client:String(no),detail:String(Date.now())});
    }catch(e){
      if(row){row.firstChild.textContent="❌";row.style.background="rgba(248,113,113,.08)";}
    }
    const done=window._batchResults.length;
    const pct=Math.round(done/total*100);
    const bar=document.getElementById("batchBar");const pctEl=document.getElementById("batchPct");
    if(bar)bar.style.width=pct+"%";
    if(pctEl)pctEl.textContent=done+" / "+total+"（"+pct+"%）";
  }
  btn.disabled=false;
  if(pauseBtn)pauseBtn.style.display="none";
  if(window._batchPaused){
    btn.innerHTML="▶ 繼續分析剩餘 "+(total-window._batchResults.length)+" 位";
    btn.onclick=function(){window._batchPaused=false;if(pauseBtn)pauseBtn.textContent="⏸ 暫停分析";runBatchAI(...nos);};
  } else {
    btn.innerHTML="✓ 確認寫入";
    btn.onclick=applyBatchResults;
  }
  localStorage.setItem("bcd_batch_ai_last",nowBJ()+" 完成 "+window._batchResults.length+" 位客戶");
}

function openDocFolder(no){

function fileThumbDel(f,no,isAdmin){
  const url=FILEBASE+f.path;
  const isImg=f.type==="image";
  const ic=f.type==="pdf"?"📄":f.type==="text"?"📝":"📎";
  const pv=isImg?`<div class="pv" onclick="openModalImg('${url}')"><img src="${url}" loading="lazy"></div>`:`<a class="pv" href="${url}" target="_blank" rel="noopener">${ic}</a>`;
  const dt=CUST_CREATED[no]||"—";
  const cell=`${pv}<div class="fn">${esc(f.name)}</div><div class="meta">${dt} · 系統管理員上傳</div>`;
  if(!isAdmin)return `<div class="file-cell">${cell}</div>`;
  const acts=`<div style="display:flex;gap:4px;padding:0 6px 8px">
    <a class="btn small" style="text-decoration:none;flex:1;text-align:center" href="${url}" download>下載</a>
    <button class="btn small" style="flex:1" onclick="moveFile('${no}','${esc(f.name)}')">轉存</button>
    <button class="btn small" style="flex:1;background:var(--err);color:#fff;border:none" onclick="delFile('${no}','${esc(f.name)}')"title="刪除" style="flex:1">刪除</button></div>`;
  return `<div class="file-cell">${cell}${acts}</div>`;
}
function moveFile(no,name){
  const targets=DATA.customers.filter(c=>c.no!==no).map(c=>`${c.no} ${c.name}`).join("｜");
  const t=prompt("轉存到客戶編號（現有："+targets+"）：");if(!t)return;
  const tn=t.trim().split(/\s+/)[0];
  if(!DATA.customers.find(c=>c.no===tn)){toast("找不到客戶 "+tn);return;}
  const arr=(DATA.files||{})[no]||[];const i=arr.findIndex(x=>x.name===name);if(i<0)return;
  const f=arr.splice(i,1)[0];(DATA.files||{})[tn]=DATA.files[tn]||[];DATA.files[tn].unshift(f);
  addAudit("轉存檔案",`${no} / ${name} → ${tn}`);render();openDocFolder(no);toast("已轉存到 #"+tn);
}
function delFile(no,name){if(CURRENT_USER.role!=="super_admin"){toast("僅超級管理員可刪除");return;}if(!confirm("確定刪除 "+name+"？此動作會同步從雲端移除"))return;
  const arr=(DATA.files||{})[no]||[];const i=arr.findIndex(x=>x.name===name);if(i>=0)arr.splice(i,1);
  addAudit("刪除檔案",no+" / "+name);render();openDocFolder(no);toast("已刪除");}

function auditRow(a){return `<div style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-size:13px">
 <span style="color:var(--mut);font-size:11px;min-width:90px;font-variant-numeric:tabular-nums">${a.t}</span>
 <span style="flex:1;line-height:1.6"><span style="font-weight:600">${esc(a.user)}</span> ${esc(a.detail||a.action)}</span></div>`;}
function filterAudit(f){const list=auditLog.filter(a=>!f||(a.action+a.detail).includes(f));document.getElementById("auditArea").innerHTML=list.slice(0,100).map(a=>auditRow(a)).join("")||"<div class='empty'>無符合記錄</div>";}
function filterAuditByUser(u){const list=u?auditLog.filter(a=>a.user===u):auditLog;document.getElementById("auditArea").innerHTML=list.slice(0,100).map(a=>auditRow(a)).join("")||"<div class='empty'>無符合記錄</div>";}
function exportAuditXlsx(){if(CURRENT_USER.role!=="super_admin"){toast("僅超管可匯出審計");return;}
const head=["時間","操作人","動作","詳情"];const rows=auditLog.map(a=>[a.t,a.user,a.action,a.detail||""]);
if(typeof XLSX!=="undefined"){const ws=XLSX.utils.aoa_to_sheet([head,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"審計日誌");XLSX.writeFile(wb,"審計日誌_"+new Date().toISOString().slice(0,10)+".xlsx");toast("審計日誌已匯出 Excel");}
else{const csv="\ufeff"+[head,...rows].map(r=>r.map(x=>`"${String(x||"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="審計日誌.csv";a.click();toast("已匯出 CSV");}}

<div class="fg"><label>上級</label><select id="au_parent">${parentOpts.map(p=>`<option value="${p[0]}" ${u&&u.parent===p[0]?"selected":""}>${p[1]}</option>`).join("")}</select></div>

<input type="checkbox" id="au_p_${k}" ${cur?"checked":""} ${(k==="github"||k==="system")&&!canSuper?"disabled":""} style="width:16px;height:16px;accent-color:#6366f1"> ${lb}</label>`;}).join("")}
</div>
<div class="mrow"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUser()">${u?"儲存":"建立"}</button></div>`);}
async function saveUser(){const id=document.getElementById("au_user").value.trim();const nm=document.getElementById("au_name").value.trim();if(!id||!nm){toast("請填登入帳號與真實姓名");return;}
const role=document.getElementById("au_role").value;const parent=document.getElementById("au_parent").value||null;const pwd=document.getElementById("au_pwd").value;const avatar=document.getElementById("au_avatar").value.trim()||nm.charAt(0);
const perms={};Object.keys(PERM_LABELS).forEach(k=>{const el=document.getElementById("au_p_"+k);perms[k]=el?el.checked:false;});
if(_editUid){const u=USERS.find(x=>x.id===_editUid);u.nm=nm;u.role=role;u.parent=parent;u.avatar=avatar;u.perms=perms;if(pwd)u.pwd=pwd;syncUserToDB(u);addAudit("編輯帳戶",nm);}
else{if(USERS.some(x=>x.id===id)){toast("帳號已存在");return;}const row={id,nm,pwd:pwd||"0000",role,parent,active:true,lastLogin:"",avatar,perms};USERS.push(row);
  const res=await sbReq("accounts","POST",{id,display_name:nm,pin:String(pwd||"0000"),role:dbRoleOf(role),parent_id:parent||null,active:true,avatar_url:avatar||null});
  if(res===null)toast("注意：後台未開新帳號寫入權限，本帳號僅本機生效");
  addAudit("新增帳戶",nm);}
closeModal();render();toast("帳戶已儲存");}

<div class="mrow"><button class="btn" onclick="closeModal()">關閉</button></div>`);}
